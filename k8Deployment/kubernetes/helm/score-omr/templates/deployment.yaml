# One process per Pod consumes at most one score at a time. No Service or
# Ingress exists because all traffic is outbound to private stateful services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clouddsp-score-omr
  namespace: clouddsp-app
  labels: {app.kubernetes.io/name: score-omr, app.kubernetes.io/component: score-converter, app.kubernetes.io/part-of: clouddsp}
spec:
  # KEDA owns /scale; Helm must not write a fixed replica count.
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 900
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 0}}
  selector:
    matchLabels: {app.kubernetes.io/name: score-omr, app.kubernetes.io/component: score-converter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: score-omr, app.kubernetes.io/component: score-converter, app.kubernetes.io/part-of: clouddsp}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Four 120-second pages plus rendering/conversion can finish on TERM;
      # a forced kill still returns unacknowledged work to RabbitMQ.
      terminationGracePeriodSeconds: 660
      securityContext:
        runAsNonRoot: true
        runAsUser: 10007
        runAsGroup: 10007
        fsGroup: 10007
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: score-omr
          image: {{ .Values.image.reference }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOME, value: /home/score-omr}
            - {name: TMPDIR, value: /tmp}
            - {name: SCORE_DB_USER, valueFrom: {secretKeyRef: {name: clouddsp-score-omr-database-credentials, key: SCORE_DB_USER}}}
            - {name: SCORE_DB_PASSWORD, valueFrom: {secretKeyRef: {name: clouddsp-score-omr-database-credentials, key: SCORE_DB_PASSWORD}}}
            - {name: SCORE_S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: clouddsp-score-omr-minio-credentials, key: SCORE_OMR_S3_ACCESS_KEY}}}
            - {name: SCORE_S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: clouddsp-score-omr-minio-credentials, key: SCORE_OMR_S3_SECRET_KEY}}}
            - {name: SCORE_AMQP_USER, valueFrom: {secretKeyRef: {name: clouddsp-score-omr-rabbitmq-credentials, key: RABBITMQ_SCORE_OMR_USERNAME}}}
            - {name: SCORE_AMQP_PASSWORD, valueFrom: {secretKeyRef: {name: clouddsp-score-omr-rabbitmq-credentials, key: RABBITMQ_SCORE_OMR_PASSWORD}}}
          resources:
            # Local Debussy runs peaked near 2 GiB. Reserve 1 CPU/2 GiB and
            # cap each CPU worker at 2 CPU/4 GiB so two Pods fit the Mac node.
            requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 1Gi}
            limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: scratch, mountPath: /worker-scratch}
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/score-omr}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: home
          emptyDir: {sizeLimit: 64Mi}
