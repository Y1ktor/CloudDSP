# This outbound-only renderer needs neither a Service nor inbound traffic.
# DNS and the three private dependencies are its entire runtime network access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clouddsp-midi-sheet
  namespace: clouddsp-app
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: midi-sheet}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: clouddsp-data}
          podSelector:
            matchLabels: {app.kubernetes.io/name: postgresql}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: clouddsp-data}
          podSelector:
            matchLabels: {app.kubernetes.io/name: minio}
      ports: [{protocol: TCP, port: 9000}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: clouddsp-data}
          podSelector:
            matchLabels: {app.kubernetes.io/name: rabbitmq}
      ports: [{protocol: TCP, port: 5672}]
