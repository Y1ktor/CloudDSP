# This committed file is a credential *template*, not a Secret that may be
# applied unchanged. Copy it to
# `k8Deployment/.local/keda-rabbitmq-scaler-credentials.secret.yaml`, replace
# its password placeholder, then apply only that ignored local copy. The
# corresponding RabbitMQ user is created by the separate administrator Job.
#
# This Secret belongs in clouddsp-app because future ScaledObjects and their
# namespaced TriggerAuthentication also belong there. Kubernetes does not let
# a namespaced resource read a Secret from clouddsp-data or keda.
apiVersion: v1
kind: Secret
metadata:
  # This name is intentionally KEDA-specific. It is not mounted by a worker,
  # does not contain the RabbitMQ administrator account, and is not a generic
  # credential shared with MinIO, PostgreSQL, Keycloak, or the browser.
  name: clouddsp-keda-rabbitmq-scaler-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: keda
    app.kubernetes.io/component: rabbitmq-scaler-authentication
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: read-only-rabbitmq-queue-observation
type: Opaque
stringData:
  # The broker identity has RabbitMQ's read-only `monitoring` tag and empty
  # configure/write/read resource regexes. KEDA uses it only through the
  # management HTTP API to obtain queue metrics; it cannot consume, publish,
  # acknowledge, declare, delete, or purge messages.
  RABBITMQ_KEDA_SCALER_USERNAME: clouddsp-keda-scaler
  RABBITMQ_KEDA_SCALER_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_KEDA_RABBITMQ_SCALER_PASSWORD
