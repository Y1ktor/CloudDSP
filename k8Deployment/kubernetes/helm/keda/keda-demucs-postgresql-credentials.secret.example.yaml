# Copy this template to the ignored path
# k8Deployment/.local/keda-demucs-postgresql-credentials.secret.yaml and set
# the password to the restricted PostgreSQL scaler role's password. Apply the
# local copy to clouddsp-app; never commit a live password in this template.
apiVersion: v1
kind: Secret
metadata:
  # TriggerAuthentication reads a Secret from its own namespace. This Secret
  # is consumed by KEDA only; the Demucs Pod does not mount a database scaler
  # credential or gain any new PostgreSQL permissions.
  name: clouddsp-keda-demucs-postgresql-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: keda
    app.kubernetes.io/component: demucs-postgresql-scaler-authentication
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: read-only-demucs-task-count
type: Opaque
stringData:
  POSTGRESQL_KEDA_DEMUCS_PASSWORD: REPLACE_WITH_LOCAL_DEMUCS_SCALER_PASSWORD
