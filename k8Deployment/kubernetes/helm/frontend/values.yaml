  reference: clouddsp-registry.localhost:5001/frontend@sha256:8494bbcea710fd4d902f2b57c81e53f1464a0c1d1e8b8a141cc9e3d63bf3149c

# This hostname is registered as the local Keycloak redirect/logout origin.
