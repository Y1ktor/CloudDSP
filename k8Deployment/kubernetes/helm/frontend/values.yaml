# The digest must match images.frontend.immutableReference in the reviewed
# ../../images.lock.yaml. Vite public browser configuration is baked into this
# image during its separate build and is not supplied as Helm Secret values.
image:
  reference: clouddsp-registry.localhost:5001/frontend@sha256:913e4264b8f54debcc78501640784a8aee6c78d35614d2a0046111c5f088c55a

# This hostname is registered as the local Keycloak redirect/logout origin.
# The Traefik route stays HTTP-only on k3d's loopback port 8080.
ingress:
  host: clouddsp.localhost
