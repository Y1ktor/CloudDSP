{{/* Validate the relationship that JSON Schema cannot express across fields. */}}
{{- if gt (int .Values.autoscaling.minReplicaCount) (int .Values.autoscaling.maxReplicaCount) -}}
{{- fail "autoscaling.minReplicaCount must not exceed autoscaling.maxReplicaCount" -}}
{{- end -}}
# Numeric examples below describe the reviewed defaults in values.yaml.
# Helm values may change the warm-worker floor, capacity ceiling, thresholds,
# and timing without changing this worker's target, credentials, or query.
# This ScaledObject delegates only the Demucs Deployment's replica count to
# KEDA. The Deployment still owns the worker image, security context, resource
# requests, Secrets, SIGTERM handling, and rollout strategy. KEDA creates a
# standard HorizontalPodAutoscaler (HPA) which changes the Deployment's
# `/scale` subresource; it does not create Kubernetes Jobs or consume a
# RabbitMQ delivery itself.
#
# PostgreSQL task leases and manual AMQP acknowledgement remain the durable
# processing boundary. Demucs acknowledges a message as soon as its task lease
# commits, before long CPU inference. RabbitMQ depth alone therefore falls to
# zero while the worker is busy. A second, read-only PostgreSQL trigger keeps
# the Pod present for active leases and wakes it for due database-only retries.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  # A separate object per worker stage keeps queue names, capacity ceilings,
  # and scale behavior reviewable. It must never select Basic Pitch or ADTOF.
  name: clouddsp-demucs-rabbitmq-scaler
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: demucs
    app.kubernetes.io/instance: clouddsp-demucs
    app.kubernetes.io/component: work-autoscaler
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: Helm
    clouddsp.io/environment: local
    clouddsp.io/purpose: queue-and-task-autoscale-private-audio-separation-worker
spec:
  # KEDA/HPA changes replicas on this normal Deployment controller only. A Pod
  # or ReplicaSet would be the wrong target because a Deployment owns their
  # lifecycle and its standard `scale` subresource is the autoscaling API.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clouddsp-demucs

  # A 15-second observation cadence keeps local scale-from-zero responsive
  # without continuously polling RabbitMQ's management API from the laptop.
  pollingInterval: {{ .Values.autoscaling.pollingInterval }}
  # Demucs has a roughly 480 MiB image and CPU model runtime. Keeping one idle
  # worker warm for five minutes avoids repeated image/model startup around
  # nearby uploads, yet permits a truly idle local cluster to return to zero.
  cooldownPeriod: {{ .Values.autoscaling.cooldownPeriod }}
  # Both triggers below must be inactive before KEDA returns to zero. RabbitMQ
  # activates a Pod for an unclaimed request; PostgreSQL holds it while a
  # claimed task runs and reactivates it when a scheduled retry becomes due.
  minReplicaCount: {{ .Values.autoscaling.minReplicaCount }}
  # One local Demucs Pod requests 2 CPU and 2 GiB (up to 4 CPU/4 GiB). Cap this
  # CPU-only Apple-Silicon profile at one Pod: another heavy model can starve
  # PostgreSQL, RabbitMQ, and later MIDI workers. Backlog remains safe in the
  # quorum queue; a GPU-node profile may review a different ceiling separately.
  maxReplicaCount: {{ .Values.autoscaling.maxReplicaCount }}

  advanced:
    # Removing this resource in an explicit rollback restores the Deployment's
    # original desired count (one), rather than leaving it at a dynamic zero.
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          # The one-Pod local ceiling already prevents a burst from starting
          # multiple costly models. No extra scale-up stabilization is needed.
          stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: {{ .Values.autoscaling.behavior.scaleUp.value }}
              periodSeconds: {{ .Values.autoscaling.behavior.scaleUp.periodSeconds }}
        scaleDown:
          # Preserve the worker across a few metric observations. KEDA's
          # cooldown performs the eventual one-to-zero transition after the
          # queue is inactive; this HPA window avoids a short false dip first.
          stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: {{ .Values.autoscaling.behavior.scaleDown.value }}
              periodSeconds: {{ .Values.autoscaling.behavior.scaleDown.periodSeconds }}

  triggers:
    - type: rabbitmq
      metadata:
        # KEDA observes queue depth through the private management ClusterIP.
        # This is not the AMQP service, a Mac host port, or an Ingress route.
        host: http://clouddsp-rabbitmq-management.clouddsp-data.svc:15672
        protocol: http
        vhostName: /clouddsp
        # Observe only the already bootstrapped source-separation queue. KEDA
        # cannot consume, acknowledge, declare, bind, or publish messages.
        queueName: clouddsp.demucs.requests
        mode: QueueLength
        # A ready or unacknowledged request activates the worker before its
        # PostgreSQL task exists. This metric stops representing work after
        # the worker durably claims and acknowledges that request.
        value: {{ .Values.autoscaling.rabbitmq.queueLength | quote }}
        # Zero means inactive, enabling KEDA's scale-to-zero behavior.
        activationValue: {{ .Values.autoscaling.rabbitmq.activationValue | quote }}
        # Include the brief unacknowledged interval between AMQP delivery and
        # durable claim. The PostgreSQL trigger below covers work after ACK.
        excludeUnacknowledged: "false"
        # Bound a temporarily impaired private management API observation.
        timeout: {{ .Values.autoscaling.rabbitmq.timeout | quote }}
      authenticationRef:
        # Reuse the existing namespaced TriggerAuthentication. It supplies
        # only RabbitMQ's read-only monitoring identity to KEDA, never a
        # Demucs worker, PostgreSQL, MinIO, or RabbitMQ administrator Secret.
        name: clouddsp-rabbitmq-scaler-authentication
    - type: postgresql
      metadata:
        # KEDA's operator runs in its own namespace. The fully qualified
        # ClusterIP DNS name reaches the private application database without
        # a host port or browser-facing Ingress.
        host: clouddsp-postgresql.clouddsp-data.svc
        port: "5432"
        dbName: clouddsp_job_api
        userName: clouddsp-keda-demucs
        sslmode: disable
        # COUNT returns exactly one numeric row. A running/leased task remains
        # visible after RabbitMQ ACK, preventing the five-minute queue-only
        # scale-down from terminating its CPU child. A due retry also activates
        # a new Pod after the previous owner exited; future retries do not
        # consume an idle replica before their available_at time.
        # Preserve the exact original SQL through Flux's YAML postrenderer.
        # Folded YAML with deeper indentation can acquire blank lines when
        # origin labels are added. Quoting explicit newlines keeps source,
        # chart, stored Helm history, and live spec comparisons identical.
        query: {{ "SELECT COUNT(*)::bigint FROM public.processing_tasks WHERE stage = 'demucs'\n  AND (status IN ('leased', 'running')\n    OR (status = 'retry_scheduled' AND available_at <= CURRENT_TIMESTAMP))" | quote }}
        targetQueryValue: {{ .Values.autoscaling.postgresql.targetQueryValue | quote }}
        activationTargetQueryValue: {{ .Values.autoscaling.postgresql.activationTargetQueryValue | quote }}
      authenticationRef:
        # This credential can read only stage, status, and available_at from
        # processing_tasks. It cannot read job ownership, object keys, event
        # payloads, or worker credentials.
        name: clouddsp-demucs-postgresql-scaler-authentication
