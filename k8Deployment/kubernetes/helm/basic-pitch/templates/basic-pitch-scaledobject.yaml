{{/* Validate the relationship that JSON Schema cannot express across fields. */}}
{{- if gt (int .Values.autoscaling.minReplicaCount) (int .Values.autoscaling.maxReplicaCount) -}}
{{- fail "autoscaling.minReplicaCount must not exceed autoscaling.maxReplicaCount" -}}
{{- end -}}
# Numeric examples below describe the reviewed defaults in values.yaml.
# Helm values may change the warm-worker floor, capacity ceiling, thresholds,
# and timing without changing this worker's target, credentials, or query.
# This ScaledObject delegates the *number of Basic Pitch worker Pods* to KEDA.
# The Basic Pitch Deployment remains the owner of the Pod template, immutable
# image, least-privilege identities, resource limits, rollout behavior, and
# SIGTERM handling. This is not a Kubernetes Job: RabbitMQ retains durable
# work, while each worker commits its PostgreSQL task lease and manually
# acknowledges the AMQP delivery before CPU inference. The broker queue can
# be empty while inference is still running; a read-only PostgreSQL
# trigger keeps the Pod present for active leases and due retries.
#
# KEDA creates one ordinary Kubernetes HPA for this exact Deployment. That HPA
# writes only the Deployment `/scale` subresource; it neither bypasses the
# Deployment controller nor runs a second kind of Basic Pitch worker.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: clouddsp-basic-pitch-rabbitmq-scaler
  namespace: clouddsp-app
  {{- if .Values.maintenance.pauseForRoutingSmoke }}
  # A controlled dispatcher smoke must be the only reader of the synthetic
  # delivery. KEDA pauses autoscaling AND sets the target to zero until the
  # normal chart is restored. Never enable this while real work is active.
  annotations:
    autoscaling.keda.sh/paused-replicas: "0"
  {{- end }}
  labels:
    app.kubernetes.io/name: basic-pitch
    app.kubernetes.io/instance: clouddsp-basic-pitch
    app.kubernetes.io/component: queue-autoscaler
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: Helm
    clouddsp.io/environment: local
    clouddsp.io/purpose: queue-and-task-autoscale-private-midi-worker
spec:
  # This is the controller whose standard apps/v1 `scale` subresource KEDA/HPA
  # manages. It must not be an individual Pod, a ReplicaSet, a Service, or a
  # RabbitMQ queue.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clouddsp-basic-pitch

  # A new Basic Pitch backlog is usually a short burst of stems from one
  # Demucs result. Five-second polling limits scale-from-zero detection delay
  # without continuously querying RabbitMQ from the local control plane.
  pollingInterval: {{ .Values.autoscaling.pollingInterval }}
  # The local 520 MB image starts from the colocated registry in about seven
  # seconds when uncached, so retaining an idle TensorFlow process for three
  # minutes is unnecessary. One minute absorbs nearby stems but returns the
  # CPU/memory reservation to the cluster promptly after a short burst.
  cooldownPeriod: {{ .Values.autoscaling.cooldownPeriod }}
  # Both the broker queue and the durable task count must be idle before
  # KEDA returns the Deployment to zero. A due database retry can reactivate
  # the worker even when its original AMQP delivery was already acknowledged.
  minReplicaCount: {{ .Values.autoscaling.minReplicaCount }}
  # Each Pod requests one CPU and 2 GiB memory. Three replicas let a five-stem
  # burst process three stems concurrently while leaving the remaining durable
  # messages queued. Kubernetes still schedules only where requested capacity
  # exists; this is a ceiling, not a promise that all three Pods fit.
  maxReplicaCount: {{ .Values.autoscaling.maxReplicaCount }}

  advanced:
    # If an explicit future rollback removes this ScaledObject, restore the
    # Deployment's pre-KEDA desired count rather than leave the worker at a
    # dynamic value such as zero.
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          # A five-stem Demucs burst should not wait through several 30-second
          # one-Pod increments. The HPA may add up to three Pods per 15-second
          # control interval, bounded above by maxReplicaCount and real node
          # capacity. RabbitMQ retains excess work if a Pod is Pending.
          stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: {{ .Values.autoscaling.behavior.scaleUp.value }}
              periodSeconds: {{ .Values.autoscaling.behavior.scaleUp.periodSeconds }}
        scaleDown:
          # A claimed request is ACKed before up to five minutes of bounded
          # inference. While two tasks are in progress, one may finish first;
          # a quick 2 -> 1 scale-in can kill the other task's Pod because the
          # Deployment cannot distinguish busy from idle replicas. Hold the
          # earlier desired count for six minutes, beyond the model deadline.
          # KEDA's cooldown handles the final idle transition to zero.
          stabilizationWindowSeconds: {{ .Values.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: {{ .Values.autoscaling.behavior.scaleDown.value }}
              periodSeconds: {{ .Values.autoscaling.behavior.scaleDown.periodSeconds }}

  triggers:
    - type: rabbitmq
      metadata:
        # KEDA observes the broker through the private ClusterIP management
        # Service. It has no host port or Ingress, and the broker NetworkPolicy
        # permits this listener only from KEDA and reviewed bootstrap Jobs.
        host: http://clouddsp-rabbitmq-management.clouddsp-data.svc:15672
        protocol: http
        # The dedicated monitoring identity can inspect management metrics but
        # has no AMQP configure/write/read permissions. It cannot consume or
        # acknowledge this queue.
        vhostName: /clouddsp
        queueName: clouddsp.basic-pitch.requests
        mode: QueueLength
        # Workers use prefetch one, so a target queue depth of one represents
        # approximately one ready or unacknowledged task per worker. The HPA
        # respects maxReplicaCount when deriving its desired replica count.
        value: {{ .Values.autoscaling.rabbitmq.queueLength | quote }}
        # A zero backlog is inactive and enables KEDA's scale-to-zero path.
        activationValue: {{ .Values.autoscaling.rabbitmq.activationValue | quote }}
        # Count the brief unacknowledged interval before a durable claim.
        # After ACK, the PostgreSQL trigger below tracks the active lease.
        excludeUnacknowledged: "false"
        # Do not let a temporarily impaired management endpoint make one
        # polling attempt wait forever.
        timeout: {{ .Values.autoscaling.rabbitmq.timeout | quote }}
      authenticationRef:
        # This namespaced TriggerAuthentication exposes only KEDA's dedicated
        # monitoring credential. Basic Pitch's database, MinIO, RabbitMQ
        # consumer, and administrator credentials are never supplied to KEDA.
        name: clouddsp-rabbitmq-scaler-authentication
    - type: postgresql
      metadata:
        # Reuse the existing restricted task-count login. It has SELECT only
        # on processing_tasks.stage/status/available_at, with no Job, object
        # key, write, or worker credential access. Its historical Demucs name
        # does not limit those column grants to one stage; this query does.
        host: clouddsp-postgresql.clouddsp-data.svc
        port: "5432"
        dbName: clouddsp_job_api
        userName: clouddsp-keda-demucs
        sslmode: disable
        # Basic Pitch acknowledges an AMQP request after committing its lease
        # and before model inference. Count active leases so queue drain does
        # not scale away an executing Pod. A due retry also wakes a zero-Pod
        # worker; future retries do not reserve an idle replica.
        query: >-
          SELECT COUNT(*)::bigint FROM public.processing_tasks
          WHERE stage = 'basic-pitch'
            AND (status IN ('leased', 'running')
              OR (status = 'retry_scheduled' AND available_at <= CURRENT_TIMESTAMP))
        targetQueryValue: {{ .Values.autoscaling.postgresql.targetQueryValue | quote }}
        activationTargetQueryValue: {{ .Values.autoscaling.postgresql.activationTargetQueryValue | quote }}
      authenticationRef:
        name: clouddsp-demucs-postgresql-scaler-authentication
