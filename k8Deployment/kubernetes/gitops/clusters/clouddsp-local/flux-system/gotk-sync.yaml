# source-controller downloads the public repository over verified HTTPS.
# Cluster Git access is read-only and needs no Secret or host SSH private key.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  timeout: 60s
  url: https://github.com/Y1ktor/CloudDSP.git
  ref:
    # This branch isolates bootstrap from pending local application changes.
    # Update Git and this reference together when moving GitOps to main.
    branch: main
  # Keep the source artifact focused on versioned GitOps configuration and
  # the selected charts below; each chart is prepared before its handoff.
  # Fetch the next chart before adding its HelmRelease to the root so
  # packaging cannot race the sparse source archive update. An available
  # chart alone grants no ownership.
  sparseCheckout:
    - k8Deployment/kubernetes/gitops
    - k8Deployment/kubernetes/helm/mailpit
    - k8Deployment/kubernetes/helm/frontend
    - k8Deployment/kubernetes/helm/job-api
    - k8Deployment/kubernetes/helm/upload-intake
    - k8Deployment/kubernetes/helm/generic-dispatcher
    - k8Deployment/kubernetes/helm/dispatcher
    - k8Deployment/kubernetes/helm/scaling-auth
    - k8Deployment/kubernetes/helm/adtof
    - k8Deployment/kubernetes/helm/basic-pitch
    - k8Deployment/kubernetes/helm/score-omr
    - k8Deployment/kubernetes/helm/demucs
    - k8Deployment/kubernetes/helm/rabbitmq
    - k8Deployment/kubernetes/helm/postgresql
    - k8Deployment/kubernetes/helm/minio
    - k8Deployment/kubernetes/helm/keycloak
---
# kustomize-controller builds and applies only this cluster's explicit root.
# The explicit root includes Flux and the explicitly selected HelmRelease/RBAC sets.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  path: ./k8Deployment/kubernetes/gitops/clusters/clouddsp-local
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Pruning deletes only objects recorded in this Kustomization's inventory.
  # Removing a tracked Flux resource is therefore a deliberate lifecycle change.
  prune: true
  # Check controller availability after applying manifests, without waiting on
  # every CRD or checking the readiness of unrelated application resources.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: notification-controller
      namespace: flux-system
