# This file lists the only directories this cluster reconciles from Git.
# It is a Kustomize build file, rather than a Flux Kustomization API resource.
# Application handoffs must be added deliberately; retained raw manifests,
# bootstrap Jobs, smoke fixtures, and ignored credentials stay outside this root.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  - keda
  - mailpit
  - frontend
  - job-api
  - upload-intake
  - generic-dispatcher
  - dispatcher
  - scaling-auth
  - adtof
  - basic-pitch
  # The homr identities and v011 lease migration are bootstrapped before
  # enabling this ordinary Deployment and its zero-to-two queue autoscaler.
  - score-omr
  # v012, independent queues, and restricted identities are bootstrapped first.
  - midi-sheet
  - demucs
  - rabbitmq
  - postgresql
  - minio
  - keycloak
