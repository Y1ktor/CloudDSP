# helm-controller reuses the installed clouddsp-dispatcher release and its history.
# This resource is reconciliation configuration; Helm still owns the rendered
# Demucs-only publisher Deployment in the existing clouddsp-app namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clouddsp-dispatcher
  namespace: flux-system
spec:
  interval: 5m
  timeout: 3m
  maxHistory: 10
  # Explicit names avoid Flux's default namespace-prefixed release naming and
  # preserve the namespace where the existing Helm revision Secrets are stored.
  releaseName: clouddsp-dispatcher
  targetNamespace: clouddsp-app
  storageNamespace: clouddsp-app
  serviceAccountName: clouddsp-dispatcher-helm
  # Job API is already a Flux-managed prerequisite in the fresh workflow.
  # This readiness gate does not provision database, broker, or MinIO identities.
  dependsOn:
    - name: clouddsp-job-api
      namespace: flux-system
    - name: clouddsp-rabbitmq
      namespace: flux-system
  chart:
    spec:
      chart: ./k8Deployment/kubernetes/helm/dispatcher
      interval: 1m
      # Rebuild when Git changes, even if Chart.yaml's base version is unchanged.
      # Flux appends a source SHA and values-file generation to the chart version.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      # Git chart values-file paths are relative to the repository root.
      valuesFiles:
        - ./k8Deployment/kubernetes/helm/dispatcher/values.yaml
        # Enabled only by a committed pause; later files override earlier values.
        # - ./k8Deployment/kubernetes/helm/dispatcher/values.smoke-pause.yaml
      ignoreMissingValuesFiles: false
  install:
    createNamespace: false
    # Refuse to take unrelated resources into this release on a fresh install.
    disableTakeOwnership: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 0
      # A failure stays available for inspection; no automatic uninstall follows.
      remediateLastFailure: false
  upgrade:
    disableTakeOwnership: true
    # Keep the existing CLI release's apply method during its ownership handoff.
    serverSideApply: auto
    force: false
    cleanupOnFail: false
    preserveValues: false
    # Avoid an implicit uninstall/reinstall if a later chart name changes.
    chartNameChangeStrategy: InPlaceUpdate
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 0
      # An adopted release must not be automatically rolled back or uninstalled.
      remediateLastFailure: false
  # Publisher readiness and digest are deployment checks. Separate disposable
  # routing and source-to-outbox Jobs test publishing and intake; they are not
  # chart hooks and this identity cannot create them. Pause through Git values.
  test:
    enable: false
  # After the release is in sync, correct live drift against its stored manifest.
  driftDetection:
    mode: enabled
