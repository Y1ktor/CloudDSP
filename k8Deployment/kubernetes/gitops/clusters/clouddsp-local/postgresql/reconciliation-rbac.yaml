# Helm actions impersonate this identity; no workload mounts its API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clouddsp-postgresql-helm
  namespace: flux-system
automountServiceAccountToken: false
---
# Deliver exactly the PostgreSQL workload and Service kinds in the existing data
# namespace. StatefulSet mutation can mount namespace Secrets and retained PVCs;
# this trusted delivery role is not isolation from the other data services.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clouddsp-postgresql-helm
  namespace: clouddsp-data
rules:
  # Kubernetes cannot restrict create by resourceNames. All other mutations
  # are restricted to the three reviewed chart identities below.
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [clouddsp-postgresql]
    verbs: [get, update, patch, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [create]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [clouddsp-postgresql, clouddsp-postgresql-headless]
    verbs: [get, update, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [list, watch]
  # Read-only Pods/claims support Helm readiness; generated PVCs remain retained.
  # No PVC/PV mutation, exec, Job creation, or cluster API permission is granted.
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch]
  # Helm needs namespace-wide revision Secret storage. This also permits access
  # to data-service credentials; RBAC cannot limit Helm's list to one prefix.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
# Bind the Flux impersonation identity only into the existing data namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clouddsp-postgresql-helm
  namespace: clouddsp-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clouddsp-postgresql-helm
subjects:
  - kind: ServiceAccount
    name: clouddsp-postgresql-helm
    namespace: flux-system
