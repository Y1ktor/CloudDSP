# helm-controller impersonates this identity; no workload Pod uses its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clouddsp-scaling-auth-helm
  namespace: flux-system
automountServiceAccountToken: false
---
# This chart owns no Pods, Deployments, ScaledObjects, HPAs, Jobs, PVCs, CRDs,
# or cluster RBAC. Restrict resource writes to namespaced authentications.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clouddsp-scaling-auth-helm
  namespace: clouddsp-app
rules:
  - apiGroups: [keda.sh]
    resources: [triggerauthentications]
    verbs: [get, list, watch, create, update, patch, delete]
  # Helm lists and writes revision Secrets. This permission covers every
  # Secret in clouddsp-app, including runtime credentials; Kubernetes RBAC
  # cannot limit a list operation to the Helm release's name prefix.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
# Bind only the existing application namespace to the Flux identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clouddsp-scaling-auth-helm
  namespace: clouddsp-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clouddsp-scaling-auth-helm
subjects:
  - kind: ServiceAccount
    name: clouddsp-scaling-auth-helm
    namespace: flux-system
