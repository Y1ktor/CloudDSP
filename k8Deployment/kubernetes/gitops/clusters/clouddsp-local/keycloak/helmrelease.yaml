# helm-controller reuses the installed clouddsp-keycloak release and its history.
# This resource is reconciliation configuration; Helm still owns the rendered
# Deployment, Service and Ingress in the existing clouddsp-data namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clouddsp-keycloak
  namespace: flux-system
spec:
  interval: 5m
  timeout: 7m
  maxHistory: 10
  # Explicit names avoid Flux's default namespace-prefixed release naming and
  # preserve the namespace where the existing Helm revision Secrets are stored.
  releaseName: clouddsp-keycloak
  targetNamespace: clouddsp-data
  storageNamespace: clouddsp-data
  serviceAccountName: clouddsp-keycloak-helm
  # Keycloak requires its existing isolated PostgreSQL database and Mailpit
  # SMTP Service. Readiness does not provision a realm, user, database or grant.
  dependsOn:
    - name: clouddsp-postgresql
      namespace: flux-system
    - name: clouddsp-mailpit
      namespace: flux-system
  chart:
    spec:
      chart: ./k8Deployment/kubernetes/helm/keycloak
      interval: 1m
      # Rebuild when Git changes, even if Chart.yaml's base version is unchanged.
      # Flux appends a source SHA and values-file generation to the chart version.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      # Git chart values-file paths are relative to the repository root.
      valuesFiles:
        - ./k8Deployment/kubernetes/helm/keycloak/values.yaml
      ignoreMissingValuesFiles: false
  install:
    createNamespace: false
    # Refuse to take unrelated resources into this release on a fresh install.
    disableTakeOwnership: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 0
      # A failure stays available for inspection; no automatic uninstall follows.
      remediateLastFailure: false
  upgrade:
    disableTakeOwnership: true
    # Preserve native apply behavior and the unchanged Pod template so this
    # delivery handoff does not trigger a Recreate rollout.
    serverSideApply: auto
    force: false
    cleanupOnFail: false
    preserveValues: false
    # Avoid an implicit uninstall/reinstall if a later chart name changes.
    chartNameChangeStrategy: InPlaceUpdate
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 0
      # An adopted release must not be automatically rolled back or uninstalled.
      remediateLastFailure: false
  # OIDC smoke is a separate versioned Job. Realm/client/SMTP state, runtime
  # credentials and the PostgreSQL database remain outside this HelmRelease.
  test:
    enable: false
  # After the release is in sync, correct live drift against its stored manifest.
  driftDetection:
    mode: enabled
