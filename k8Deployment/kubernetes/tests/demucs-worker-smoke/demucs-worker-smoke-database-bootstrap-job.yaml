# This administrator-only one-shot Job provisions the database boundary for
# the Demucs stage smoke test. Its future restricted client may call only three
# fixed SECURITY DEFINER functions; it receives no direct jobs/outbox/tasks
# table access and cannot publish or consume RabbitMQ work.
apiVersion: batch/v1
kind: Job
metadata:
  name: demucs-worker-smoke-database-bootstrap
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: demucs-worker-smoke-database-bootstrap
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: fixed-scope-demucs-worker-smoke-provisioning
spec:
  # Retain safe privilege evidence long enough to inspect, then remove the Pod
  # that mounted administrator credentials. The temporary Secret is separate.
  ttlSecondsAfterFinished: 600
  # Never retry partial DDL automatically. A failed run needs an explicit
  # diagnosis instead of a hidden second administrator operation.
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demucs-worker-smoke-database-bootstrap
        app.kubernetes.io/component: database-bootstrap
        app.kubernetes.io/part-of: clouddsp
        clouddsp.io/environment: local
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        # The pinned official PostgreSQL image exposes this non-root account.
        # Database authorization, not a root container, supplies DDL power.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql-bootstrap-client
          image: docker.io/library/postgres@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: clouddsp-postgresql.clouddsp-data.svc
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT
              value: "10"
            # Root-like database credentials stay in this finite bootstrap Pod,
            # never in the later integration-test client.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: clouddsp-postgresql-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: clouddsp-postgresql-credentials
                  key: POSTGRES_PASSWORD
            # This namespace-local copy defines the isolated role that will be
            # created. It must match the app-namespace runtime Secret exactly.
            - name: DEMUCS_WORKER_SMOKE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: clouddsp-demucs-worker-smoke-database-bootstrap-credentials
                  key: DEMUCS_WORKER_SMOKE_DB_NAME
            - name: DEMUCS_WORKER_SMOKE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clouddsp-demucs-worker-smoke-database-bootstrap-credentials
                  key: DEMUCS_WORKER_SMOKE_DB_USERNAME
            - name: DEMUCS_WORKER_SMOKE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clouddsp-demucs-worker-smoke-database-bootstrap-credentials
                  key: DEMUCS_WORKER_SMOKE_DB_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              # A quoted heredoc keeps the shell from expanding SQL or the
              # named dollar quotes below. `ON_ERROR_STOP` makes any rejected
              # schema/privilege invariant a nonzero Kubernetes Job result.
              printf 'Provisioning fixed-scope Demucs worker smoke access through Service %s:%s\n' "$PGHOST" "$PGPORT"

              PGDATABASE="$DEMUCS_WORKER_SMOKE_DB_NAME" \
                psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 \
                  --set=smoke_db_name="$DEMUCS_WORKER_SMOKE_DB_NAME" \
                  --set=smoke_db_username="$DEMUCS_WORKER_SMOKE_DB_USERNAME" \
                  --set=smoke_db_password="$DEMUCS_WORKER_SMOKE_DB_PASSWORD" <<'SQL'
              -- Fail fast unless the durable Job, Demucs-task, and downstream
              -- outbox schema already exists. These zero-row probes print no
              -- historical jobs, payloads, object keys, or credentials.
              SELECT job_id, source_uploaded, stem_mode, status, stems, expires_at
              FROM public.jobs LIMIT 0;
              SELECT event_id, job_id, stage, stem_name, event_type, payload,
                     publication_status, published_at
              FROM public.outbox_events LIMIT 0;
              SELECT task_id, job_id, stage, stem_name, request_event_id,
                     status, attempt_count, lease_token, lease_expires_at, completed_at
              FROM public.processing_tasks LIMIT 0;

              DO $bootstrap$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1 FROM public.schema_migrations
                  WHERE migration_id = 'v004_downstream_outbox_events'
                ) THEN
                  RAISE EXCEPTION 'Required v004 downstream outbox migration is missing.';
                END IF;
                IF NOT EXISTS (
                  SELECT 1 FROM public.schema_migrations
                  WHERE migration_id = 'v005_basic_pitch_processing_tasks'
                ) THEN
                  RAISE EXCEPTION 'Required v005 Basic Pitch task migration is missing.';
                END IF;
              END;
              $bootstrap$;

              -- Create the login if absent, then converge a deliberate rerun.
              -- `format` keeps identifier/literal values from changing the SQL
              -- structure even when a local Secret was accidentally malformed.
              SELECT format(
                'CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOINHERIT PASSWORD %L',
                :'smoke_db_username', :'smoke_db_password'
              )
              WHERE NOT EXISTS (
                SELECT 1 FROM pg_roles WHERE rolname = :'smoke_db_username'
              )
              \gexec

              ALTER ROLE :"smoke_db_username"
                LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOINHERIT
                PASSWORD :'smoke_db_password';

              -- A reused test role must not inherit or be able to SET ROLE
              -- into another capability. Refuse role membership rather than
              -- treating a name collision as a harmless bootstrap rerun.
              SELECT format(
                $membership_sql$
                  DO $membership$
                  BEGIN
                    IF EXISTS (
                      SELECT 1
                      FROM pg_auth_members AS membership
                      JOIN pg_roles AS member_role ON member_role.oid = membership.member
                      WHERE member_role.rolname = %L
                    ) THEN
                      RAISE EXCEPTION 'Demucs smoke database role must not belong to another PostgreSQL role.';
                    END IF;
                  END;
                  $membership$;
                $membership_sql$,
                :'smoke_db_username'
              )
              \gexec

              -- Start from no application authority. The three function grants
              -- below are the whole client database capability surface.
              REVOKE ALL PRIVILEGES ON DATABASE :"smoke_db_name" FROM :"smoke_db_username";
              GRANT CONNECT ON DATABASE :"smoke_db_name" TO :"smoke_db_username";
              REVOKE ALL PRIVILEGES ON SCHEMA public FROM :"smoke_db_username";
              GRANT USAGE ON SCHEMA public TO :"smoke_db_username";
              REVOKE ALL PRIVILEGES ON ALL TABLES IN SCHEMA public FROM :"smoke_db_username";
              REVOKE ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public FROM :"smoke_db_username";
              REVOKE ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public FROM :"smoke_db_username";

              -- `prepare` accepts only size/hash evidence. It has no caller
              -- supplied Job ID, bucket, key, owner, event, stage, or message
              -- body, so the client cannot turn this into generic Job creation.
              CREATE OR REPLACE FUNCTION public.clouddsp_demucs_worker_smoke_prepare(
                p_source_size_bytes BIGINT,
                p_source_sha256 TEXT
              )
              RETURNS TABLE (smoke_job_id UUID, smoke_event_id UUID)
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public
              AS $smoke_prepare$
              DECLARE
                v_job_id CONSTANT UUID := '12139966-5891-4d53-a817-f3ce1f264c61';
                v_event_id CONSTANT UUID := 'e20cf942-ef7b-478e-89c4-f4795ed801ec';
                v_input_key CONSTANT TEXT :=
                  'uploads/12139966-5891-4d53-a817-f3ce1f264c61/demucs-worker-smoke.wav';
              BEGIN
                IF p_source_size_bytes IS NULL
                   OR p_source_size_bytes < 1
                   OR p_source_size_bytes > 1048576
                   OR p_source_sha256 IS NULL
                   OR p_source_sha256 !~ '^[0-9a-f]{64}$' THEN
                  RAISE EXCEPTION 'Demucs worker smoke source evidence is invalid.';
                END IF;

                PERFORM pg_advisory_xact_lock(842930519);
                -- Previous residue is valuable diagnostic evidence. Do not
                -- overwrite it by treating a repeated fixed-coordinate run as
                -- an idempotent success.
                IF EXISTS (SELECT 1 FROM public.jobs WHERE job_id = v_job_id)
                   OR EXISTS (SELECT 1 FROM public.outbox_events WHERE event_id = v_event_id)
                   OR EXISTS (SELECT 1 FROM public.processing_tasks WHERE job_id = v_job_id) THEN
                  RAISE EXCEPTION 'Demucs worker smoke coordinates are not clean.';
                END IF;

                INSERT INTO public.jobs (
                  job_id, owner_sub, source_type, input_bucket, input_object_key,
                  source_filename, source_content_type, source_size_bytes,
                  source_uploaded, stem_mode, status, expires_at
                )
                VALUES (
                  v_job_id,
                  'clouddsp-demucs-worker-smoke',
                  'direct_upload',
                  'clouddsp-uploads',
                  v_input_key,
                  'demucs-worker-smoke.wav',
                  'audio/wav',
                  p_source_size_bytes,
                  TRUE,
                  '2-stems',
                  'source_uploaded',
                  CURRENT_TIMESTAMP + INTERVAL '20 minutes'
                );

                -- This exact small JSON object is the version-1 Demucs request
                -- contract. It contains stable private identifiers only—never
                -- a presigned URL, token, password, or user-controlled path.
                INSERT INTO public.outbox_events (
                  event_id, job_id, stage, stem_name, event_type, payload
                )
                VALUES (
                  v_event_id,
                  v_job_id,
                  'demucs',
                  '',
                  'demucs.requested',
                  jsonb_build_object(
                    'schema_version', 1,
                    'job_id', v_job_id::text,
                    'source', jsonb_build_object(
                      'bucket', 'clouddsp-uploads',
                      'object_key', v_input_key
                    ),
                    'stem_mode', '2-stems'
                  )
                );

                RETURN QUERY SELECT v_job_id, v_event_id;
              END;
              $smoke_prepare$;

              -- `observe` exposes only counts/statuses for the one reserved
              -- Job. It intentionally excludes raw outbox payloads, owner
              -- history, object metadata, error text, credentials, and rows
              -- outside this smoke coordinate.
              CREATE OR REPLACE FUNCTION public.clouddsp_demucs_worker_smoke_observe()
              RETURNS TABLE (
                source_event_publication_status TEXT,
                source_event_published_at TIMESTAMPTZ,
                demucs_task_id UUID,
                demucs_task_status TEXT,
                demucs_task_attempt_count INTEGER,
                demucs_task_lease_is_clear BOOLEAN,
                demucs_task_completed_at TIMESTAMPTZ,
                job_status TEXT,
                stem_count INTEGER,
                downstream_event_count INTEGER,
                downstream_published_count INTEGER,
                basic_pitch_task_count INTEGER,
                basic_pitch_succeeded_first_attempt_count INTEGER,
                basic_pitch_active_task_count INTEGER,
                basic_pitch_failed_task_count INTEGER
              )
              LANGUAGE sql
              SECURITY DEFINER
              SET search_path = pg_catalog, public
              AS $smoke_observe$
                SELECT
                  source_event.publication_status,
                  source_event.published_at,
                  demucs_task.task_id,
                  demucs_task.status,
                  demucs_task.attempt_count,
                  (
                    demucs_task.task_id IS NOT NULL
                    AND demucs_task.lease_token IS NULL
                    AND demucs_task.lease_expires_at IS NULL
                  ) AS demucs_task_lease_is_clear,
                  demucs_task.completed_at,
                  job.status,
                  COALESCE((SELECT count(*)::integer FROM jsonb_object_keys(job.stems)), 0),
                  (
                    SELECT count(*)::integer
                    FROM public.outbox_events AS downstream_event
                    WHERE downstream_event.job_id = job.job_id
                      AND downstream_event.stage = 'basic-pitch'
                      AND downstream_event.stem_name IN ('vocals', 'no_vocals')
                      AND downstream_event.event_type = 'basic-pitch.requested'
                  ),
                  (
                    SELECT count(*)::integer
                    FROM public.outbox_events AS downstream_event
                    WHERE downstream_event.job_id = job.job_id
                      AND downstream_event.stage = 'basic-pitch'
                      AND downstream_event.stem_name IN ('vocals', 'no_vocals')
                      AND downstream_event.event_type = 'basic-pitch.requested'
                      AND downstream_event.publication_status = 'published'
                  ),
                  (
                    SELECT count(*)::integer
                    FROM public.processing_tasks AS downstream_task
                    WHERE downstream_task.job_id = job.job_id
                      AND downstream_task.stage = 'basic-pitch'
                      AND downstream_task.stem_name IN ('vocals', 'no_vocals')
                  ),
                  (
                    SELECT count(*)::integer
                    FROM public.processing_tasks AS downstream_task
                    WHERE downstream_task.job_id = job.job_id
                      AND downstream_task.stage = 'basic-pitch'
                      AND downstream_task.stem_name IN ('vocals', 'no_vocals')
                      AND downstream_task.status = 'succeeded'
                      AND downstream_task.attempt_count = 1
                      AND downstream_task.lease_token IS NULL
                      AND downstream_task.lease_expires_at IS NULL
                      AND downstream_task.completed_at IS NOT NULL
                  ),
                  (
                    SELECT count(*)::integer
                    FROM public.processing_tasks AS downstream_task
                    WHERE downstream_task.job_id = job.job_id
                      AND downstream_task.stage = 'basic-pitch'
                      AND downstream_task.stem_name IN ('vocals', 'no_vocals')
                      AND downstream_task.status IN ('leased', 'running', 'retry_scheduled')
                  ),
                  (
                    SELECT count(*)::integer
                    FROM public.processing_tasks AS downstream_task
                    WHERE downstream_task.job_id = job.job_id
                      AND downstream_task.stage = 'basic-pitch'
                      AND downstream_task.stem_name IN ('vocals', 'no_vocals')
                      AND downstream_task.status = 'failed'
                  )
                FROM public.jobs AS job
                JOIN public.outbox_events AS source_event
                  ON source_event.job_id = job.job_id
                LEFT JOIN public.processing_tasks AS demucs_task
                  ON demucs_task.job_id = job.job_id
                 AND demucs_task.stage = 'demucs'
                 AND demucs_task.stem_name = ''
                WHERE job.job_id = '12139966-5891-4d53-a817-f3ce1f264c61'::uuid
                  AND job.owner_sub = 'clouddsp-demucs-worker-smoke'
                  AND source_event.event_id = 'e20cf942-ef7b-478e-89c4-f4795ed801ec'::uuid
                  AND source_event.stage = 'demucs'
                  AND source_event.stem_name = ''
                  AND source_event.event_type = 'demucs.requested';
              $smoke_observe$;

              -- The smoke client removes five exact private objects first. This
              -- function then removes exactly one Job only after Demucs and
              -- both downstream tasks are durable, first-attempt successes.
              -- The guard prevents a cleanup request racing a worker read.
              CREATE OR REPLACE FUNCTION public.clouddsp_demucs_worker_smoke_cleanup()
              RETURNS BOOLEAN
              LANGUAGE plpgsql
              SECURITY DEFINER
              SET search_path = pg_catalog, public
              AS $smoke_cleanup$
              DECLARE
                did_delete BOOLEAN;
              BEGIN
                DELETE FROM public.jobs AS job
                WHERE job.job_id = '12139966-5891-4d53-a817-f3ce1f264c61'::uuid
                  AND job.owner_sub = 'clouddsp-demucs-worker-smoke'
                  AND job.status = 'midi_processing'
                  AND EXISTS (
                    SELECT 1 FROM public.outbox_events AS source_event
                    WHERE source_event.event_id = 'e20cf942-ef7b-478e-89c4-f4795ed801ec'::uuid
                      AND source_event.job_id = job.job_id
                      AND source_event.stage = 'demucs'
                      AND source_event.stem_name = ''
                      AND source_event.event_type = 'demucs.requested'
                      AND source_event.publication_status = 'published'
                  )
                  AND EXISTS (
                    SELECT 1 FROM public.processing_tasks AS demucs_task
                    WHERE demucs_task.job_id = job.job_id
                      AND demucs_task.stage = 'demucs'
                      AND demucs_task.stem_name = ''
                      AND demucs_task.status = 'succeeded'
                      AND demucs_task.attempt_count = 1
                      AND demucs_task.lease_token IS NULL
                      AND demucs_task.lease_expires_at IS NULL
                      AND demucs_task.completed_at IS NOT NULL
                  )
                  AND 2 = (
                    SELECT count(*)
                    FROM public.outbox_events AS downstream_event
                    WHERE downstream_event.job_id = job.job_id
                      AND downstream_event.stage = 'basic-pitch'
                      AND downstream_event.stem_name IN ('vocals', 'no_vocals')
                      AND downstream_event.event_type = 'basic-pitch.requested'
                      AND downstream_event.publication_status = 'published'
                  )
                  AND 2 = (
                    SELECT count(*)
                    FROM public.processing_tasks AS downstream_task
                    WHERE downstream_task.job_id = job.job_id
                      AND downstream_task.stage = 'basic-pitch'
                      AND downstream_task.stem_name IN ('vocals', 'no_vocals')
                      AND downstream_task.status = 'succeeded'
                      AND downstream_task.attempt_count = 1
                      AND downstream_task.lease_token IS NULL
                      AND downstream_task.lease_expires_at IS NULL
                      AND downstream_task.completed_at IS NOT NULL
                  )
                RETURNING TRUE INTO did_delete;
                RETURN COALESCE(did_delete, FALSE);
              END;
              $smoke_cleanup$;

              -- PostgreSQL functions are executable by PUBLIC by default.
              -- Revoke every rerun, then grant only the isolated smoke role.
              REVOKE ALL ON FUNCTION public.clouddsp_demucs_worker_smoke_prepare(BIGINT, TEXT) FROM PUBLIC;
              REVOKE ALL ON FUNCTION public.clouddsp_demucs_worker_smoke_observe() FROM PUBLIC;
              REVOKE ALL ON FUNCTION public.clouddsp_demucs_worker_smoke_cleanup() FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION public.clouddsp_demucs_worker_smoke_prepare(BIGINT, TEXT)
                TO :"smoke_db_username";
              GRANT EXECUTE ON FUNCTION public.clouddsp_demucs_worker_smoke_observe()
                TO :"smoke_db_username";
              GRANT EXECUTE ON FUNCTION public.clouddsp_demucs_worker_smoke_cleanup()
                TO :"smoke_db_username";
              SQL

              # Reconnect as the restricted role and print only boolean
              # privilege facts. No query here returns a Job/event/object value
              # or a mounted Secret value.
              PGDATABASE="$DEMUCS_WORKER_SMOKE_DB_NAME" \
              PGUSER="$DEMUCS_WORKER_SMOKE_DB_USERNAME" \
              PGPASSWORD="$DEMUCS_WORKER_SMOKE_DB_PASSWORD" \
                psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
              SELECT
                current_database() AS database,
                current_user AS role,
                has_table_privilege(current_user, 'public.jobs', 'SELECT') AS can_select_jobs,
                has_table_privilege(current_user, 'public.jobs', 'INSERT') AS can_insert_jobs,
                has_table_privilege(current_user, 'public.jobs', 'DELETE') AS can_delete_jobs,
                has_table_privilege(current_user, 'public.outbox_events', 'SELECT') AS can_select_outbox,
                has_table_privilege(current_user, 'public.processing_tasks', 'SELECT') AS can_select_tasks,
                has_function_privilege(current_user, 'public.clouddsp_demucs_worker_smoke_prepare(bigint,text)', 'EXECUTE') AS can_prepare_smoke,
                has_function_privilege(current_user, 'public.clouddsp_demucs_worker_smoke_observe()', 'EXECUTE') AS can_observe_smoke,
                has_function_privilege(current_user, 'public.clouddsp_demucs_worker_smoke_cleanup()', 'EXECUTE') AS can_cleanup_smoke;
              SQL
              printf 'Fixed-scope Demucs worker smoke PostgreSQL bootstrap passed\n'
