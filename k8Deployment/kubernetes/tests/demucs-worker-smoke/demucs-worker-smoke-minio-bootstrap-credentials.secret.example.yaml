# Copy this template to the ignored local path:
#
#   k8Deployment/.local/demucs-worker-smoke-minio-bootstrap-credentials.secret.yaml
#
# This temporary data-namespace copy carries the exact same test key pair as
# the app-namespace runtime Secret. The MinIO bootstrap Pod cannot mount across
# namespaces, and this real copy is deleted once it has attached the policy.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-demucs-worker-smoke-minio-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: demucs-worker-smoke
    app.kubernetes.io/component: temporary-object-storage-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-fixed-key-demucs-worker-smoke-provisioning
type: Opaque
stringData:
  DEMUCS_WORKER_SMOKE_S3_ACCESS_KEY: clouddsp-demucs-worker-smoke
  DEMUCS_WORKER_SMOKE_S3_SECRET_KEY: REPLACE_WITH_THE_SAME_LOCAL_TEST_SECRET_KEY
