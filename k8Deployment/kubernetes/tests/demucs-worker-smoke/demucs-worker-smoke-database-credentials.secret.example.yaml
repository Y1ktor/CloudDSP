# Copy this template to the ignored local path:
#
#   k8Deployment/.local/demucs-worker-smoke-database-credentials.secret.yaml
#
# This app-namespace Secret belongs only to the non-privileged smoke client.
# The separate bootstrap Job grants this role execute permission on exactly
# three fixed-coordinate SECURITY DEFINER functions, not direct application
# table, schema, sequence, DDL, or PostgreSQL administrator access.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-demucs-worker-smoke-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: demucs-worker-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: fixed-scope-demucs-worker-smoke-access
type: Opaque
# `stringData` is readable only in the ignored copy; Kubernetes stores encoded
# data. Encoding is not encryption, so never commit a populated local file.
stringData:
  DEMUCS_WORKER_SMOKE_DB_NAME: clouddsp_job_api
  DEMUCS_WORKER_SMOKE_DB_USERNAME: clouddsp-demucs-worker-smoke
  DEMUCS_WORKER_SMOKE_DB_PASSWORD: REPLACE_WITH_A_LOCAL_TEST_PASSWORD
