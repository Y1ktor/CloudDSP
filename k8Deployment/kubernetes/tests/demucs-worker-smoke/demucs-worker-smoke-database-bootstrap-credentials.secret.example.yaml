# Copy this template to the ignored local path:
#
#   k8Deployment/.local/demucs-worker-smoke-database-bootstrap-credentials.secret.yaml
#
# Kubernetes Secrets are namespace-scoped. This short-lived `clouddsp-data`
# copy lets the administrator bootstrap Pod create the same restricted login
# that the durable app-namespace smoke Job will later mount. Delete the real
# data-namespace copy after the bootstrap Job succeeds.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-demucs-worker-smoke-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: demucs-worker-smoke
    app.kubernetes.io/component: temporary-database-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-fixed-scope-demucs-worker-smoke-provisioning
type: Opaque
stringData:
  DEMUCS_WORKER_SMOKE_DB_NAME: clouddsp_job_api
  DEMUCS_WORKER_SMOKE_DB_USERNAME: clouddsp-demucs-worker-smoke
  DEMUCS_WORKER_SMOKE_DB_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_TEST_PASSWORD
