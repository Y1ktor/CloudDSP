# Copy this template to the ignored local path:
#
#   k8Deployment/.local/demucs-worker-smoke-minio-credentials.secret.yaml
#
# This app-namespace key pair receives the immutable exact-key policy alongside
# this test. It cannot list, presign, administer, or access normal user audio.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-demucs-worker-smoke-minio-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: demucs-worker-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: fixed-key-demucs-worker-smoke-object-access
type: Opaque
stringData:
  DEMUCS_WORKER_SMOKE_S3_ACCESS_KEY: clouddsp-demucs-worker-smoke
  DEMUCS_WORKER_SMOKE_S3_SECRET_KEY: REPLACE_WITH_A_LOCAL_TEST_SECRET_KEY
