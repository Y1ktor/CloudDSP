# Hash-enforced dependencies for the future dispatcher integration smoke
# client. The verifier only reads PostgreSQL state and consumes one controlled
# RabbitMQ delivery. Its adjacent normal-path orchestrator also uses Boto3
# solely to delete the exact temporary MinIO object after the test; it never
# generates a browser upload contract or calls an AWS endpoint. Neither module
# needs a web framework, Kubernetes client, audio library, GPU runtime, or
# Demucs package.
#
