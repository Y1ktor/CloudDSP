# Copy this template to the ignored local path:
#
#   k8Deployment/.local/dispatcher-smoke-rabbitmq-data-credentials.secret.yaml
#
# Use the same username/password as the already-applied app-namespace Secret
# `clouddsp-dispatcher-smoke-rabbitmq-credentials`. Kubernetes Secrets are
# namespace-scoped, so the disposable Job in clouddsp-data cannot read that
# app-namespace object directly. This copy contains only the restricted reader
# identity—never a RabbitMQ administrator or dispatcher-publisher credential.
#
# Apply the ignored local copy immediately before the smoke Job, then delete it
# after the Job finishes. The RabbitMQ user itself retains no configure/write
# authority and can read only the single Demucs request queue.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-dispatcher-smoke-rabbitmq-data-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: dispatcher-smoke
    app.kubernetes.io/component: temporary-integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-restricted-demucs-queue-consumption
type: Opaque
stringData:
  # This fixed identity was provisioned by the completed RabbitMQ bootstrap
  # Job. It has no RabbitMQ tag, configure, or publish permission.
  RABBITMQ_DISPATCHER_SMOKE_USERNAME: clouddsp-dispatcher-smoke
  # Do not commit the actual password. It must match the existing RabbitMQ
  # identity and app-namespace Secret exactly.
  RABBITMQ_DISPATCHER_SMOKE_PASSWORD: REPLACE_WITH_THE_EXISTING_LOCAL_SMOKE_PASSWORD
