# Hash-enforced runtime dependencies for the Basic Pitch worker smoke client.
#
# The client calls only its fixed PostgreSQL functions and private MinIO S3
# operations. It intentionally excludes Pika/RabbitMQ, web frameworks,
# Keycloak clients, audio/ML libraries, GPU runtimes, and Kubernetes clients:
# the deployed dispatcher/worker own those responsibilities.
#
# `psycopg-binary` supplies the reviewed CPython 3.12 Linux/ARM64 libpq wheel,
# so the future non-root slim image needs no compiler or PostgreSQL headers.
# A future Linux/amd64 profile must add a reviewed platform hash; never weaken
# `pip --require-hashes` just to resolve a different wheel.
