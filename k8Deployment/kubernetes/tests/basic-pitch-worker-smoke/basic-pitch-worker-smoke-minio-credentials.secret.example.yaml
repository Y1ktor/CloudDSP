# Copy this template to the ignored local path:
#
#   k8Deployment/.local/basic-pitch-worker-smoke-minio-credentials.secret.yaml
#
# The future smoke client mounts this app-namespace Secret only. Its key pair
# receives the exact-object policy beside this file; it cannot list a bucket,
# create presigned URLs, administer MinIO, or access normal CloudDSP objects.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-worker-smoke-minio-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: basic-pitch-worker-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: fixed-key-basic-pitch-worker-smoke-object-access
type: Opaque
# `stringData` makes the ignored local copy readable. It is not encryption, so
# the actual key pair must never be committed or printed by a command/log.
stringData:
  BASIC_PITCH_WORKER_SMOKE_S3_ACCESS_KEY: clouddsp-basic-pitch-worker-smoke
  BASIC_PITCH_WORKER_SMOKE_S3_SECRET_KEY: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_SECRET_KEY
