# Copy this template to the ignored local path:
#
#   k8Deployment/.local/basic-pitch-worker-smoke-database-bootstrap-credentials.secret.yaml
#
# Use the same three values as the app-namespace runtime Secret. Kubernetes
# Secrets are namespace-scoped, so the short-lived administrator bootstrap Pod
# in `clouddsp-data` cannot mount the durable test client's Secret from
# `clouddsp-app`. Delete the real data-namespace copy after bootstrap passes.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-worker-smoke-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: basic-pitch-worker-smoke
    app.kubernetes.io/component: temporary-database-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-fixed-scope-basic-pitch-worker-smoke-provisioning
type: Opaque
stringData:
  BASIC_PITCH_WORKER_SMOKE_DB_NAME: clouddsp_job_api
  BASIC_PITCH_WORKER_SMOKE_DB_USERNAME: clouddsp-basic-pitch-worker-smoke
  BASIC_PITCH_WORKER_SMOKE_DB_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_TEST_PASSWORD
