# Copy this template to the ignored local path:
#
#   k8Deployment/.local/basic-pitch-worker-smoke-minio-bootstrap-credentials.secret.yaml
#
# This temporary `clouddsp-data` copy carries the same restricted key pair as
# the app-namespace runtime Secret. Kubernetes does not permit the MinIO root
# bootstrap Pod to mount a Secret from another namespace. Delete the applied
# temporary copy after its bootstrap Job has completed successfully.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-worker-smoke-minio-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: basic-pitch-worker-smoke
    app.kubernetes.io/component: temporary-object-storage-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-fixed-key-basic-pitch-worker-smoke-provisioning
type: Opaque
stringData:
  BASIC_PITCH_WORKER_SMOKE_S3_ACCESS_KEY: clouddsp-basic-pitch-worker-smoke
  BASIC_PITCH_WORKER_SMOKE_S3_SECRET_KEY: REPLACE_WITH_THE_SAME_LOCAL_TEST_SECRET_KEY
