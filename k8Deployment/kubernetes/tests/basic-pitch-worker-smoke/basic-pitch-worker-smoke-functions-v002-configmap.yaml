# Immutable repair input for the existing restricted Basic Pitch smoke role.
# It changes no application schema, worker runtime, runtime Secret, or parent
# finalizer. The paired Job executes it once through the private DB Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: basic-pitch-worker-smoke-functions-v002
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: basic-pitch-worker-smoke-functions-v002
    app.kubernetes.io/component: integration-test-database-repair
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
immutable: true
data:
  functions.sql: |
    -- Version 2 repairs only the two existing fixed-coordinate smoke functions.
    -- The original bootstrap Job contains the same definitions for new clusters.
    -- The parent fixture has one of two required stems, so migration v008 must
    -- report its known incomplete-stem failure after the actual worker succeeds.
    BEGIN;
    CREATE OR REPLACE FUNCTION public.clouddsp_basic_pitch_worker_smoke_observe()
    RETURNS TABLE (
      publication_status TEXT,
      published_at TIMESTAMPTZ,
      task_id UUID,
      task_status TEXT,
      task_attempt_count INTEGER,
      task_lease_is_clear BOOLEAN,
      task_completed_at TIMESTAMPTZ,
      job_status TEXT
    )
    LANGUAGE sql
    SECURITY DEFINER
    SET search_path = pg_catalog, public
    AS $smoke_observe$
      SELECT
        event.publication_status,
        event.published_at,
        task.task_id,
        task.status,
        task.attempt_count,
        (
          task.task_id IS NOT NULL
          AND task.lease_token IS NULL
          AND task.lease_expires_at IS NULL
        ) AS task_lease_is_clear,
        task.completed_at,
        CASE
          -- This test deliberately produces one of two stems. The
          -- current parent finalizer must fail that synthetic Job,
          -- while the worker's individual task can still succeed.
          -- Expose a distinct marker only for that exact expected
          -- error; an unrelated failed Job remains plain 'failed'.
          WHEN job.status = 'failed'
           AND job.error_message = 'The processing pipeline produced an incomplete stem set.'
            THEN 'failed_incomplete_stem_fixture'
          ELSE job.status
        END
      FROM public.jobs AS job
      JOIN public.outbox_events AS event
        ON event.job_id = job.job_id
      LEFT JOIN public.processing_tasks AS task
        ON task.job_id = job.job_id
       AND task.stage = 'basic-pitch'
       AND task.stem_name = 'vocals'
      WHERE job.job_id = '7ea5ee7e-c726-4af8-8f21-4d0e227bdd0b'::uuid
        AND job.owner_sub = 'clouddsp-basic-pitch-worker-smoke'
        AND event.event_id = '66d8637f-4e80-4b53-aed3-4e4ea54bd110'::uuid
        AND event.stage = 'basic-pitch'
        AND event.stem_name = 'vocals'
        AND event.event_type = 'basic-pitch.requested';
    $smoke_observe$;

    -- Cleanup is possible only after the actual worker created and
    -- completed one task. The future client deletes both exact MinIO
    -- objects before calling this function, so an object-delete
    -- failure retains database evidence for investigation instead.
    CREATE OR REPLACE FUNCTION public.clouddsp_basic_pitch_worker_smoke_cleanup()
    RETURNS BOOLEAN
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = pg_catalog, public
    AS $smoke_cleanup$
    DECLARE
      did_delete BOOLEAN;
    BEGIN
      DELETE FROM public.jobs AS job
      WHERE job.job_id = '7ea5ee7e-c726-4af8-8f21-4d0e227bdd0b'::uuid
        AND job.owner_sub = 'clouddsp-basic-pitch-worker-smoke'
        AND job.status = 'failed'
        AND job.error_message = 'The processing pipeline produced an incomplete stem set.'
        AND EXISTS (
          SELECT 1
          FROM public.outbox_events AS event
          WHERE event.event_id = '66d8637f-4e80-4b53-aed3-4e4ea54bd110'::uuid
            AND event.job_id = job.job_id
            AND event.stage = 'basic-pitch'
            AND event.stem_name = 'vocals'
            AND event.event_type = 'basic-pitch.requested'
            AND event.publication_status = 'published'
        )
        AND EXISTS (
          SELECT 1
          FROM public.processing_tasks AS task
          WHERE task.job_id = job.job_id
            AND task.stage = 'basic-pitch'
            AND task.stem_name = 'vocals'
            AND task.status = 'succeeded'
            AND task.attempt_count = 1
            AND task.lease_token IS NULL
            AND task.lease_expires_at IS NULL
            AND task.completed_at IS NOT NULL
        )
        AND (SELECT COUNT(*) FROM public.processing_tasks AS task
             WHERE task.job_id = job.job_id) = 1
      RETURNING TRUE INTO did_delete;
      RETURN COALESCE(did_delete, FALSE);
    END;
    $smoke_cleanup$;
    REVOKE ALL ON FUNCTION public.clouddsp_basic_pitch_worker_smoke_observe() FROM PUBLIC;
    REVOKE ALL ON FUNCTION public.clouddsp_basic_pitch_worker_smoke_cleanup() FROM PUBLIC;
    GRANT EXECUTE ON FUNCTION public.clouddsp_basic_pitch_worker_smoke_observe() TO "clouddsp-basic-pitch-worker-smoke";
    GRANT EXECUTE ON FUNCTION public.clouddsp_basic_pitch_worker_smoke_cleanup() TO "clouddsp-basic-pitch-worker-smoke";
    COMMIT;
