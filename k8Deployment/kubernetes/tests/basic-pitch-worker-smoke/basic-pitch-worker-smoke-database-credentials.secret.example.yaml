# Copy this template to the ignored local path:
#
#   k8Deployment/.local/basic-pitch-worker-smoke-database-credentials.secret.yaml
#
# Replace the placeholder only in the ignored copy. This app-namespace Secret
# is for a future non-privileged smoke Job; it has no direct table, sequence,
# schema-create, or PostgreSQL-administrator permission. It can execute only
# the three fixed-coordinate SECURITY DEFINER functions provisioned by the
# separate bootstrap Job in this directory.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-worker-smoke-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: basic-pitch-worker-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: fixed-scope-basic-pitch-worker-smoke-access
type: Opaque
# `stringData` keeps the ignored local copy readable while Kubernetes stores
# an encoded `data` representation. Encoding does not make a Secret safe to
# commit, so the actual password must remain in `.local`.
stringData:
  BASIC_PITCH_WORKER_SMOKE_DB_NAME: clouddsp_job_api
  BASIC_PITCH_WORKER_SMOKE_DB_USERNAME: clouddsp-basic-pitch-worker-smoke
  BASIC_PITCH_WORKER_SMOKE_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_PASSWORD
