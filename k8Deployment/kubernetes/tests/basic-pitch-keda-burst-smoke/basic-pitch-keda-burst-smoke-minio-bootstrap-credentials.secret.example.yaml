# Copy this template to the ignored local path:
#
#   k8Deployment/.local/basic-pitch-keda-burst-smoke-minio-bootstrap-credentials.secret.yaml
#
# Kubernetes Secrets are namespace-scoped. The MinIO bootstrap Job runs in
# clouddsp-data beside the root credential Secret, so this temporary duplicate
# carries the same restricted pair as the permanent clouddsp-app runtime
# Secret. Delete the applied data-namespace copy after the bootstrap passes.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-keda-burst-smoke-minio-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: basic-pitch-keda-burst-smoke
    app.kubernetes.io/component: temporary-object-storage-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-six-fixed-key-basic-pitch-keda-burst-provisioning
type: Opaque
stringData:
  BASIC_PITCH_KEDA_BURST_SMOKE_S3_ACCESS_KEY: clouddsp-basic-pitch-keda-burst-smoke
  BASIC_PITCH_KEDA_BURST_SMOKE_S3_SECRET_KEY: REPLACE_WITH_THE_SAME_LOCAL_TEST_SECRET_KEY
