# Copy this template to the ignored local path:
#
#   k8Deployment/.local/basic-pitch-keda-burst-smoke-database-bootstrap-credentials.secret.yaml
#
# This temporary clouddsp-data copy must exactly match the app-namespace role
# credential. Namespace scoping prevents the short-lived PostgreSQL bootstrap
# Pod from mounting the later client Secret. Delete the applied temporary copy
# after the bootstrap has created and verified the restricted login.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-keda-burst-smoke-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: basic-pitch-keda-burst-smoke
    app.kubernetes.io/component: temporary-database-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-three-fixed-job-basic-pitch-keda-burst-provisioning
type: Opaque
stringData:
  BASIC_PITCH_KEDA_BURST_SMOKE_DB_NAME: clouddsp_job_api
  BASIC_PITCH_KEDA_BURST_SMOKE_DB_USERNAME: clouddsp-basic-pitch-keda-burst-smoke
  BASIC_PITCH_KEDA_BURST_SMOKE_DB_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_TEST_PASSWORD
