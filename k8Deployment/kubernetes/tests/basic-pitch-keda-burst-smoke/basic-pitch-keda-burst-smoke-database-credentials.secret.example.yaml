# Copy this template to the ignored local path:
#
#   k8Deployment/.local/basic-pitch-keda-burst-smoke-database-credentials.secret.yaml
#
# The future burst client uses this app-namespace login only to execute three
# fixed SECURITY DEFINER functions. It has no direct table/sequence/DDL access
# and cannot query an ordinary CloudDSP Job or another smoke fixture.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-keda-burst-smoke-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: basic-pitch-keda-burst-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: three-fixed-job-basic-pitch-keda-burst-database-access
type: Opaque
# The ignored local copy is readable, not encrypted. Never commit or print the
# password; Kubernetes base64 encoding is not a confidentiality boundary.
stringData:
  BASIC_PITCH_KEDA_BURST_SMOKE_DB_NAME: clouddsp_job_api
  BASIC_PITCH_KEDA_BURST_SMOKE_DB_USERNAME: clouddsp-basic-pitch-keda-burst-smoke
  BASIC_PITCH_KEDA_BURST_SMOKE_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_PASSWORD
