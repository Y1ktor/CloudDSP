# Copy this template to the ignored local path:
#
#   k8Deployment/.local/basic-pitch-keda-burst-smoke-minio-credentials.secret.yaml
#
# The eventual burst client mounts this app-namespace Secret only. Its MinIO
# user receives the fixed six-key policy beside this file; it cannot access a
# normal user's source/result, list any bucket, create presigned URLs, or
# administer MinIO.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-keda-burst-smoke-minio-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: basic-pitch-keda-burst-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: six-fixed-key-basic-pitch-keda-burst-object-access
type: Opaque
# `stringData` is convenient in the ignored local copy but is not encryption.
# Never commit or print the real access/secret key pair.
stringData:
  BASIC_PITCH_KEDA_BURST_SMOKE_S3_ACCESS_KEY: clouddsp-basic-pitch-keda-burst-smoke
  BASIC_PITCH_KEDA_BURST_SMOKE_S3_SECRET_KEY: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_SECRET_KEY
