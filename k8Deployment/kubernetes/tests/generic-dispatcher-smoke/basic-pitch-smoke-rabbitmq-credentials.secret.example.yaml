# Copy this template to the ignored local path:
#
#   k8Deployment/.local/basic-pitch-smoke-rabbitmq-credentials.secret.yaml
#
# Replace the password placeholder only in that local copy, then apply it to
# clouddsp-app. This is a permanent, test-only AMQP identity for a future
# generic-dispatcher smoke Job; it is not a Basic Pitch worker identity, a
# dispatcher publisher identity, or a RabbitMQ administrator credential.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-smoke-rabbitmq-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: basic-pitch-dispatcher-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: restricted-basic-pitch-queue-smoke-consumption
type: Opaque
stringData:
  # Keep this fixed username synchronized with the short-lived data-namespace
  # bootstrap Secret. RabbitMQ grants it no tags, configure rights, or publish
  # rights; it can read/ack only clouddsp.basic-pitch.requests.
  RABBITMQ_BASIC_PITCH_SMOKE_USERNAME: clouddsp-basic-pitch-smoke
  # Never commit an actual password. The later smoke Job receives this one
  # narrow identity and cannot use the RabbitMQ management API.
  RABBITMQ_BASIC_PITCH_SMOKE_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_PASSWORD
