# Hash-enforced runtime dependencies for the restricted generic-dispatcher
# Basic Pitch routing smoke client. It needs only PostgreSQL function calls and
# one read/ack RabbitMQ connection. It deliberately excludes Boto3, a MinIO
# client, a Keycloak client, web frameworks, audio/ML packages, GPU libraries,
# and the Kubernetes client because this test must not perform those roles.
#
# The binary Psycopg wheel hash is reviewed for the later CPython 3.12
# Linux/ARM64 k3d image. A native Linux/amd64 image would need its own reviewed
# wheel hash; do not remove `--require-hashes` to make another platform work.
pika==1.4.4 \
    --hash=sha256:48de960c97a93b55db06b8be4c53eb977c9c8a2754c57cdae9097abcbd70ce04
psycopg==3.2.13 \
    --hash=sha256:a481374514f2da627157f767a9336705ebefe93ea7a0522a6cbacba165da179a
# `psycopg-binary` supplies the matching prebuilt libpq layer, so the later
