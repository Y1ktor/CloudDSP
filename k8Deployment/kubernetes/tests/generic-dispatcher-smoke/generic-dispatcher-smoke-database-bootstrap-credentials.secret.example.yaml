# Copy this template to the ignored local path:
#
#   k8Deployment/.local/generic-dispatcher-smoke-database-bootstrap-credentials.secret.yaml
#
# Use exactly the same database name, username, and password as the
# app-namespace runtime Secret beside this file. Kubernetes Secrets cannot
# cross namespaces, so this duplicate exists in clouddsp-data only while the
# administrator bootstrap Job creates/rotates the restricted PostgreSQL role.
# Delete the applied local Secret after that Job has completed successfully.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-generic-dispatcher-smoke-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: generic-dispatcher-smoke-database-bootstrap
    app.kubernetes.io/component: temporary-database-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-restricted-basic-pitch-outbox-provisioning
type: Opaque
stringData:
  GENERIC_DISPATCHER_SMOKE_DB_NAME: clouddsp_job_api
  GENERIC_DISPATCHER_SMOKE_DB_USERNAME: clouddsp-generic-dispatcher-smoke
  GENERIC_DISPATCHER_SMOKE_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_PASSWORD
