# Copy this template to the ignored local path:
#
#   k8Deployment/.local/generic-dispatcher-smoke-database-credentials.secret.yaml
#
# Replace the password placeholder only in that local copy, then apply it to
# clouddsp-app. This future routing-smoke client has no direct table privilege.
# It can execute only three reviewed PostgreSQL functions that create, inspect,
# and safely clean up one synthetic Basic Pitch dispatcher event at a time.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-generic-dispatcher-smoke-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: generic-dispatcher-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: restricted-basic-pitch-outbox-smoke-access
type: Opaque
stringData:
  # Keep these three values synchronized with the temporary data-namespace
  # bootstrap Secret. The name is the existing authoritative Job API database.
  GENERIC_DISPATCHER_SMOKE_DB_NAME: clouddsp_job_api
  GENERIC_DISPATCHER_SMOKE_DB_USERNAME: clouddsp-generic-dispatcher-smoke
  # Never commit a real password. This application-role credential is neither
  # PostgreSQL administrator access nor a dispatcher/worker database login.
  GENERIC_DISPATCHER_SMOKE_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_PASSWORD
