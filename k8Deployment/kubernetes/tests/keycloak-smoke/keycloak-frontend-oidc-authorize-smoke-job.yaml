# This one-time Job verifies that Keycloak accepts the local React SPA's OIDC
# Authorization Code with PKCE request.  Its internal network path is:
#
#   Job Pod -> Keycloak ClusterIP Service -> Keycloak Deployment Pod
#
# The request carries the *public* React callback URL registered on the client,
# but connects to Keycloak through Service DNS so the test does not depend on
# Traefik or the Mac.  A valid unauthenticated authorization request ends at
# Keycloak's login page.  This test intentionally does not authenticate a user,
# receive an authorization code, exchange a token, or call a CloudDSP API;
# those are later browser/frontend integration tests.
apiVersion: batch/v1
kind: Job
metadata:
  # Delete a completed fixed-name Job before a deliberate rerun.  Kubernetes
  # preserves completed Jobs rather than treating another apply as execution.
  name: keycloak-frontend-oidc-authorize-smoke
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: keycloak-frontend-oidc-authorize-smoke
    app.kubernetes.io/component: integration-test
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: keycloak-react-authorization-code-pkce-verification
spec:
  # Keep the disposable Job and its diagnostic logs for five minutes, then let
  # Kubernetes' TTL controller remove the completed test resource automatically.
  ttlSecondsAfterFinished: 300
  # Do not retry a failed login-page assertion automatically.  A retry cannot
  # fix a client/callback mismatch and obscures the original failure in logs.
  backoffLimit: 0
  # Discovery and one authorization request are small local HTTP operations;
  # the deadline prevents a failed Service/DNS path from retaining a Pod.
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-frontend-oidc-authorize-smoke
        app.kubernetes.io/component: integration-test
        app.kubernetes.io/part-of: clouddsp
        clouddsp.io/environment: local
    spec:
      # The Job controller owns retry semantics.  Its client container should
      # not restart in place after a failed request/assertion.
      restartPolicy: Never
      # This public OIDC request needs only cluster DNS and Keycloak HTTP.  It
      # does not call Kubernetes APIs, so no service-account token is mounted.
      automountServiceAccountToken: false
      securityContext:
        # The Python Official Image can execute as this ordinary numeric user;
        # no root process, persistent volume, or home directory is required.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oidc-authorize-client
          # Reuse the digest-pinned official Python runtime already recorded as
          # `images.rabbitmq-amqp-client-python` in ../../images.lock.yaml.
          # Its standard library contains the JSON, PKCE hash, URL, and HTTP
          # tools needed here, avoiding package installation or a new image.
          image: docker.io/library/python@sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e
          imagePullPolicy: IfNotPresent
          env:
            # Service DNS is the true in-cluster connection under test.  The
            # browser consumes public metadata at keycloak.localhost instead.
            - name: KEYCLOAK_INTERNAL_BASE_URL
              value: http://clouddsp-keycloak:8080
            - name: KEYCLOAK_PUBLIC_BASE_URL
              value: http://keycloak.localhost:8080
            - name: CLOUDDSP_REALM
              value: clouddsp
            # This clientId is public configuration, not a secret.  A browser
            # SPA identifies itself with it but never holds a client password.
            - name: OIDC_CLIENT_ID
              value: clouddsp-react
            # This exact URL must match the redirectUris value stored in the
            # Keycloak client.  It uses no wildcard and no future API origin.
            - name: REACT_CALLBACK_URL
              value: http://clouddsp.localhost:8080/
            # Avoid bytecode writes on the read-only filesystem below.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            # Parsing one discovery document and one bounded HTML login page
            # should remain small beside identity/data and future DSP workloads.
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # This is self-contained standard-library integration-test logic, not
          # a replacement for the later React OIDC adapter.  It never prints an
          # authorization code, a browser state value, a PKCE verifier, or HTML.
          command:
            - python3
            - -c
            - |
              import base64
              import hashlib
              import json
              import os
              import secrets
              import sys
              from urllib.error import HTTPError, URLError
              from urllib.parse import urlencode
              from urllib.request import Request, urlopen

              class SmokeFailure(RuntimeError):
                  """A safe diagnostic that deliberately omits URL query data."""


              def fetch(operation, url, expected_statuses, headers=None):
                  """Fetch one small response without logging its body or URL."""
                  request = Request(url, headers=headers or {})
                  try:
                      with urlopen(request, timeout=10) as response:
                          status = response.status
                          body = response.read(65_537)
                          content_type = response.headers.get("Content-Type", "")
                  except HTTPError as error:
                      raise SmokeFailure(f"{operation} returned HTTP {error.code}") from None
                  except (URLError, OSError, TimeoutError) as error:
                      raise SmokeFailure(f"{operation} failed: {type(error).__name__}") from None

                  if status not in expected_statuses:
                      raise SmokeFailure(f"{operation} returned HTTP {status}")
                  if len(body) > 65_536:
                      raise SmokeFailure(f"{operation} response exceeded 64 KiB")
                  return content_type, body


              keycloak_internal_url = os.environ["KEYCLOAK_INTERNAL_BASE_URL"].rstrip("/")
              keycloak_public_url = os.environ["KEYCLOAK_PUBLIC_BASE_URL"].rstrip("/")
              realm = os.environ["CLOUDDSP_REALM"]
              client_id = os.environ["OIDC_CLIENT_ID"]
              callback_url = os.environ["REACT_CALLBACK_URL"]
              expected_issuer = f"{keycloak_public_url}/realms/{realm}"
              expected_public_authorize_endpoint = (
                  f"{expected_issuer}/protocol/openid-connect/auth"
              )

              try:
                  # Discovery is public metadata.  Calling it via the Service
                  # confirms the realm exists and must still advertise Keycloak's
                  # browser-facing issuer rather than private cluster DNS.
                  _, discovery_body = fetch(
                      "Keycloak OIDC discovery",
                      f"{keycloak_internal_url}/realms/{realm}/.well-known/openid-configuration",
                      {200},
                      headers={"Accept": "application/json"},
                  )
                  discovery = json.loads(discovery_body)
                  if discovery.get("issuer") != expected_issuer:
                      raise SmokeFailure("Keycloak OIDC discovery issuer mismatch")
                  if discovery.get("authorization_endpoint") != expected_public_authorize_endpoint:
                      raise SmokeFailure("Keycloak OIDC discovery authorization endpoint mismatch")

                  # PKCE binds the future authorization code to a value created
                  # in the browser.  The verifier/state stay only in this test
                  # process; their generated shapes exercise the S256 client
                  # policy without attempting a user login or token exchange.
                  code_verifier = secrets.token_urlsafe(48)
                  code_challenge = base64.urlsafe_b64encode(
                      hashlib.sha256(code_verifier.encode("ascii")).digest()
                  ).rstrip(b"=").decode("ascii")
                  state = secrets.token_urlsafe(24)
                  authorize_query = urlencode(
                      {
                          "client_id": client_id,
                          "redirect_uri": callback_url,
                          "response_type": "code",
                          "scope": "openid",
                          "state": state,
                          "code_challenge": code_challenge,
                          "code_challenge_method": "S256",
                      }
                  )

                  # Connect through private DNS, but retain the registered
                  # public callback URL in the query.  With no browser session,
                  # Keycloak should follow internal login redirects and finish
                  # at its login form rather than issue a code/call the callback.
                  login_content_type, login_page = fetch(
                      "Keycloak PKCE authorization request",
                      f"{keycloak_internal_url}/realms/{realm}/protocol/openid-connect/auth?{authorize_query}",
                      {200},
                      headers={"Accept": "text/html"},
                  )
                  if "text/html" not in login_content_type.lower():
                      raise SmokeFailure("Keycloak authorization response was not HTML")
                  # The default Keycloak login page has this stable form marker.
                  # Checking a compact marker proves this is an interactive login
                  # response, not an API error or an unexpected browser callback.
                  if b"kc-form-login" not in login_page:
                      raise SmokeFailure("Keycloak authorization request did not reach the login form")
              except (SmokeFailure, ValueError, KeyError) as error:
                  print(
                      f"Keycloak OIDC authorization smoke test failed: "
                      f"{str(error) if isinstance(error, SmokeFailure) else type(error).__name__}",
                      file=sys.stderr,
                  )
                  raise SystemExit(1) from None

              print("Keycloak React OIDC Authorization Code with PKCE request passed")
