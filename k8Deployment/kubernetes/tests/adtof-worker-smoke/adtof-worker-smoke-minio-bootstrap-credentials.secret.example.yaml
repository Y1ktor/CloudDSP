# Copy this template to the ignored local path:
#
#   k8Deployment/.local/adtof-worker-smoke-minio-bootstrap-credentials.secret.yaml
#
# This temporary `clouddsp-data` copy holds the same restricted S3 pair as the
# later app-namespace client Secret. Kubernetes namespaces isolate Secrets, so
# the short-lived MinIO root-bootstrap Pod cannot mount the client copy. Delete
# the applied temporary copy after its bootstrap Job succeeds.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-adtof-worker-smoke-minio-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: adtof-worker-smoke
    app.kubernetes.io/component: temporary-object-storage-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-fixed-key-adtof-worker-smoke-provisioning
type: Opaque
stringData:
  ADTOF_WORKER_SMOKE_S3_ACCESS_KEY: clouddsp-adtof-worker-smoke
  ADTOF_WORKER_SMOKE_S3_SECRET_KEY: REPLACE_WITH_A_LOCAL_TEST_SECRET_KEY
