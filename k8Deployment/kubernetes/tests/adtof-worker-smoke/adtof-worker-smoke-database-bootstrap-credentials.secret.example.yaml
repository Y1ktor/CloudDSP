# Copy this template to the ignored local path:
#
#   k8Deployment/.local/adtof-worker-smoke-database-bootstrap-credentials.secret.yaml
#
# The temporary administrator bootstrap Pod runs in `clouddsp-data`, whereas
# the later non-privileged smoke client runs in `clouddsp-app`. Kubernetes
# Secrets do not cross namespace boundaries, so both namespaces need the same
# restricted-role values for a short period. Delete the real data-namespace
# copy after the bootstrap Job has completed successfully.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-adtof-worker-smoke-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: adtof-worker-smoke
    app.kubernetes.io/component: temporary-database-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-fixed-scope-adtof-worker-smoke-provisioning
type: Opaque
stringData:
  ADTOF_WORKER_SMOKE_DB_NAME: clouddsp_job_api
  ADTOF_WORKER_SMOKE_DB_USERNAME: clouddsp-adtof-worker-smoke
  ADTOF_WORKER_SMOKE_DB_PASSWORD: REPLACE_WITH_A_LOCAL_TEST_PASSWORD
