# Copy this template to the ignored local path:
#
#   k8Deployment/.local/adtof-worker-smoke-minio-credentials.secret.yaml
#
# The future smoke client mounts this app-namespace Secret only. Its key pair
# will receive the exact-object policy beside this file; it cannot list buckets,
# administer MinIO, create presigned URLs, or access ordinary CloudDSP media.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-adtof-worker-smoke-minio-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: adtof-worker-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: fixed-key-adtof-worker-smoke-object-access
type: Opaque
# `stringData` is readable only before Kubernetes encodes it into `data`; it is
# not encryption, so an actual access pair must remain in the ignored `.local`.
stringData:
  ADTOF_WORKER_SMOKE_S3_ACCESS_KEY: clouddsp-adtof-worker-smoke
  ADTOF_WORKER_SMOKE_S3_SECRET_KEY: REPLACE_WITH_A_LOCAL_TEST_SECRET_KEY
