# Copy this template to the ignored local path:
#
#   k8Deployment/.local/adtof-worker-smoke-database-credentials.secret.yaml
#
# Replace the placeholder only in the ignored copy. This durable app-namespace
# Secret will later be mounted by a non-privileged ADTOF smoke client. The
# login cannot directly read, insert, update, or delete application tables; it
# can execute only the three fixed-coordinate SECURITY DEFINER functions made
# by the separate PostgreSQL bootstrap Job in this directory.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-adtof-worker-smoke-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: adtof-worker-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: fixed-scope-adtof-worker-smoke-access
type: Opaque
# `stringData` is readable only before Kubernetes stores it in encoded `data`.
# Encoding is not encryption, so the real local password must stay in `.local`.
stringData:
  ADTOF_WORKER_SMOKE_DB_NAME: clouddsp_job_api
  ADTOF_WORKER_SMOKE_DB_USERNAME: clouddsp-adtof-worker-smoke
  ADTOF_WORKER_SMOKE_DB_PASSWORD: REPLACE_WITH_A_LOCAL_TEST_PASSWORD
