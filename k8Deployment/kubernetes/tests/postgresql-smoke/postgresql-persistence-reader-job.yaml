# This reader is the second half of the StatefulSet persistence test.  Apply it
# only after deleting `clouddsp-postgresql-0` and waiting for its replacement to
# become Ready.  It proves that the recreated Pod reattached the same PVC by
# reading the writer's marker, then drops the isolated test table.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-persistence-reader
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: postgresql-persistence-reader
    app.kubernetes.io/component: test
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-persistence-reader
        app.kubernetes.io/component: test
        app.kubernetes.io/part-of: clouddsp
        clouddsp.io/environment: local
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql-client
          image: docker.io/library/postgres@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: clouddsp-postgresql
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: clouddsp-postgresql-credentials
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: clouddsp-postgresql-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: clouddsp-postgresql-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              printf 'Reading PostgreSQL persistence marker through %s:%s\n' "$PGHOST" "$PGPORT"

              # `--tuples-only --no-align` returns only the selected marker.
              # `grep -Fx` makes the Job fail unless it is exactly the value
              # written before the StatefulSet Pod replacement.  This avoids
              # PostgreSQL dollar-quoted SQL blocks inside a Kubernetes command.
              psql --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
                --command "SELECT marker FROM clouddsp_k8_persistence_smoke WHERE marker = 'kubernetes-persistence-ok';" \
                | grep --fixed-strings --line-regexp 'kubernetes-persistence-ok'

              # Cleanup occurs only after the exact marker was successfully
              # read, leaving the database free of test data after a normal run.
              psql --no-psqlrc --set=ON_ERROR_STOP=1 \
                --command 'DROP TABLE clouddsp_k8_persistence_smoke;'
              printf 'PostgreSQL persistence test passed; marker survived Pod replacement\n'
