# Copy this non-secret example to the ignored local path:
#
#   k8Deployment/.local/six-stem-load-minio-admin-credentials.secret.yaml
#
# Replace these placeholders with the existing MINIO_ROOT_USER and
# MINIO_ROOT_PASSWORD from `k8Deployment/.local/minio-root-credentials.secret.yaml`.
# Kubernetes Secrets are namespace-scoped, so the app-namespace lifecycle
# broker needs a temporary local copy of the data-namespace MinIO root login.
# Only that broker uses it to create/revoke one temporary policy containing
# the 42 exact GetObject keys verified for this run. The authenticated client
# and evidence observer never receive these administrator credentials.
# Do not apply this example as written.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-six-stem-load-minio-admin-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: six-stem-load
    app.kubernetes.io/component: integration-test-identity-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-minio-observer-identity-provisioning
type: Opaque
stringData:
  MINIO_ROOT_USER: REPLACE_WITH_EXISTING_LOCAL_MINIO_ROOT_USER
  MINIO_ROOT_PASSWORD: REPLACE_WITH_EXISTING_LOCAL_MINIO_ROOT_PASSWORD
