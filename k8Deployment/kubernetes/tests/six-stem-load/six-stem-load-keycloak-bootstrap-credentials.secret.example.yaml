# Copy this template to the ignored local path:
#
#   k8Deployment/.local/six-stem-load-keycloak-bootstrap-credentials.secret.yaml
#
# Then replace both placeholders with the existing *master-realm* Keycloak
# administrator credentials from your local Keycloak bootstrap Secret. This is
# a separate app-namespace copy because Kubernetes Secrets cannot be mounted
# across namespaces. It is not a new Keycloak account, a PostgreSQL credential,
# a MinIO credential, an OIDC browser-client secret, or a credential for the
# future authenticated load-client container.
#
# Do not apply this committed example. Apply only the ignored populated copy
# immediately before an intentionally reviewed load test, then delete that
# app-namespace copy after the test. `stringData` is convenient source syntax;
# Kubernetes stores encoded data, but base64 is not encryption.
apiVersion: v1
kind: Secret
metadata:
  # The suspended lifecycle-broker Job skeleton below names this exact Secret.
  # It stays separate from clouddsp-keycloak-bootstrap-admin because that
  # permanent initial-admin Secret belongs to clouddsp-data, not clouddsp-app.
  name: clouddsp-six-stem-load-keycloak-bootstrap-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: six-stem-load
    app.kubernetes.io/component: integration-test-identity-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-keycloak-load-test-lifecycle-administration
type: Opaque
stringData:
  # These values exist only in the lifecycle-broker container. It exchanges
  # them for a short-lived Admin API token in memory, then creates/revokes a
  # disposable direct-grant user/client pair. Never add these keys to the
  # authenticated client, data observer, or KEDA observer containers.
  KC_BOOTSTRAP_ADMIN_USERNAME: REPLACE_WITH_EXISTING_LOCAL_KEYCLOAK_ADMIN_USERNAME
  KC_BOOTSTRAP_ADMIN_PASSWORD: REPLACE_WITH_EXISTING_LOCAL_KEYCLOAK_ADMIN_PASSWORD
