# Copy this non-secret template to the ignored local path below and replace
# the two values with POSTGRES_USER/POSTGRES_PASSWORD from the existing local
# file `k8Deployment/.local/postgresql-credentials.secret.yaml`, which is
# applied as Secret `clouddsp-postgresql-credentials` in `clouddsp-data`:
#
#   k8Deployment/.local/six-stem-load-postgresql-bootstrap-credentials.secret.yaml
#
# This is a temporary duplicate because Kubernetes Secrets are namespace
# scoped: the lifecycle broker runs in `clouddsp-app`, while PostgreSQL and its
# source credentials live in `clouddsp-data`. The official PostgreSQL image
# initialized its configured POSTGRES_USER as the database administrator;
# copy the actual local values rather than assuming a particular username.
#
# Do not apply this example. A later, separately reviewed bootstrap step will
# briefly create this Secret in `clouddsp-app`, where it will be referenced by
# only the `keycloak-lifecycle-broker` container. Delete that temporary copy
# after the temporary observer role/function cleanup finishes. It is not the
# worker/API database login and must never be mounted into the load client or
# data observer.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-six-stem-load-postgresql-bootstrap-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: six-stem-load
    app.kubernetes.io/component: postgresql-observer-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-six-stem-load-observer-role-provisioning
type: Opaque
stringData:
  # These are the local PostgreSQL administrator credentials already used by
  # the StatefulSet's initialization Secret. They are never included in the
  # lifecycle image, coordinate handoff, observer process, or Job logs.
  SIX_STEM_POSTGRESQL_ADMIN_USERNAME: REPLACE_WITH_POSTGRES_USER_FROM_DATA_SECRET
  SIX_STEM_POSTGRESQL_ADMIN_PASSWORD: REPLACE_WITH_POSTGRES_PASSWORD_FROM_DATA_SECRET
