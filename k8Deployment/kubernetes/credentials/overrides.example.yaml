# Optional, value-free input for credential-init.rb. Copy this file to a
# private location, set owner-only permissions, and add only values you want
# to choose. Every omitted generated field gets an independent random value.
# Group and field names are defined in catalog.yaml. Fixed service identities
# cannot be overridden. Never commit the populated copy.
version: 1
credentials: {}

# To choose a Keycloak administrator login, replace the empty mapping above
# with the following group and replace both REPLACE_ placeholders:
# credentials:
#   keycloak-admin:
#     KC_BOOTSTRAP_ADMIN_USERNAME: REPLACE_WITH_YOUR_ADMIN_USERNAME
#     KC_BOOTSTRAP_ADMIN_PASSWORD: REPLACE_WITH_A_LONG_PRIVATE_PASSWORD
