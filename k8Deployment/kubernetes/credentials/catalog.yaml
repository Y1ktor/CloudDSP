      DEMUCS_DB_USERNAME: { fixed: clouddsp-demucs }
      DEMUCS_DB_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: demucs-database-credentials.secret.yaml, example: services/demucs/demucs-database-credentials.secret.example.yaml }

  demucs-rabbitmq:
    fields:
      RABBITMQ_DEMUCS_USERNAME: { fixed: clouddsp-demucs }
      RABBITMQ_DEMUCS_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: demucs-rabbitmq-credentials.secret.yaml, example: services/demucs/demucs-rabbitmq-credentials.secret.example.yaml }

  demucs-minio:
    fields:
      DEMUCS_S3_ACCESS_KEY: { fixed: clouddsp-demucs }
      DEMUCS_S3_SECRET_KEY: { generate: secret_key }
    sources:
      - { role: runtime, file: demucs-minio-credentials.secret.yaml, example: services/demucs/demucs-minio-credentials.secret.example.yaml }
      - { role: bootstrap, file: demucs-minio-bootstrap-credentials.secret.yaml, example: services/minio/minio-demucs-artifacts-bootstrap-credentials.secret.example.yaml }

  basic-pitch-database:
