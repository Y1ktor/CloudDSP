      - { role: bootstrap, file: adtof-database-bootstrap-credentials.secret.yaml, example: services/adtof/adtof-database-bootstrap-credentials.secret.example.yaml }

  adtof-rabbitmq:
    fields:
      RABBITMQ_ADTOF_USERNAME: { fixed: clouddsp-adtof }
      RABBITMQ_ADTOF_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: adtof-rabbitmq-credentials.secret.yaml, example: services/adtof/adtof-rabbitmq-credentials.secret.example.yaml }

  adtof-minio:
    fields:
      ADTOF_S3_ACCESS_KEY: { fixed: clouddsp-adtof }
      ADTOF_S3_SECRET_KEY: { generate: secret_key }
    sources:
