    sources:
      - { role: runtime, file: basic-pitch-database-credentials.secret.yaml, example: services/basic-pitch/basic-pitch-database-credentials.secret.example.yaml }
      - { role: bootstrap, file: basic-pitch-database-bootstrap-credentials.secret.yaml, example: services/basic-pitch/basic-pitch-database-bootstrap-credentials.secret.example.yaml }

  basic-pitch-rabbitmq:
    fields:
      RABBITMQ_BASIC_PITCH_USERNAME: { fixed: clouddsp-basic-pitch }
      RABBITMQ_BASIC_PITCH_PASSWORD: { generate: password }
    sources:
