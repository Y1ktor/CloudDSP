      DISPATCHER_DB_USERNAME: { fixed: clouddsp-dispatcher }
      DISPATCHER_DB_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: dispatcher-database-credentials.secret.yaml, example: services/dispatcher/dispatcher-database-credentials.secret.example.yaml }

  dispatcher-rabbitmq:
    fields:
      RABBITMQ_DISPATCHER_USERNAME: { fixed: clouddsp-dispatcher }
      RABBITMQ_DISPATCHER_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: dispatcher-rabbitmq-credentials.secret.yaml, example: services/dispatcher/dispatcher-rabbitmq-credentials.secret.example.yaml }

  demucs-database:
