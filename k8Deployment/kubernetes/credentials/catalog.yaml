      POSTGRESQL_KEDA_DEMUCS_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: keda-demucs-postgresql-credentials.secret.yaml, example: helm/keda/keda-demucs-postgresql-credentials.secret.example.yaml }

