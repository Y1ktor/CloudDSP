# This value-free contract lists the credential groups needed by the fresh
# bootstrap-platform path. A group owns one set of fields; multiple sources
# in that group must receive identical values. The initializer renders
# ignored .local files from this map before a cluster is created.
#
# `fixed` values are reviewed service identities, not passwords. `default`
# names may be overridden by the person installing CloudDSP. `generate`
# marks private values to create independently for every new installation.
# `derive` builds a private value from other fields in the same group.
version: 1
credentials:
  postgresql:
    fields:
      POSTGRES_DB: { default: clouddsp }
      POSTGRES_USER: { default: clouddsp_app }
      POSTGRES_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: postgresql-credentials.secret.yaml, example: services/postgresql/postgresql-credentials.secret.example.yaml }

  rabbitmq:
    fields:
      RABBITMQ_DEFAULT_USER: { default: clouddsp-admin }
      RABBITMQ_DEFAULT_PASS: { generate: password }
    sources:
      - { role: runtime, file: rabbitmq-credentials.secret.yaml, example: services/rabbitmq/rabbitmq-credentials.secret.example.yaml }

  minio-root:
    fields:
      MINIO_ROOT_USER: { default: clouddsp-root }
      MINIO_ROOT_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: minio-root-credentials.secret.yaml, example: services/minio/minio-root-credentials.secret.example.yaml }

  minio-events-rabbitmq:
    fields:
      RABBITMQ_MINIO_EVENTS_USERNAME: { fixed: clouddsp-minio-events }
      RABBITMQ_MINIO_EVENTS_PASSWORD: { generate: password }
      MINIO_NOTIFY_AMQP_URL_INTAKE:
        derive:
          scheme: amqp
          host: clouddsp-rabbitmq.clouddsp-data.svc
          port: 5672
          vhost: /clouddsp
          username: RABBITMQ_MINIO_EVENTS_USERNAME
          password: RABBITMQ_MINIO_EVENTS_PASSWORD
    sources:
      - { role: runtime, file: minio-source-intake-rabbitmq-credentials.secret.yaml, example: services/minio/minio-source-intake-rabbitmq-credentials.secret.example.yaml }

  keycloak-database:
    fields:
      KEYCLOAK_DB_NAME: { fixed: clouddsp_keycloak }
      KEYCLOAK_DB_USERNAME: { fixed: clouddsp-keycloak }
      KEYCLOAK_DB_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: keycloak-database-credentials.secret.yaml, example: services/keycloak/keycloak-database-credentials.secret.example.yaml }

  keycloak-admin:
    fields:
      KC_BOOTSTRAP_ADMIN_USERNAME: { default: clouddsp-admin }
      KC_BOOTSTRAP_ADMIN_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: keycloak-bootstrap-admin.secret.yaml, example: services/keycloak/keycloak-bootstrap-admin.secret.example.yaml }

  job-api-database:
    fields:
      JOB_API_DB_NAME: { fixed: clouddsp_job_api }
      JOB_API_DB_USERNAME: { fixed: clouddsp-job-api }
      JOB_API_DB_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: job-api-database-credentials.secret.yaml, example: services/job-api/job-api-database-credentials.secret.example.yaml }
      - { role: bootstrap, file: job-api-database-bootstrap-credentials.secret.yaml, example: services/job-api/job-api-database-bootstrap-credentials.secret.example.yaml }

  job-api-minio:
    fields:
      JOB_API_S3_ACCESS_KEY: { fixed: clouddsp-job-api }
      JOB_API_S3_SECRET_KEY: { generate: secret_key }
    sources:
      - { role: runtime, file: job-api-minio-credentials.secret.yaml, example: services/job-api/job-api-minio-credentials.secret.example.yaml }
      - { role: bootstrap, file: job-api-minio-bootstrap-credentials.secret.yaml, example: services/minio/minio-job-api-uploads-bootstrap-credentials.secret.example.yaml }

  upload-intake-database:
    fields:
      UPLOAD_INTAKE_DB_NAME: { fixed: clouddsp_job_api }
      UPLOAD_INTAKE_DB_USERNAME: { fixed: clouddsp-upload-intake }
      UPLOAD_INTAKE_DB_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: upload-intake-database-credentials.secret.yaml, example: services/upload-intake/upload-intake-database-credentials.secret.example.yaml }

  upload-intake-rabbitmq:
    fields:
      RABBITMQ_UPLOAD_INTAKE_USERNAME: { fixed: clouddsp-upload-intake }
      RABBITMQ_UPLOAD_INTAKE_PASSWORD: { generate: password }
    sources:
      - { role: runtime, file: upload-intake-rabbitmq-credentials.secret.yaml, example: services/upload-intake/upload-intake-rabbitmq-credentials.secret.example.yaml }
      - { role: bootstrap, file: upload-intake-rabbitmq-bootstrap-credentials.secret.yaml, example: services/rabbitmq/rabbitmq-upload-intake-bootstrap-credentials.secret.example.yaml }

  upload-intake-minio:
    fields:
      UPLOAD_INTAKE_S3_ACCESS_KEY: { fixed: clouddsp-upload-intake }
      UPLOAD_INTAKE_S3_SECRET_KEY: { generate: secret_key }
    sources:
