# This is the complete NGINX runtime configuration for the static React image.
# The master process is unnecessary for one static site, and the container runs
# as the image's ordinary `nginx` user on unprivileged port 8080. Kubernetes
# later maps its Service port 80 to this container port; `EXPOSE`/`listen` do
# not publish a Mac port by themselves.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # An unprivileged NGINX process cannot create files under /var/cache/nginx.
    # Keep all possible temporary request data in the writable /tmp directory.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # A future Deployment readiness/liveness probe receives this small
        # response without depending on React routing or an external service.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite creates a client-side React router. `try_files` serves a real
        # asset when it exists, otherwise falls back to index.html so a browser
        # refresh on a React route does not produce an NGINX 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
