# This is a committed credential *template*, never a usable Secret. Copy it to
# `k8Deployment/.local/job-api-database-credentials.secret.yaml`, replace the
# password placeholder, and apply only that ignored local copy. The `.local/`
# directory is excluded from Git so a database password cannot be committed.
#
# This Secret belongs in `clouddsp-app` because the future Job API Pod belongs
# there. Kubernetes Secrets are namespace-scoped: a Pod in this namespace
# cannot read the PostgreSQL administrator Secret stored in `clouddsp-data`.
# That separation is intentional—the API needs only its own login, never the
# cluster-wide database-administrator account.
apiVersion: v1
kind: Secret
metadata:
  # This stable name becomes the contract shared by the future API Deployment
  # and its database readiness/connection configuration.
  name: clouddsp-job-api-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: job-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: job-api-postgresql-connection
type: Opaque
# `stringData` accepts readable input when applying the manifest. Kubernetes
# stores it as base64-encoded `data`; base64 is encoding, not encryption, so
# these real values must remain in the ignored local copy and out of logs.
stringData:
  # PostgreSQL database names use underscores so SQL commands do not need to
  # quote a hyphenated identifier.
  JOB_API_DB_NAME: clouddsp_job_api
  # PostgreSQL role names can contain hyphens when safely quoted by bootstrap
  # SQL. It matches the human-facing Kubernetes/API component name.
  JOB_API_DB_USERNAME: clouddsp-job-api
  JOB_API_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_JOB_API_DATABASE_PASSWORD
