# This immutable ConfigMap carries the reviewed v003 PostgreSQL schema source.
# Applying it stores SQL text in Kubernetes only; it does not run DDL. The
# separate migration Job mounts this exact file and uses the existing Job API
# schema-owner credential through private PostgreSQL Service DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  # Never edit a migration ConfigMap after it has been applied. A later schema
  # evolution must receive a new migration ID/name so a local cluster retains
  # an auditable sequence rather than silently changing historic DDL.
  name: job-api-schema-migration-v003-processing-tasks
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: job-api-schema-migration-v003-processing-tasks
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: durable-demucs-task-lease-schema
immutable: true
data:
  003_processing_tasks.sql: |
    -- CloudDSP Job API schema migration v003
    --
    -- This creates the durable per-stage processing-task record required by
    -- the Demucs worker contract. It does not create a worker, role, Secret,
    -- RabbitMQ connection, queue, message, MinIO object, or processing lease
    -- by itself. Application code must generate task/lease UUIDs explicitly.

    BEGIN;

    -- Keep the single migration sequence serialized with v001/v002. A second
    -- accidentally started migration Job waits here; all DDL/ledger work is
    -- atomic because it remains inside this transaction.
    SELECT pg_advisory_xact_lock(834929517101);

    -- Retain the defensive ledger declaration used by prior migrations. The
    -- required foreign keys below independently make a missing v001/v002
    -- dependency fail safely rather than creating a partial alternative schema.
    CREATE TABLE IF NOT EXISTS schema_migrations (
      migration_id TEXT PRIMARY KEY,
      description TEXT NOT NULL,
      applied_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    -- One row represents one durable logical stage, not one RabbitMQ delivery.
    -- The `job_id`/stage/stem_name unique key means duplicate delivery,
    -- Deployment overlap, and lease recovery cannot make Demucs execute as
    -- two independent tasks. Version 1 intentionally permits only the
    -- job-wide Demucs stage; a later migration must extend the CHECK rules
    -- before another stage may use this generic table.
    CREATE TABLE IF NOT EXISTS public.processing_tasks (
      -- UUIDs are generated by the worker application, not by a database
      -- extension/default. This keeps task/lease correlation explicit in code.
      task_id UUID PRIMARY KEY,

      -- Deleting a terminal Job cascades to its outbox event and then its one
      -- task. A deletion workflow must separately refuse active work; this FK
      -- prevents an orphan task if a terminal Job is legitimately removed.
      job_id UUID NOT NULL REFERENCES public.jobs(job_id) ON DELETE CASCADE,

      stage TEXT NOT NULL CHECK (stage IN ('demucs')),
      -- Demucs processes the whole source. Use the canonical empty string,
      -- not NULL, because PostgreSQL UNIQUE would treat NULLs as distinct.
      stem_name TEXT NOT NULL DEFAULT '' CHECK (stem_name = ''),

      -- The dispatcher-published AMQP message_id maps to one committed outbox
      -- event. This FK blocks a worker from inventing a task for a random UUID;
      -- the unique key additionally prevents that event from naming two tasks.
      request_event_id UUID NOT NULL REFERENCES public.outbox_events(event_id)
        ON DELETE CASCADE,

      -- These are stable private identifiers copied only after the worker has
      -- compared them against the authoritative jobs row. They let a recovery
      -- scan resume an acknowledged task without requiring a second message.
      input_bucket TEXT NOT NULL CHECK (length(btrim(input_bucket)) > 0),
      input_object_key TEXT NOT NULL CHECK (
        input_object_key LIKE ('uploads/' || job_id::text || '/%')
      ),
      stem_mode TEXT NOT NULL CHECK (stem_mode IN ('2-stems', '4-stems', '6-stems')),

      -- A message first creates/claims `leased`, then changes to `running`
      -- while processing. `retry_scheduled` is PostgreSQL-authoritative: a
      -- worker recovery scan can reclaim it after available_at without a new
      -- broker publish. Terminal states retain completed_at below.
      status TEXT NOT NULL CHECK (
        status IN ('leased', 'running', 'retry_scheduled', 'succeeded', 'failed')
      ),
      -- A real worker lease, including recovery, increments this count. It is
      -- not the RabbitMQ delivery counter. Version 1 allows at most three
      -- Demucs attempts before the worker records a durable terminal failure.
      attempt_count INTEGER NOT NULL DEFAULT 0 CHECK (attempt_count >= 0 AND attempt_count <= 3),
      available_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      lease_token UUID,
      lease_expires_at TIMESTAMPTZ,

      -- `started_at` records the first actual processing start, if any. A
      -- validation failure may reach terminal state before Demucs starts, so
      -- it remains nullable. Terminal states must set completed_at.
      started_at TIMESTAMPTZ,
      completed_at TIMESTAMPTZ,
      -- Store reviewed short categories only, never raw SDK/model stderr,
      -- object keys, source URLs, tokens, credentials, or stack traces.
      last_error_code TEXT CHECK (
        last_error_code IS NULL OR (
          length(last_error_code) > 0 AND length(last_error_code) <= 100
        )
      ),
      created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,

      CONSTRAINT processing_tasks_job_stage_stem_idempotency
        UNIQUE (job_id, stage, stem_name),
      CONSTRAINT processing_tasks_request_event_id_idempotency
        UNIQUE (request_event_id),

      -- A current worker owns a lease only in active states. Retry/terminal
      -- states clear lease fields so a stale worker cannot continue after it
      -- has scheduled recovery or recorded a final outcome.
      CONSTRAINT processing_tasks_lease_state_matches
        CHECK (
          (status IN ('leased', 'running')
            AND lease_token IS NOT NULL
            AND lease_expires_at IS NOT NULL)
          OR
          (status NOT IN ('leased', 'running')
            AND lease_token IS NULL
            AND lease_expires_at IS NULL)
        ),

      -- A finished stage must retain an explicit UTC completion time. Active
      -- and retry states must not masquerade as completed work.
      CONSTRAINT processing_tasks_completion_state_matches
        CHECK (
          (status IN ('succeeded', 'failed') AND completed_at IS NOT NULL)
          OR
          (status NOT IN ('succeeded', 'failed') AND completed_at IS NULL)
        ),

      -- `running` means a worker has started its actual stage work. A row may
      -- remain `leased` while it performs source validation before allocating
      -- the Demucs model, so only running requires a start timestamp.
      CONSTRAINT processing_tasks_running_start_matches
        CHECK (status <> 'running' OR started_at IS NOT NULL)
    );

    -- The due-work scan runs when no new broker delivery exists. A partial
    -- index keeps it proportional to retry-scheduled rows rather than all
    -- completed history retained with a Job.
    CREATE INDEX IF NOT EXISTS processing_tasks_retry_available_idx
      ON public.processing_tasks (available_at, created_at)
      WHERE status = 'retry_scheduled';

    -- A Pod crash can leave a short task lease behind. This index lets another
    -- replica find only active expired rows, rather than scanning all tasks.
    CREATE INDEX IF NOT EXISTS processing_tasks_active_lease_expiry_idx
      ON public.processing_tasks (lease_expires_at)
      WHERE status IN ('leased', 'running');

    -- Keep updated_at accurate without changing task attempt or Job revision
    -- semantics. The worker must still update those fields explicitly and with
    -- its matching lease token in guarded statements.
    CREATE OR REPLACE FUNCTION set_processing_tasks_updated_at()
    RETURNS TRIGGER
    LANGUAGE plpgsql
    AS $$
    BEGIN
      NEW.updated_at = CURRENT_TIMESTAMP;
      RETURN NEW;
    END;
    $$;

    DROP TRIGGER IF EXISTS processing_tasks_set_updated_at ON public.processing_tasks;
    CREATE TRIGGER processing_tasks_set_updated_at
      BEFORE UPDATE ON public.processing_tasks
      FOR EACH ROW
      EXECUTE FUNCTION set_processing_tasks_updated_at();

    -- Add the ledger row only after table, constraints, indexes, and trigger
    -- all succeed. Reapplying this exact SQL is idempotent for a deliberate
    -- repair, while the immutable ConfigMap blocks in-place source edits.
    INSERT INTO schema_migrations (migration_id, description)
    VALUES (
      'v003_processing_tasks',
      'Durable idempotent Demucs processing tasks with renewable leases, retry scheduling, recovery indexes, and timestamps.'
    )
    ON CONFLICT (migration_id) DO NOTHING;

    COMMIT;
