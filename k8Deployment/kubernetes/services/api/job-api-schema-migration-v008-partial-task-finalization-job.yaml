# Apply this one-shot Job after its immutable v008 SQL ConfigMap. It reuses
# the existing Job-API schema owner only; no PostgreSQL, model, or MinIO
# administrator credential is copied into the migration Pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: job-api-schema-migration-v008-partial-task-finalization
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: job-api-schema-migration-v008-partial-task-finalization
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: asynchronous-partial-task-finalization
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-api-schema-migration-v008-partial-task-finalization
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: clouddsp
        clouddsp.io/environment: local
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql-migration-client
          image: docker.io/library/postgres@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: clouddsp-postgresql.clouddsp-data.svc
            - name: PGPORT
              value: "5432"
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: clouddsp-job-api-database-credentials
                  key: JOB_API_DB_NAME
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: clouddsp-job-api-database-credentials
                  key: JOB_API_DB_USERNAME
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: clouddsp-job-api-database-credentials
                  key: JOB_API_DB_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: migration
              mountPath: /migrations
              readOnly: true
          command:
            - sh
            - -ec
            - |
              printf 'Applying CloudDSP job-finalization migration v008 through Service %s:%s\n' "$PGHOST" "$PGPORT"
              psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 \
                --file /migrations/008_partial_task_finalization.sql
              psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 \
                --command "SELECT migration_id, applied_at FROM public.schema_migrations WHERE migration_id = 'v008_partial_task_finalization';"
              psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 \
                --command "SELECT tgname FROM pg_trigger WHERE tgrelid = 'public.processing_tasks'::regclass AND tgname = 'processing_tasks_aggregate_job_terminal' AND NOT tgisinternal;"
              printf 'CloudDSP partial-task finalization migration v008 passed\n'
      volumes:
        - name: migration
          configMap:
            name: job-api-schema-migration-v008-partial-task-finalization
            defaultMode: 0444
            items:
              - key: 008_partial_task_finalization.sql
                path: 008_partial_task_finalization.sql
