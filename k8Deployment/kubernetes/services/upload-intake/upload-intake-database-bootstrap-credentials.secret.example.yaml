# This is a committed credential *template*, never a usable Secret. Copy it
# to `k8Deployment/.local/upload-intake-database-bootstrap-credentials.secret.yaml`,
# use exactly the same three values as the upload-intake runtime Secret, and
# apply that ignored local copy only while provisioning the PostgreSQL login.
#
# The one-shot bootstrap Job runs in `clouddsp-data`, beside PostgreSQL and its
# administrator Secret. Kubernetes forbids it from reading the runtime Secret
# in `clouddsp-app`, so this short-lived duplicate is explicit and auditable.
# Delete the data-namespace Secret after a successful bootstrap; retain the
# app-namespace runtime Secret for the future consumer Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-upload-intake-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: upload-intake
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-upload-intake-postgresql-provisioning
type: Opaque
stringData:
  # This must stay aligned with the runtime Secret above. The Job validates
  # the pair by connecting as this role, but never prints the password.
  UPLOAD_INTAKE_DB_NAME: clouddsp_job_api
  UPLOAD_INTAKE_DB_USERNAME: clouddsp-upload-intake
  UPLOAD_INTAKE_DB_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_UPLOAD_INTAKE_DATABASE_PASSWORD
