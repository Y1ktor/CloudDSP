# This committed template describes the upload-intake consumer's private MinIO
# runtime identity. Copy it to the ignored
# `k8Deployment/.local/upload-intake-minio-credentials.secret.yaml`, replace
# the secret-key placeholder, and apply only the local copy.
#
# This app-namespace Secret is read by the long-running upload-intake Pod.
# The one-shot MinIO source-read bootstrap Job instead uses a temporary
# data-namespace Secret with the same access/secret key pair, because
# Kubernetes does not mount Secrets across namespaces. The bootstrap attaches
# only the reviewed source-object read policy; the runtime identity is not a
# MinIO root administrator and cannot write or list user artifact buckets.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-upload-intake-minio-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: upload-intake
    app.kubernetes.io/component: source-event-consumer
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: upload-intake-private-source-head-object
type: Opaque
# The Deployment references these exact keys. The MinIO endpoint, bucket,
# region, and addressing style are reviewed non-secret Deployment settings.
# Kubernetes converts `stringData` to encoded `data` when the ignored local
# file is applied; that encoding must not be treated as encryption.
stringData:
  UPLOAD_INTAKE_S3_ACCESS_KEY: clouddsp-upload-intake
  UPLOAD_INTAKE_S3_SECRET_KEY: REPLACE_WITH_A_UNIQUE_LOCAL_UPLOAD_INTAKE_MINIO_SECRET_KEY
