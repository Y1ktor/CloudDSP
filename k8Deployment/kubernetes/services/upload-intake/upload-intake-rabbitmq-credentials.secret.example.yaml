# This is a committed credential *template*, never a Secret to apply as-is.
# Copy it to the ignored local path
# `k8Deployment/.local/upload-intake-rabbitmq-credentials.secret.yaml`, replace
# the password placeholder, then let
# `scripts/upload-intake-rabbitmq-secret-stage.rb bootstrap` create that local
# copy on a fresh cluster before the source-intake broker bootstrap. The
# repository ignores `k8Deployment/.local/`.
#
# The eventual upload-intake Deployment runs in `clouddsp-app`, so its runtime
# Secret must live in that same namespace. The RabbitMQ bootstrap Job needs a
# temporary, separately scoped copy in `clouddsp-data`; Kubernetes does not
# allow cross-namespace Secret mounts. That companion template lives at
# `../rabbitmq/rabbitmq-upload-intake-bootstrap-credentials.secret.example.yaml`.
# Both local copies must contain the same username and password, but the
# temporary data-namespace Secret is deleted after bootstrap succeeds.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-upload-intake-rabbitmq-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: upload-intake
    app.kubernetes.io/component: source-event-consumer
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: consume-minio-source-created-events
type: Opaque
# A future Python AMQP client receives raw username/password values and builds
# its connection parameters without requiring a password-bearing URI in a
# ConfigMap. Host, port, virtual host, exchange, and queue names are reviewed
# non-secret Deployment configuration and therefore intentionally do not live
# in this Secret.
stringData:
  # The later RabbitMQ bootstrap grants this account read permission only on
  # `clouddsp.source-intake`. A later retry task may add write permission only
  # to the dedicated retry/dead-letter exchanges; it must never grant broker
  # administration or permission to publish `demucs.requested` directly.
  RABBITMQ_UPLOAD_INTAKE_USERNAME: clouddsp-upload-intake
  RABBITMQ_UPLOAD_INTAKE_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_UPLOAD_INTAKE_PASSWORD
