# This is a committed credential *template*, never a usable Secret. Copy it
# to `k8Deployment/.local/upload-intake-database-credentials.secret.yaml`,
# replace the password placeholder, and apply only that ignored local copy
# when the upload-intake Deployment is introduced. The repository ignores
# `k8Deployment/.local/`, so the database password cannot enter Git history.
#
# This runtime Secret belongs to `clouddsp-app`, the namespace that will run
# the long-lived upload-intake consumer. Kubernetes Secrets are namespace
# scoped: the consumer cannot and must not read PostgreSQL's administrator
# Secret from `clouddsp-data`.
apiVersion: v1
kind: Secret
metadata:
  # This stable name is the future Deployment's database-connection contract.
  # It contains one restricted PostgreSQL login, never clouddsp-admin.
  name: clouddsp-upload-intake-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: upload-intake
    app.kubernetes.io/component: source-event-consumer
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: private-upload-state-transition
type: Opaque
# `stringData` is convenient while applying the ignored local manifest.
# Kubernetes stores the value as base64-encoded `data`, which is encoding—not
# encryption—so this committed template deliberately contains no real secret.
stringData:
  # The intake service shares the Job API's database because it transitions
  # authoritative Job API rows; a separate database would require copying
  # durable job state and break one-source-of-truth semantics.
  UPLOAD_INTAKE_DB_NAME: clouddsp_job_api
  # This role name matches the consumer component, but its password must be a
  # unique PostgreSQL credential. It is independent from similarly named
  # RabbitMQ and MinIO identities.
  UPLOAD_INTAKE_DB_USERNAME: clouddsp-upload-intake
  UPLOAD_INTAKE_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_UPLOAD_INTAKE_DATABASE_PASSWORD
