# This is a committed *template*, not a deployable production credential file.
# Copy it to the ignored path
# `k8Deployment/.local/postgresql-credentials.secret.yaml`, replace the
# password placeholder with a unique local-development password. The
# versioned `kubernetes/scripts/postgresql-secret-stage.rb bootstrap` command
# checks and creates the Secret from that copied file before a fresh Helm
# install. The `.local/` directory is intentionally ignored so real
# credentials cannot be committed accidentally.
#
# A Kubernetes Secret is intended to limit ordinary configuration exposure and
# let Pods receive sensitive values without placing them in an image or a
# ConfigMap.  It is not encryption by itself: anyone with suitable Kubernetes
# RBAC access can read it.  A later security task will give workloads only the
# permissions they need and will avoid logging these values.
apiVersion: v1
kind: Secret
metadata:
  # This stable name is the contract used later by the PostgreSQL StatefulSet,
  # Keycloak, and CloudDSP services.  Changing it would require changing every
  # `secretKeyRef` that consumes these credentials.
  name: clouddsp-postgresql-credentials
  # Stateful dependencies belong in the data namespace.  Secret names are
  # namespace-scoped, so a Pod in another namespace cannot reference this one
  # directly.
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
type: Opaque
# `stringData` accepts readable text when applying the manifest; the API server
# stores each value in the Secret's base64-encoded `data` field.  Base64 is an
# encoding rather than encryption, which is why the populated file must remain
# ignored and must never be printed in terminal output or committed.
stringData:
  # The official PostgreSQL image reads these exact environment-variable names
  # on its first initialization.  Keeping the names stable lets the later
  # StatefulSet inject them with `valueFrom.secretKeyRef`.
  POSTGRES_DB: clouddsp
  POSTGRES_USER: clouddsp_app
  # This obvious placeholder deliberately prevents the committed template from
  # becoming a usable credential.  Replace it only in the ignored local copy.
  POSTGRES_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_DATABASE_PASSWORD
