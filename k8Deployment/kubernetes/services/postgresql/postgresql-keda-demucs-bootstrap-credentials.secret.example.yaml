# Copy to the ignored path
# k8Deployment/.local/postgresql-keda-demucs-bootstrap-credentials.secret.yaml.
# The password must match the app-namespace KEDA Secret. This temporary copy
# lives in clouddsp-data only while the one-shot role bootstrap Job runs.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-keda-demucs-postgresql-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: keda
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-demucs-scaler-role-provisioning
type: Opaque
stringData:
  KEDA_DEMUCS_DB_USERNAME: clouddsp-keda-demucs
  KEDA_DEMUCS_DB_PASSWORD: REPLACE_WITH_LOCAL_DEMUCS_SCALER_PASSWORD
