# Finite IAM bootstrap for saved-score previews. Only this transient Pod sees
# root credentials; the runtime Job API receives GetObject on midi-sheet-inputs/*,
# with no bucket listing, administration, write, or delete permission.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-job-api-midi-sheet-sources-bootstrap-v001
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: minio-job-api-midi-sheet-sources-bootstrap-v001
    app.kubernetes.io/component: object-storage-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-job-api-midi-sheet-sources-bootstrap-v001
        app.kubernetes.io/component: object-storage-bootstrap
        app.kubernetes.io/part-of: clouddsp
        clouddsp.io/environment: local
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: configure-root-alias
          image: clouddsp-registry.localhost:5001/minio-mc@sha256:37d109dddbbb2c95873f5fc81ac93f37023264770fc580a7564148892087b1b7
          imagePullPolicy: IfNotPresent
          env: &mc-root-env
            - name: MC_CONFIG_DIR
              value: /mc-config
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: clouddsp-minio-root-credentials, key: MINIO_ROOT_USER}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: clouddsp-minio-root-credentials, key: MINIO_ROOT_PASSWORD}
          resources: &mc-resources
            requests: {cpu: 25m, memory: 64Mi, ephemeral-storage: 16Mi}
            limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 32Mi}
          securityContext: &mc-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: &mc-config-mount
            - {name: mc-config, mountPath: /mc-config}
          args: [alias, set, minio-admin, "http://clouddsp-minio:9000", "$(MINIO_ROOT_USER)", "$(MINIO_ROOT_PASSWORD)"]
        - name: wait-for-minio
          image: clouddsp-registry.localhost:5001/minio-mc@sha256:37d109dddbbb2c95873f5fc81ac93f37023264770fc580a7564148892087b1b7
          imagePullPolicy: IfNotPresent
          env: [{name: MC_CONFIG_DIR, value: /mc-config}]
          resources: *mc-resources
          securityContext: *mc-security
          volumeMounts: *mc-config-mount
          args: [ready, minio-admin]
        - name: create-score-source-prefix-policy
          image: clouddsp-registry.localhost:5001/minio-mc@sha256:37d109dddbbb2c95873f5fc81ac93f37023264770fc580a7564148892087b1b7
          imagePullPolicy: IfNotPresent
          env: [{name: MC_CONFIG_DIR, value: /mc-config}]
          resources: *mc-resources
          securityContext: *mc-security
          volumeMounts:
            - {name: mc-config, mountPath: /mc-config}
            - {name: score-policy, mountPath: /policy, readOnly: true}
          args: [admin, policy, create, minio-admin, clouddsp-job-api-midi-sheet-sources-v001, /policy/midi-sheet-sources-policy.json]
        - name: attach-to-job-api-user
          image: clouddsp-registry.localhost:5001/minio-mc@sha256:37d109dddbbb2c95873f5fc81ac93f37023264770fc580a7564148892087b1b7
          imagePullPolicy: IfNotPresent
          env: [{name: MC_CONFIG_DIR, value: /mc-config}]
          resources: *mc-resources
          securityContext: *mc-security
          volumeMounts: *mc-config-mount
          args: [admin, policy, attach, minio-admin, clouddsp-job-api-midi-sheet-sources-v001, "--user=clouddsp-job-api"]
        - name: remove-root-alias
          image: clouddsp-registry.localhost:5001/minio-mc@sha256:37d109dddbbb2c95873f5fc81ac93f37023264770fc580a7564148892087b1b7
          imagePullPolicy: IfNotPresent
          env: [{name: MC_CONFIG_DIR, value: /mc-config}]
          resources: *mc-resources
          securityContext: *mc-security
          volumeMounts: *mc-config-mount
          args: [alias, remove, minio-admin]
      containers:
        - name: completion-marker
          image: clouddsp-registry.localhost:5001/minio-mc@sha256:37d109dddbbb2c95873f5fc81ac93f37023264770fc580a7564148892087b1b7
          imagePullPolicy: IfNotPresent
          resources: *mc-resources
          securityContext: *mc-security
          args: [--version]
      volumes:
        - name: mc-config
          emptyDir: {sizeLimit: 1Mi}
        - name: score-policy
          configMap:
            name: clouddsp-job-api-midi-sheet-sources-policy-v001
            defaultMode: 0444
            items:
              - {key: midi-sheet-sources-policy.json, path: midi-sheet-sources-policy.json}
