# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/basic-pitch-database-credentials.secret.yaml`,
# replace the password placeholder, then apply the ignored copy. Keeping actual
# values outside Git is important even for a local learning cluster because a
# Kubernetes Secret is only base64 encoded, not encrypted by this YAML.
apiVersion: v1
kind: Secret
metadata:
  # The future Basic Pitch Deployment will mount this stable app-namespace
  # Secret. It contains only the worker's own database login, never the
  # PostgreSQL administrator credential used by the short bootstrap Job.
  name: clouddsp-basic-pitch-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: basic-pitch
    app.kubernetes.io/component: midi-extraction-worker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: private-basic-pitch-task-processing
type: Opaque
# `stringData` is convenient for an ignored local file. Kubernetes encodes the
# same keys under `data` when persisting the Secret, so it is not a substitute
# for keeping real passwords out of version control.
stringData:
  # Basic Pitch shares the authoritative Job API database so task leases and
  # artifact completion can later be committed with durable job state.
  BASIC_PITCH_DB_NAME: clouddsp_job_api
  # This PostgreSQL role is distinct from any RabbitMQ/MinIO identities. A
  # credential intended for one system must not authorize another system.
  BASIC_PITCH_DB_USERNAME: clouddsp-basic-pitch
  BASIC_PITCH_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_BASIC_PITCH_DATABASE_PASSWORD
