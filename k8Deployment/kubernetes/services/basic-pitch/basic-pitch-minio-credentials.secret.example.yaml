# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/basic-pitch-minio-credentials.secret.yaml`,
# replace the secret-key placeholder, and apply only that ignored local copy.
# `.local/` is excluded from Git because Kubernetes Secret values are encoded,
# not protected, by the manifest format.
apiVersion: v1
kind: Secret
metadata:
  # The future Basic Pitch Deployment runs in `clouddsp-app` and mounts this
  # stable name. It must never receive MinIO's powerful root administrator
  # Secret from `clouddsp-data`.
  name: clouddsp-basic-pitch-minio-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: basic-pitch
    app.kubernetes.io/component: midi-extraction-worker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: private-basic-pitch-stem-and-midi-access
type: Opaque
stringData:
  # This MinIO/S3 access key names the identity that will receive the reviewed
  # policy. It is not a PostgreSQL role, RabbitMQ user, ServiceAccount, or
  # Keycloak identity, even if local names look similar.
  BASIC_PITCH_S3_ACCESS_KEY: clouddsp-basic-pitch
  # MinIO requires at least eight characters. The actual value must match the
  # temporary bootstrap Secret but must never be committed.
  BASIC_PITCH_S3_SECRET_KEY: REPLACE_WITH_A_UNIQUE_LOCAL_BASIC_PITCH_MINIO_SECRET_KEY
