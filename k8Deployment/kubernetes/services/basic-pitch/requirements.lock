# Hash-enforced dependency lock for the local Linux/ARM64 Basic Pitch worker.
#
# This closure was resolved inside the pinned official Python 3.11 Linux/ARM64
# base image recorded in `images.lock.yaml`. The future Dockerfile must install
# it with:
#
#   pip install --require-hashes --no-deps --only-binary=:all: \
#       --requirement requirements.lock
#
# Every runtime package, including the direct MinIO/RabbitMQ/PostgreSQL clients
# and their transitive dependencies, is explicit. `--no-deps` prevents pip
# from selecting a newer package while `--require-hashes` verifies that a
# downloaded wheel is one of the exact reviewed bytes below.
#
# Basic Pitch 0.4.0 requires TensorFlow below 2.15.1 for Linux Python 3.11.
# On Linux/ARM64, TensorFlow 2.15.0's small selector wheel depends on the
# `tensorflow-cpu-aws` binary wheel. Despite that distribution name, it is the
# platform-specific CPU inference runtime; it does not contact AWS, discover
# credentials, or grant the worker AWS access. MinIO continues to use the
# explicitly configured private S3-compatible endpoint and restricted key.
#
# Native wheel hashes deliberately target CPython 3.11 on Linux/ARM64 only—the
# current Apple-Silicon k3d profile. A Linux/AMD64 or NVIDIA/CUDA profile must
# resolve and review its own compatible native wheel hashes rather than weaken
# hash verification or reuse this CPU-only lock.

# Direct worker/application dependencies and the base-image build tooling that
# TensorFlow's closure imports. Pinning these explicitly avoids relying on
# mutable pre-installed pip tooling in a future base-image change.
