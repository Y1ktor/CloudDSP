# This committed file is a credential *template*, never a Secret to apply as-
# is. Copy it to `k8Deployment/.local/basic-pitch-rabbitmq-credentials.secret.yaml`,
# replace the password placeholder, and apply only that ignored local copy.
# RabbitMQ passwords must not enter Git history, image layers, or Pod logs.
apiVersion: v1
kind: Secret
metadata:
  # The future consumer Deployment runs in `clouddsp-app` and will refer to
  # this stable Secret name. It contains a restricted AMQP login, never the
  # RabbitMQ administrator account used by the temporary bootstrap Job.
  name: clouddsp-basic-pitch-rabbitmq-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: basic-pitch
    app.kubernetes.io/component: midi-extraction-worker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: consume-private-basic-pitch-requests
type: Opaque
# The future AMQP adapter constructs its own connection settings from this
# pair. Service DNS, port, vhost, queue, prefetch, and retry behavior are
# non-secret reviewed Deployment configuration, not Secret data.
stringData:
  # The matching user will have no tags, no configure/write permission, and
  # read/consume/ack access only to clouddsp.basic-pitch.requests. PostgreSQL
  # owns task retries, so the worker does not need queue publication rights.
  RABBITMQ_BASIC_PITCH_USERNAME: clouddsp-basic-pitch
  RABBITMQ_BASIC_PITCH_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_BASIC_PITCH_RABBITMQ_PASSWORD
