# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/basic-pitch-database-bootstrap-credentials.secret.yaml`
# and use exactly the same three values as the app-namespace runtime Secret.
# The duplicate exists only because Kubernetes Secrets are namespace-scoped:
# the administrator bootstrap Job runs in `clouddsp-data` and cannot read a
# Secret from `clouddsp-app`.
apiVersion: v1
kind: Secret
metadata:
  # Delete the real data-namespace copy after the bootstrap has passed. The
  # future long-running worker uses only its app-namespace runtime Secret.
  name: clouddsp-basic-pitch-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: basic-pitch
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-basic-pitch-postgresql-provisioning
type: Opaque
stringData:
  BASIC_PITCH_DB_NAME: clouddsp_job_api
  BASIC_PITCH_DB_USERNAME: clouddsp-basic-pitch
  BASIC_PITCH_DB_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_BASIC_PITCH_DATABASE_PASSWORD
