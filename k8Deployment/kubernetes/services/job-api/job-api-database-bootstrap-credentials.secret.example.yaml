# This is a committed credential *template*, never a usable Secret. Copy it to
# `k8Deployment/.local/job-api-database-bootstrap-credentials.secret.yaml`,
# use the same three values as the Job API's application Secret, and apply the
# ignored local copy only while provisioning the database role.
#
# The one-shot provisioning Job runs in `clouddsp-data` so it can read the
# PostgreSQL administrator Secret without granting cross-namespace Secret
# access. Kubernetes does not let it read the application Secret in
# `clouddsp-app`, so this is a brief, explicit duplicate of the application
# credential. After the bootstrap passes, delete this *bootstrap* Secret; the
# ongoing API Secret in `clouddsp-app` remains the only required copy.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-job-api-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: job-api
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-job-api-postgresql-provisioning
type: Opaque
stringData:
  JOB_API_DB_NAME: clouddsp_job_api
  JOB_API_DB_USERNAME: clouddsp-job-api
  JOB_API_DB_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_JOB_API_DATABASE_PASSWORD
