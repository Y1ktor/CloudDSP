# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/job-api-minio-credentials.secret.yaml`, replace
# the secret placeholder with the same value as the temporary MinIO bootstrap
# Secret, and apply only that ignored local copy.
#
# This Secret belongs in `clouddsp-app`, the namespace where the Job API runs.
# A Pod may read only Secrets from its own namespace, so it cannot—and must
# not—read MinIO's root administrator Secret in `clouddsp-data`.
#
# The Deployment now receives this restricted Secret alongside explicit
# internal/public S3 endpoint settings. The current routes are still read-only
# and make no MinIO call; a later small task will add the upload-contract code
# that consumes these values to generate a presigned POST.
apiVersion: v1
kind: Secret
metadata:
  # This stable name is the future Deployment contract. Keeping only the two
  # sensitive values here avoids treating a normal Service DNS name or bucket
  # name as a secret.
  name: clouddsp-job-api-minio-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: job-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: job-api-private-minio-access
type: Opaque
stringData:
  # It must match the bootstrap Secret's key so MinIO creates/updates the
  # exact identity that the future API Deployment will use.
  JOB_API_S3_ACCESS_KEY: clouddsp-job-api
  JOB_API_S3_SECRET_KEY: REPLACE_WITH_THE_SAME_LOCAL_JOB_API_MINIO_SECRET_KEY
