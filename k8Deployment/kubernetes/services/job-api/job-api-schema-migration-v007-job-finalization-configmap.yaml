# This immutable ConfigMap contains the v007 database migration source. A new
# versioned ConfigMap keeps previously applied DDL auditable and makes the
# resulting job-finalization behavior reproducible in the local cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-api-schema-migration-v007-job-finalization
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: job-api-schema-migration-v007-job-finalization
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: durable-processing-job-finalization
immutable: true
data:
  007_job_finalization.sql: |
    -- CloudDSP Job API schema migration v007
    --
    -- Persist each Basic Pitch result in the API-visible Job artifact map and
    -- aggregate all downstream task outcomes into one terminal Job state.
    -- The deferred trigger runs at transaction commit, so it sees the entire
    -- task/result transaction and serializes competing final stems by locking
    -- the parent Job row. RabbitMQ remains transport only; PostgreSQL owns the
    -- durable processing and terminal-state decision.

    BEGIN;

    -- Serialize the migration with v001-v006 so function/trigger installation
    -- and the migration ledger record are one indivisible schema change.
    SELECT pg_advisory_xact_lock(834929517101);

    DO $migration_guard$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM public.schema_migrations
        WHERE migration_id = 'v006_adtof_processing_tasks'
      ) THEN
        RAISE EXCEPTION 'v007 requires applied migration v006_adtof_processing_tasks';
      END IF;

      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'clouddsp-basic-pitch')
        OR NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'clouddsp-adtof')
      THEN
        RAISE EXCEPTION 'v007 requires the Basic Pitch and ADTOF runtime roles';
      END IF;
    END;
    $migration_guard$;

    -- The Basic Pitch worker may complete only the exact current stem lease.
    -- This administrator-owned function stores verified MinIO output evidence
    -- and changes the task state together, without granting the worker direct
    -- UPDATE access to the broader Job row.
    CREATE OR REPLACE FUNCTION public.clouddsp_complete_basic_pitch_task(
      p_task_id uuid,
      p_job_id uuid,
      p_stem_name text,
      p_input_bucket text,
      p_input_object_key text,
      p_stem_mode text,
      p_lease_token uuid,
      p_midi_key text,
      p_midi_size_bytes bigint,
      p_midi_sha256 text
    )
    RETURNS TABLE (
      task_id uuid,
      job_id uuid,
      completed_at timestamptz
    )
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = pg_catalog
    AS $basic_pitch_completion$
    BEGIN
      -- Do not let the runtime choose its stage, bucket, input/output prefixes,
      -- or stem vocabulary. The Python adapter repeats these checks before
      -- calling this function; PostgreSQL independently enforces them here.
      IF p_input_bucket IS DISTINCT FROM 'clouddsp-uploads'
        OR p_stem_mode NOT IN ('2-stems', '4-stems', '6-stems')
        OR p_stem_name NOT IN ('vocals', 'no_vocals', 'bass', 'other', 'guitar', 'piano')
        OR p_input_object_key IS DISTINCT FROM (
          'stems/' || p_job_id::text || '/' || p_stem_name || '.wav'
        )
        OR p_midi_key IS DISTINCT FROM (
          'midi/' || p_job_id::text || '/' || p_stem_name || '.mid'
        )
        OR p_midi_size_bytes IS NULL
        OR p_midi_size_bytes < 1
        OR p_midi_sha256 IS NULL
        OR p_midi_sha256 !~ '^[0-9a-f]{64}$'
        OR NOT (
          (p_stem_mode = '2-stems' AND p_stem_name IN ('vocals', 'no_vocals'))
          OR (p_stem_mode = '4-stems' AND p_stem_name IN ('vocals', 'bass', 'other'))
          OR (p_stem_mode = '6-stems'
            AND p_stem_name IN ('vocals', 'bass', 'other', 'guitar', 'piano'))
        )
      THEN
        RETURN;
      END IF;

      -- Lock task then Job, matching the claim and ADTOF completion order.
      -- Both writes below belong to one statement; a stale lease or a duplicate
      -- output returns no row and cannot overwrite a previously accepted MIDI.
      RETURN QUERY
      WITH eligible AS MATERIALIZED (
        SELECT task.task_id, task.job_id
        FROM public.processing_tasks AS task
        INNER JOIN public.jobs AS job
          ON job.job_id = task.job_id
        WHERE task.task_id = p_task_id
          AND task.job_id = p_job_id
          AND task.stage = 'basic-pitch'
          AND task.stem_name = p_stem_name
          AND task.input_bucket = p_input_bucket
          AND task.input_object_key = p_input_object_key
          AND task.stem_mode = p_stem_mode
          AND task.status = 'running'
          AND task.lease_token = p_lease_token
          AND task.lease_expires_at > CURRENT_TIMESTAMP
          AND job.status = 'midi_processing'
          AND job.stem_mode = p_stem_mode
          AND job.expires_at > CURRENT_TIMESTAMP
          AND job.stems -> p_stem_name ->> 'status' = 'ready'
          AND job.stems -> p_stem_name ->> 's3_key' = p_input_object_key
          AND NOT (job.midi ? p_stem_name)
        FOR UPDATE OF task, job
      ),
      updated_job AS (
        UPDATE public.jobs AS job
        SET
          midi = jsonb_set(
            job.midi,
            ARRAY[p_stem_name],
            jsonb_build_object(
              'status', 'ready',
              'extractor', 'basic-pitch',
              's3_key', p_midi_key,
              'size_bytes', p_midi_size_bytes,
              'sha256', p_midi_sha256
            ),
            TRUE
          ),
          revision = job.revision + 1,
          error_message = NULL
        FROM eligible
        WHERE job.job_id = eligible.job_id
          AND job.status = 'midi_processing'
          AND job.stem_mode = p_stem_mode
          AND job.expires_at > CURRENT_TIMESTAMP
          AND NOT (job.midi ? p_stem_name)
        RETURNING job.job_id
      ),
      updated_task AS (
        UPDATE public.processing_tasks AS task
        SET
          status = 'succeeded',
          available_at = CURRENT_TIMESTAMP,
          lease_token = NULL,
          lease_expires_at = NULL,
          completed_at = CURRENT_TIMESTAMP,
          last_error_code = NULL
        FROM eligible
        INNER JOIN updated_job
          ON updated_job.job_id = eligible.job_id
        WHERE task.task_id = eligible.task_id
          AND task.job_id = eligible.job_id
          AND task.stage = 'basic-pitch'
          AND task.stem_name = p_stem_name
          AND task.status = 'running'
        RETURNING task.task_id, task.job_id, task.completed_at
      )
      SELECT task.task_id, task.job_id, task.completed_at
      FROM updated_task AS task;
    END;
    $basic_pitch_completion$;

    -- A deferred constraint trigger gives each transaction one consistent
    -- terminal-state check after all of its task and artifact writes are
    -- visible. The finalizer locks the Job row, so simultaneous final stems do
    -- not race into conflicting parent states.
    CREATE OR REPLACE FUNCTION public.clouddsp_finalize_midi_processing_job(
      p_job_id uuid
    )
    RETURNS text
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = pg_catalog
    AS $job_finalizer$
    DECLARE
      current_job public.jobs%ROWTYPE;
      expected_stems text[];
      expected_count integer;
      downstream_task_count integer;
      matched_task_count integer;
      nonterminal_task_count integer;
      failed_task_count integer;
      completed_demucs_count integer;
      output_missing boolean;
    BEGIN
      SELECT job.*
      INTO current_job
      FROM public.jobs AS job
      WHERE job.job_id = p_job_id
      FOR UPDATE;

      IF NOT FOUND OR current_job.status <> 'midi_processing' THEN
        RETURN 'not_processing';
      END IF;

      expected_stems := CASE current_job.stem_mode
        WHEN '2-stems' THEN ARRAY['vocals', 'no_vocals']::text[]
        WHEN '4-stems' THEN ARRAY['vocals', 'bass', 'other', 'drums']::text[]
        WHEN '6-stems' THEN ARRAY['vocals', 'bass', 'other', 'guitar', 'piano', 'drums']::text[]
        ELSE NULL
      END;

      IF expected_stems IS NULL
        OR jsonb_typeof(current_job.stems) IS DISTINCT FROM 'object'
      THEN
        UPDATE public.jobs
        SET status = 'failed',
            revision = revision + 1,
            error_message = 'The processing pipeline produced an incomplete stem set.'
        WHERE job_id = p_job_id AND status = 'midi_processing';
        RETURN 'failed';
      END IF;

      -- PostgreSQL exposes JSON object keys as a set, so count them only after
      -- the JSON type check above. Requiring both exact cardinality and every
      -- approved key also rejects any unexpected extra stem.
      IF (SELECT count(*) FROM jsonb_object_keys(current_job.stems))
          <> cardinality(expected_stems)
        OR NOT (current_job.stems ?& expected_stems)
      THEN
        UPDATE public.jobs
        SET status = 'failed',
            revision = revision + 1,
            error_message = 'The processing pipeline produced an incomplete stem set.'
        WHERE job_id = p_job_id AND status = 'midi_processing';
        RETURN 'failed';
      END IF;

      SELECT count(*)::integer
      INTO completed_demucs_count
      FROM public.processing_tasks AS task
      WHERE task.job_id = p_job_id
        AND task.stage = 'demucs'
        AND task.stem_name = ''
        AND task.status = 'succeeded';

      SELECT
        count(*)::integer,
        count(*) FILTER (
          WHERE task.stem_name = ANY(expected_stems)
            AND task.stage = CASE WHEN task.stem_name = 'drums'
              THEN 'adtof' ELSE 'basic-pitch' END
            AND task.input_bucket = 'clouddsp-uploads'
            AND task.input_object_key = (
              'stems/' || p_job_id::text || '/' || task.stem_name || '.wav'
            )
        )::integer,
        count(*) FILTER (WHERE task.status NOT IN ('succeeded', 'failed'))::integer,
        count(*) FILTER (WHERE task.status = 'failed')::integer
      INTO downstream_task_count,
           matched_task_count,
           nonterminal_task_count,
           failed_task_count
      FROM public.processing_tasks AS task
      WHERE task.job_id = p_job_id
        AND task.stage IN ('basic-pitch', 'adtof');

      -- Demucs writes the complete stem inventory and every downstream task
      -- in one PostgreSQL transaction. Once any child can finish, a short task
      -- set is therefore a durable invariant violation rather than work that
      -- might still be published later.
      IF completed_demucs_count <> 1
        OR downstream_task_count <> cardinality(expected_stems)
        OR matched_task_count <> cardinality(expected_stems)
      THEN
        UPDATE public.jobs
        SET status = 'failed',
            revision = revision + 1,
            error_message = 'The processing pipeline produced an incomplete task set.'
        WHERE job_id = p_job_id AND status = 'midi_processing';
        RETURN 'failed';
      END IF;

      -- Keep the parent active while retries or other stems still own leases.
      -- Once all rows are terminal, one failed child makes the Job failed.
      IF nonterminal_task_count > 0 THEN
        RETURN 'waiting';
      END IF;

      IF failed_task_count > 0 THEN
        UPDATE public.jobs
        SET status = 'failed',
            revision = revision + 1,
            error_message = 'One or more audio-processing steps failed.'
        WHERE job_id = p_job_id AND status = 'midi_processing';
        RETURN 'failed';
      END IF;

      -- A green task row is not sufficient: require every API-visible MIDI
      -- reference to match the deterministic key for its source stem.
      SELECT EXISTS (
        SELECT 1
        FROM unnest(expected_stems) AS expected(stem_name)
        WHERE current_job.midi -> expected.stem_name ->> 'status' IS DISTINCT FROM 'ready'
          OR current_job.midi -> expected.stem_name ->> 's3_key' IS DISTINCT FROM
            ('midi/' || p_job_id::text || '/' || expected.stem_name || '.mid')
          OR (expected.stem_name = 'drums'
            AND current_job.midi -> expected.stem_name ->> 'bpm_key' IS DISTINCT FROM
              ('midi/' || p_job_id::text || '/drums_bpm.json'))
      )
      INTO output_missing;

      IF output_missing THEN
        UPDATE public.jobs
        SET status = 'failed',
            revision = revision + 1,
            error_message = 'The processing pipeline did not register every output artifact.'
        WHERE job_id = p_job_id AND status = 'midi_processing';
        RETURN 'failed';
      END IF;

      UPDATE public.jobs
      SET status = 'completed',
          revision = revision + 1,
          error_message = NULL
      WHERE job_id = p_job_id AND status = 'midi_processing';
      RETURN 'completed';
    END;
    $job_finalizer$;

    -- This trigger function runs as the schema owner at commit. Runtime worker
    -- roles keep their task-only UPDATE grants and cannot directly choose the
    -- parent Job's terminal state or supply user-visible error text.
    CREATE OR REPLACE FUNCTION public.clouddsp_aggregate_terminal_midi_task()
    RETURNS trigger
    LANGUAGE plpgsql
    SECURITY DEFINER
    SET search_path = pg_catalog
    AS $aggregate_terminal_task$
    BEGIN
      PERFORM public.clouddsp_finalize_midi_processing_job(NEW.job_id);
      RETURN NEW;
    END;
    $aggregate_terminal_task$;

    -- Deferred execution matters for ADTOF: its existing typed completion
    -- function also writes `jobs.midi.drums` in the same transaction. At commit
    -- this trigger sees that artifact map and the completed task together.
    DROP TRIGGER IF EXISTS processing_tasks_aggregate_job_terminal
      ON public.processing_tasks;
    CREATE CONSTRAINT TRIGGER processing_tasks_aggregate_job_terminal
      AFTER UPDATE OF status ON public.processing_tasks
      DEFERRABLE INITIALLY DEFERRED
      FOR EACH ROW
      WHEN (
        OLD.status IS DISTINCT FROM NEW.status
        AND NEW.stage IN ('basic-pitch', 'adtof')
        AND NEW.status IN ('succeeded', 'failed')
      )
      EXECUTE FUNCTION public.clouddsp_aggregate_terminal_midi_task();

    -- Older Basic Pitch workers recorded success only in processing_tasks.
    -- Their deterministic MinIO key is recoverable from the already verified
    -- task coordinate, so backfill the browser/API artifact pointers without
    -- inventing a digest or changing any existing richer result entry.
    UPDATE public.jobs AS job
    SET midi = COALESCE(
      (
        SELECT jsonb_object_agg(
          task.stem_name,
          jsonb_build_object(
            'status', 'ready',
            'extractor', 'basic-pitch',
            's3_key', 'midi/' || job.job_id::text || '/' || task.stem_name || '.mid'
          )
        )
        FROM public.processing_tasks AS task
        WHERE task.job_id = job.job_id
          AND task.stage = 'basic-pitch'
          AND task.status = 'succeeded'
      ),
      '{}'::jsonb
    ) || job.midi
    WHERE job.status = 'midi_processing'
      AND EXISTS (
        SELECT 1 FROM public.processing_tasks AS task
        WHERE task.job_id = job.job_id
          AND task.stage = 'basic-pitch'
          AND task.status = 'succeeded'
      );

    -- Existing Jobs may already have all successful task rows from before the
    -- deferred trigger existed. Reconcile each one once through the same
    -- guarded aggregate instead of leaving historical parents stuck forever.
    DO $backfill_finalization$
    DECLARE
      existing_job RECORD;
    BEGIN
      FOR existing_job IN
        SELECT job_id FROM public.jobs WHERE status = 'midi_processing'
      LOOP
        PERFORM public.clouddsp_finalize_midi_processing_job(existing_job.job_id);
      END LOOP;
    END;
    $backfill_finalization$;

    -- The Basic Pitch runtime can invoke only its typed completion function.
    -- ADTOF completion remains its existing typed capability; it needs no
    -- direct grant to the parent finalizer because the deferred trigger runs
    -- under its schema-owner identity.
    REVOKE ALL PRIVILEGES ON FUNCTION public.clouddsp_complete_basic_pitch_task(
      uuid, uuid, text, text, text, text, uuid, text, bigint, text
    ) FROM PUBLIC;
    GRANT EXECUTE ON FUNCTION public.clouddsp_complete_basic_pitch_task(
      uuid, uuid, text, text, text, text, uuid, text, bigint, text
    ) TO "clouddsp-basic-pitch";
    REVOKE ALL PRIVILEGES ON FUNCTION public.clouddsp_finalize_midi_processing_job(uuid)
      FROM PUBLIC;
    REVOKE ALL PRIVILEGES ON FUNCTION public.clouddsp_aggregate_terminal_midi_task()
      FROM PUBLIC;

    INSERT INTO public.schema_migrations (migration_id, description)
    VALUES (
      'v007_job_finalization',
      'Persists Basic Pitch MIDI output references and finalizes parent Jobs only after the expected stem-task set is terminal and every output is registered.'
    )
    ON CONFLICT (migration_id) DO NOTHING;

    COMMIT;
