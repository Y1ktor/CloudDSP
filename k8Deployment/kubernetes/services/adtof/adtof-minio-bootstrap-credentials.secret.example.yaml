# This committed template is copied to
# `k8Deployment/.local/adtof-minio-bootstrap-credentials.secret.yaml` with the
# same S3 pair as the future app-namespace runtime Secret. Kubernetes Secrets
# are namespace-scoped, so the temporary data-namespace bootstrap Job cannot
# read the app Secret directly.
apiVersion: v1
kind: Secret
metadata:
  # Delete the actual data-namespace copy after the MinIO bootstrap Job
  # succeeds. Only the restricted app-namespace runtime Secret should remain.
  name: clouddsp-adtof-minio-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: adtof
    app.kubernetes.io/component: object-storage-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-adtof-minio-provisioning
type: Opaque
stringData:
  ADTOF_S3_ACCESS_KEY: clouddsp-adtof
  ADTOF_S3_SECRET_KEY: REPLACE_WITH_THE_SAME_LOCAL_ADTOF_MINIO_SECRET_KEY
