# This committed template is copied to
# `k8Deployment/.local/adtof-database-bootstrap-credentials.secret.yaml` with
# the exact same three values as the app-namespace runtime Secret. The duplicate
# exists only because a Kubernetes Secret cannot be mounted across namespaces:
# the administrator bootstrap Job runs in `clouddsp-data` beside PostgreSQL.
apiVersion: v1
kind: Secret
metadata:
  # Delete the real `clouddsp-data` copy after the bootstrap Job passes. A
  # later long-running worker must use only the restricted app-namespace Secret.
  name: clouddsp-adtof-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: adtof
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-adtof-postgresql-provisioning
type: Opaque
stringData:
  ADTOF_DB_NAME: clouddsp_job_api
  ADTOF_DB_USERNAME: clouddsp-adtof
  ADTOF_DB_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_ADTOF_DATABASE_PASSWORD
