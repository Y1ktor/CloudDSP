# Hash-enforced dependency lock for the local CPU ADTOF worker.
#
# This closure targets CPython 3.11 on Linux/ARM64: the local Apple-Silicon
# k3d profile. Native wheels below are intentionally not portable to Linux
# AMD64 or an NVIDIA/CUDA image. A different platform needs its own reviewed
# lock rather than weakening hash checks or downloading another architecture.
#
# The later Dockerfile must first install the locked `setuptools` and `wheel`
# build tools, then install this complete closure with:
#
#   pip install --require-hashes --no-deps --no-build-isolation \
#       --extra-index-url https://download.pytorch.org/whl/cpu \
#       --requirement requirements.lock
#
# `--no-deps` fails closed if a transitive dependency disappears from this
# file. `--require-hashes` verifies exact archive bytes. Build isolation is
# disabled because the two source archives below use the separately locked
# build tools instead of fetching mutable dependencies during image creation.
#
# `torch==2.5.1` is the official CPU wheel for Linux/ARM64. Unlike the Linux/
# x86 PyTorch-index artifact, its version has no `+cpu` suffix; its ARM64
# metadata has no NVIDIA dependency. This preserves the cloud ADTOF 2.5.1
# baseline without putting CUDA in the local worker image.
#
# ADTOF itself declares Torch, Librosa, PrettyMIDI, and NumPy. This lock also
# contains the existing restricted PostgreSQL, RabbitMQ, and MinIO clients plus
# their full closures. The MinIO client still uses only the private in-cluster
# service and mounted local credential, never an AWS service or ambient AWS
# identity.

# Build tools required before the two source distributions can be installed.
# `pretty-midi==0.2.10` imports the legacy `pkg_resources` module at runtime;
# the reviewed Python base's setuptools 79.0.1 still supplies it, whereas the
# newer 84.0.0 release does not. Keep this runtime-compatible build tool in the
# final closure rather than relying on an unpinned package already in the base.
# `wheel` also requires the explicit packaging wheel recorded below.
setuptools==79.0.1 \
    --hash=sha256:e147c0549f27767ba362f9da434eab9c5dc0045d5304feb602a0af001089fc51
wheel==0.46.3 \
    --hash=sha256:4b399d56c9d9338230118d705d9737a2a468ccca63d5e813e2a4fc7815d8bc4d

# Pin the exact public GitHub source archive—not a moving branch or VCS
# checkout. The SHA-256 proves the archive bytes at the revision referenced by
# `app/model_configuration.py`. Its package data includes reviewed `.pth`
# weights, so a running Pod does not download model weights.
adtof-pytorch @ https://codeload.github.com/xavriley/ADTOF-pytorch/tar.gz/85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9 \
    --hash=sha256:28602a3bd89836240d519396b566966c52b6439e2f3cda61d8a674433b350b56

