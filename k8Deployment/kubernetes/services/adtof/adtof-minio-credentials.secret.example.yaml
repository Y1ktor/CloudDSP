# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/adtof-minio-credentials.secret.yaml`, replace the
# placeholder, and apply only the ignored local copy. A Kubernetes Secret is
# encoded rather than safely encrypted by this YAML, so no usable S3 key pair
# belongs in Git, an ADTOF image, a ConfigMap, or browser configuration.
apiVersion: v1
kind: Secret
metadata:
  # A future ADTOF Deployment mounts this stable app-namespace Secret. It must
  # never receive the MinIO root Secret that only a short bootstrap Job needs.
  name: clouddsp-adtof-minio-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: adtof
    app.kubernetes.io/component: drum-midi-worker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: private-adtof-drum-stem-and-midi-access
type: Opaque
stringData:
  # This S3 access key is a MinIO identity, not the similarly named PostgreSQL
  # role, RabbitMQ user, Kubernetes ServiceAccount, or Keycloak identity.
  ADTOF_S3_ACCESS_KEY: clouddsp-adtof
  # MinIO requires at least eight characters. The real value must match the
  # temporary bootstrap Secret but must never be committed.
  ADTOF_S3_SECRET_KEY: REPLACE_WITH_A_UNIQUE_LOCAL_ADTOF_MINIO_SECRET_KEY
