# This committed file is a credential *template*, never a Secret to apply as-
# is. Copy it to `k8Deployment/.local/adtof-rabbitmq-credentials.secret.yaml`,
# replace the password placeholder, and apply only that ignored local copy.
# `k8Deployment/.local/` is Git-ignored, preventing a live AMQP password from
# entering the repository, container image layers, or ordinary Pod logs.
#
# The future ADTOF Deployment runs in `clouddsp-app`, so its runtime Secret
# belongs in that same namespace. The one-shot administrator Job runs in
# `clouddsp-data` and therefore needs a separate temporary copy; Kubernetes
# Secrets are namespace-scoped and cannot be mounted across this boundary.
apiVersion: v1
kind: Secret
metadata:
  # This stable name is the only AMQP credential a future ADTOF worker may
  # mount. It is deliberately distinct from RabbitMQ's administrator Secret.
  name: clouddsp-adtof-rabbitmq-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: adtof
    app.kubernetes.io/component: drum-midi-worker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: consume-private-adtof-requests
type: Opaque
stringData:
  # The matching broker user has no RabbitMQ tags, configure authority, or
  # publish authority. Its exact read permission allows consuming and manually
  # acknowledging only `clouddsp.adtof.requests`; PostgreSQL owns retries.
  RABBITMQ_ADTOF_USERNAME: clouddsp-adtof
  RABBITMQ_ADTOF_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_ADTOF_RABBITMQ_PASSWORD
