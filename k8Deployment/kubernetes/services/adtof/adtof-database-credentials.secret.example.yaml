# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/adtof-database-credentials.secret.yaml`, replace
# the placeholder, and apply only that ignored local copy. Kubernetes Secrets
# are base64 encoded rather than encrypted by this YAML, so real passwords must
# never be committed with the ADTOF worker source or manifests.
apiVersion: v1
kind: Secret
metadata:
  # A future ADTOF Deployment mounts this long-lived app-namespace Secret. It
  # holds only its PostgreSQL login—not the administrator account that the
  # short-lived bootstrap Job needs to create/reconcile that login.
  name: clouddsp-adtof-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: adtof
    app.kubernetes.io/component: drum-midi-worker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: private-adtof-task-processing
type: Opaque
# `stringData` makes an ignored local authoring file readable. Kubernetes
# persists the same keys under `data`; neither form makes a Secret safe to put
# in Git or a browser bundle.
stringData:
  # ADTOF shares the authoritative Job API database so its leases/recovery can
  # be coordinated with the existing Demucs and Basic Pitch processing tasks.
  ADTOF_DB_NAME: clouddsp_job_api
  # PostgreSQL, RabbitMQ, and MinIO use separate ADTOF identities. Reusing this
  # database password for another system would widen the blast radius.
  ADTOF_DB_USERNAME: clouddsp-adtof
  ADTOF_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_ADTOF_DATABASE_PASSWORD
