# This is a committed credential *template*, not a Secret to apply as-is.
# Copy it to the ignored path
# `k8Deployment/.local/keycloak-database-credentials.secret.yaml`, replace the
# password placeholder, and apply only that local copy.  The repository ignores
# `.local/`, preventing a usable database password from entering Git history.
#
# Keycloak needs a dedicated PostgreSQL login and database instead of the
# `clouddsp-admin` database-administrator account.  Later, a small bootstrap
# Job will create the matching PostgreSQL role and `clouddsp_keycloak` database.
# The future Keycloak Deployment will receive this Secret as `KC_DB_USERNAME`
# and `KC_DB_PASSWORD`, never as values baked into its image or ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  # This stable name is the contract shared by the upcoming database-bootstrap
  # Job and Keycloak Deployment.  Secret names are namespace-scoped, so both
  # consumers must run in `clouddsp-data` or receive copied credentials later.
  name: clouddsp-keycloak-database-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: keycloak-postgresql-connection
type: Opaque
# `stringData` accepts readable input when applied.  Kubernetes stores its
# resulting `data` values as base64 text, which is encoding—not encryption—so
# live values belong only in the ignored local copy and must not be logged.
stringData:
  # PostgreSQL identifiers use underscores because an unquoted SQL database
  # name containing a hyphen is inconvenient and error-prone in later scripts.
  KEYCLOAK_DB_NAME: clouddsp_keycloak
  KEYCLOAK_DB_USERNAME: clouddsp-keycloak
  KEYCLOAK_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_KEYCLOAK_DATABASE_PASSWORD
