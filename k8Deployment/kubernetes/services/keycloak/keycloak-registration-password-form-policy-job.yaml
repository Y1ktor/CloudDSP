# This one-time Job changes one narrow part of the CloudDSP realm's standard
# Keycloak `registration` flow: the Password Validation form action.
#
# With self-registration and email verification both enabled, current Keycloak
# defaults to collecting only profile information, then asking the verified
# user to create a password through the `Update Password` required action.
# That is a valid security-first flow, but it is surprising for this local
# CloudDSP user experience.  This Job sets Keycloak's documented
# `always_set_password_on_register_form` option to true instead.  New users
# must therefore enter and confirm a password on the initial registration
# screen, then verify their email without an unexpected password-setup page.
#
# Important compatibility note:
# Keycloak marks this setting as deprecated because its preferred long-term
# behavior is deferred password creation after email verification.  We use it
# deliberately for this local learning environment.  A future Keycloak upgrade
# should revalidate this Job; if the option is removed, the supported
# alternative is Keycloak's deferred flow, optionally with a maintained custom
# login theme that explains the password-setup step clearly.
apiVersion: batch/v1
kind: Job
metadata:
  # A distinct Job name preserves the outcome of the earlier realm-level
  # registration policy Job.  Reapplying a completed Job does not rerun it;
  # delete this Job before deliberately applying the same policy again.
  name: keycloak-registration-password-form-policy
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: keycloak-registration-password-form-policy
    app.kubernetes.io/component: identity-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: keycloak-password-on-registration-form-policy
spec:
  # Preserve the short-lived administrative result for five minutes, then let
  # Kubernetes clean up both this Job and its completed Pod automatically.
  ttlSecondsAfterFinished: 300
  # Configuration is an intentional, single request sequence.  A failure must
  # remain visible rather than retrying with an unknown partial cause.
  backoffLimit: 0
  # The Job deliberately makes several independent Java-based Admin CLI calls
  # (lookup, update, and read-back).  Three minutes leaves room for that work
  # on a CPU-constrained local Mac while still bounding an unavailable Service
  # or DNS path; it is not a long-running controller.
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-registration-password-form-policy
        app.kubernetes.io/component: identity-bootstrap
        app.kubernetes.io/part-of: clouddsp
        clouddsp.io/environment: local
    spec:
      restartPolicy: Never
      # This client uses Keycloak's Admin HTTP API, not Kubernetes' API.  It
      # does not need an automatically mounted service-account credential.
      automountServiceAccountToken: false
      securityContext:
        # Use the official Keycloak image's non-root user and Kubernetes'
        # baseline seccomp profile for this disposable configuration client.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-admin-cli
          # `kcadm.sh` is shipped in the same immutable Keycloak image that
          # runs the identity server.  Its digest is recorded in
          # ../../images.lock.yaml; no unpinned administration image is used.
          image: quay.io/keycloak/keycloak@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
          imagePullPolicy: IfNotPresent
          env:
            # Reach Keycloak through its private ClusterIP Service.  A
            # bootstrap Job should not depend on browser-facing Traefik
            # routing or the Mac's `keycloak.localhost` DNS behavior.
            - name: KEYCLOAK_ADMIN_URL
              value: http://clouddsp-keycloak:8080
            - name: KEYCLOAK_ADMIN_REALM
              value: master
            - name: CLOUDDSP_REALM
              value: clouddsp
            # The ignored local Secret supplies the initial master-realm
            # administrator.  Its password is never written into this
            # manifest, command text, or Job logs.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: clouddsp-keycloak-bootstrap-admin
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clouddsp-keycloak-bootstrap-admin
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
          resources:
            # This Pod sends only small local REST calls, but every `kcadm`
            # invocation starts a Java process.  100m CPU throttled five such
            # startup calls enough to exceed the former two-minute deadline on
            # this Mac.  These still-small bounds let the one-off Job finish
            # promptly without competing materially with processing workloads.
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            # Every kcadm invocation uses --no-config, so no access/refresh
            # token is cached on disk and a read-only root filesystem is safe.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              # Store the common authentication options in positional
              # parameters.  Passing `"$@"` preserves a future credential
              # containing spaces or punctuation as exactly one argument.
              KCADM=/opt/keycloak/bin/kcadm.sh
              set -- --no-config \
                --server "$KEYCLOAK_ADMIN_URL" \
                --realm "$KEYCLOAK_ADMIN_REALM" \
                --user "$KC_BOOTSTRAP_ADMIN_USERNAME" \
                --password "$KC_BOOTSTRAP_ADMIN_PASSWORD"

              # Ensure the earlier realm bootstrap completed.  Suppress its
              # full representation so later sensitive realm settings cannot
              # accidentally become readable through this Job's logs.
              if ! "$KCADM" get "realms/$CLOUDDSP_REALM" "$@" >/dev/null 2>&1; then
                printf 'Keycloak registration password-form policy failed: CloudDSP realm is unavailable\n' >&2
                exit 1
              fi

              # Keycloak creates execution/configuration IDs per realm.  Never
              # hard-code an ID from this cluster: this function finds the
              # standard Password Validation action by its stable provider ID
              # and prints `execution-ID,configuration-ID`.  A new standard
              # flow has an empty configuration-ID but keeps the trailing comma.
              #
              # The immutable official Keycloak image intentionally excludes
              # `awk`; `sed` is present and sufficient for this narrow,
              # administrator-controlled CSV response.  The flow-executions
              # endpoint is used instead of Keycloak's single-execution
              # endpoint because it remains responsive after a configuration
              # is attached on the current local Keycloak release.
              read_registration_password_execution() {
                REGISTRATION_EXECUTIONS=$("$KCADM" get authentication/flows/registration/executions "$@" \
                  -r "$CLOUDDSP_REALM" \
                  --fields id,providerId,authenticationConfig --format csv --noquotes)
                printf '%s\n' "$REGISTRATION_EXECUTIONS" | \
                  sed -n 's/^\([^,]*\),registration-password-action,\(.*\)$/\1,\2/p' | \
                  sed -n '1p'
              }

              # Shell functions receive their own positional parameters.  Pass
              # the Admin CLI option list explicitly so `"$@"` inside the
              # helper retains --server, --realm, and administrator arguments.
              PASSWORD_EXECUTION_RECORD=$(read_registration_password_execution "$@")
              case "$PASSWORD_EXECUTION_RECORD" in
                *,*)
                  PASSWORD_EXECUTION_ID=${PASSWORD_EXECUTION_RECORD%%,*}
                  PASSWORD_CONFIG_ID=${PASSWORD_EXECUTION_RECORD#*,}
                  ;;
                *)
                  printf 'Keycloak registration password-form policy failed: Password Validation execution was not found\n' >&2
                  exit 1
                  ;;
              esac

              # This is Keycloak's exact configuration representation for the
              # Password Validation action.  Values are strings because the
              # Admin REST API stores authenticator configuration as a string
              # map, even for a boolean UI toggle.
              password_form_configuration() {
                cat <<'JSON'
              {
                "alias": "clouddsp-registration-password-form-policy",
                "config": {
                  "always_set_password_on_register_form": "true"
                }
              }
              JSON
              }

              # A fresh standard flow has no configuration ID on this action.
              # Create it once; later intentional Job reruns update the same
              # generated configuration rather than creating a duplicate.
              if [ -z "$PASSWORD_CONFIG_ID" ]; then
                password_form_configuration | "$KCADM" create \
                  "authentication/executions/$PASSWORD_EXECUTION_ID/config" "$@" \
                  -r "$CLOUDDSP_REALM" -f - >/dev/null
              else
                password_form_configuration | "$KCADM" update \
                  "authentication/config/$PASSWORD_CONFIG_ID" "$@" \
                  -r "$CLOUDDSP_REALM" -f - >/dev/null
              fi

              # Read the generated configuration ID from the same supported
              # flow list, then read back only the one non-sensitive policy
              # key.  This catches a malformed Admin API request without
              # logging a full Keycloak configuration or administrator secret.
              PASSWORD_EXECUTION_RECORD=$(read_registration_password_execution "$@")
              PASSWORD_CONFIG_ID=${PASSWORD_EXECUTION_RECORD#*,}

              if [ "$PASSWORD_EXECUTION_RECORD" = "$PASSWORD_CONFIG_ID" ] || [ -z "$PASSWORD_CONFIG_ID" ] || \
                ! "$KCADM" get "authentication/config/$PASSWORD_CONFIG_ID" "$@" \
                -r "$CLOUDDSP_REALM" \
                | \
                grep -Eq '"always_set_password_on_register_form"[[:space:]]*:[[:space:]]*"true"'; then
                printf 'Keycloak registration password-form policy failed: setting was not persisted\n' >&2
                exit 1
              fi

              printf 'Keycloak registration password-form policy passed\n'
