# This is a committed credential *template*, never a Secret to apply as-is.
# Copy it to the ignored path
# `k8Deployment/.local/keycloak-bootstrap-admin.secret.yaml`, replace both
# placeholders, and apply only that local copy.  The repository ignores
# `.local/`, so a usable Keycloak administrator password stays out of Git.
#
# These are Keycloak bootstrap-administrator credentials for the `master`
# realm, not PostgreSQL credentials and not CloudDSP application-user accounts.
# The future Keycloak Deployment reads them only while its initial administrator
# is absent.  Later Keycloak administration must manage that account through
# Keycloak itself rather than treating this Secret as a password reset tool.
apiVersion: v1
kind: Secret
metadata:
  # This stable name is the contract used by the future Keycloak Deployment.
  # It is namespace-scoped and intentionally separate from the Keycloak
  # database-connection Secret created in the preceding task.
  name: clouddsp-keycloak-bootstrap-admin
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: keycloak-initial-admin-bootstrap
type: Opaque
# `stringData` is convenient for a local source manifest; the API server stores
# populated values in the Secret's encoded `data` field.  Base64 encoding is
# not encryption, so do not commit or print values from the ignored local copy.
stringData:
  # These exact Keycloak configuration names create an administrator only when
  # the target realm does not already have one.  They are deliberately not
  # generic `USERNAME`/`PASSWORD` keys, making their consumer contract clear.
  KC_BOOTSTRAP_ADMIN_USERNAME: REPLACE_WITH_A_UNIQUE_LOCAL_KEYCLOAK_ADMIN_USERNAME
  KC_BOOTSTRAP_ADMIN_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_KEYCLOAK_ADMIN_PASSWORD
