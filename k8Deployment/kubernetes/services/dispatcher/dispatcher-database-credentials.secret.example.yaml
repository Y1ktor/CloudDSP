# This committed file documents the dispatcher's runtime Secret contract; it
# is not a credential to apply. Copy it to the ignored
# `k8Deployment/.local/dispatcher-database-credentials.secret.yaml`, replace
# the password placeholder, and keep the local copy out of Git.
#
# Both dispatcher Deployments run in clouddsp-app and reference this same
# restricted PostgreSQL identity. The separate, temporary bootstrap Secret in
# clouddsp-data must use the same name/user/password values while the
# dispatcher-database-bootstrap Job creates and verifies that role. Kubernetes
# does not permit a Pod to mount a Secret from another namespace.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-dispatcher-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: dispatcher
    app.kubernetes.io/component: outbox-publisher
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: restricted-outbox-database-access
type: Opaque
# The workload reads these exact keys through `secretKeyRef`. `stringData`
# becomes base64-encoded Secret data on apply; that encoding is not encryption.
# Never place the real password in this example, a Helm values file, or logs.
stringData:
  # Both dispatchers lease events from the Job API's authoritative outbox,
  # rather than keeping a second copy of durable job state.
  DISPATCHER_DB_NAME: clouddsp_job_api
  # This login is provisioned by the one-shot dispatcher database bootstrap;
  # it is not the PostgreSQL administrator or the Job API's own login.
  DISPATCHER_DB_USERNAME: clouddsp-dispatcher
  DISPATCHER_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_DISPATCHER_DATABASE_PASSWORD
