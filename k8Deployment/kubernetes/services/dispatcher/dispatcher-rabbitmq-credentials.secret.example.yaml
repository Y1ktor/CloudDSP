# This committed file documents the dispatcher's RabbitMQ runtime keys. Copy
# it to the ignored
# `k8Deployment/.local/dispatcher-rabbitmq-credentials.secret.yaml`, replace
# the password placeholder, and apply only that local copy.
#
# The two dispatcher Deployments share one narrow publisher identity in their
# own clouddsp-app namespace. A separate, temporary clouddsp-data Secret is
# used by the rabbitmq-dispatcher-publisher-bootstrap Job to create the same
# broker user; that bootstrap copy must be removed after verification. Neither
# long-running dispatcher receives the broker administrator credential.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-dispatcher-rabbitmq-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: dispatcher
    app.kubernetes.io/component: outbox-publisher
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: restricted-processing-event-publication
type: Opaque
# The Deployment keeps broker host, port, vhost, and exchange in versioned
# non-secret configuration. Only the login fields belong in this Secret.
stringData:
  # The bootstrap grants this user write access only to the reviewed
  # processing exchange; it cannot administer RabbitMQ or consume queues.
  RABBITMQ_DISPATCHER_USERNAME: clouddsp-dispatcher
  RABBITMQ_DISPATCHER_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_DISPATCHER_RABBITMQ_PASSWORD
