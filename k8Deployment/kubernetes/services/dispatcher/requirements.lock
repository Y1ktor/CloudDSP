# This is the dispatcher service's hash-enforced Python dependency lock. It is
# intentionally independent from upload-intake: each future image can be
# rebuilt from its own reviewed source and cannot silently inherit a package
# merely because another Kubernetes service happens to use it.
#
# The future Dockerfile must install this file with `pip --require-hashes`.
# Pika is pure Python and its universal wheel supports both the current local
# Linux/ARM64 k3d profile and a future Linux/AMD64 profile without a compiler.
# PostgreSQL remains authoritative for the outbox lease. Psycopg's binary
# package bundles libpq, so the future slim dispatcher image needs no compiler
# or operating-system PostgreSQL client package. These reviewed hashes target
# the current Python 3.12/Linux ARM64 k3d profile; a future Linux/AMD64 image
# task must retain hash enforcement and add its separately reviewed wheel hash.
