# Copy this template to the ignored local path:
#
#   k8Deployment/.local/dispatcher-smoke-rabbitmq-credentials.secret.yaml
#
# Replace only the password placeholder there, then apply the local copy to
# `clouddsp-app`. This is a permanent *test-only* RabbitMQ identity used by a
# later dispatcher smoke Job. It is not the dispatcher publisher account and
# does not contain the RabbitMQ administrator credential.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-dispatcher-smoke-rabbitmq-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: dispatcher-smoke
    app.kubernetes.io/component: integration-test-identity
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: restricted-demucs-queue-smoke-consumption
type: Opaque
stringData:
  # The corresponding RabbitMQ user has no tags, no configure permission, no
  # publish permission, and read access only to clouddsp.demucs.requests.
  # Keep the fixed username synchronized with the temporary bootstrap Secret.
  RABBITMQ_DISPATCHER_SMOKE_USERNAME: clouddsp-dispatcher-smoke
  # Never commit a real password. The app-namespace Job later consumes only
  # this narrow identity and cannot use RabbitMQ's management API.
  RABBITMQ_DISPATCHER_SMOKE_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_PASSWORD
