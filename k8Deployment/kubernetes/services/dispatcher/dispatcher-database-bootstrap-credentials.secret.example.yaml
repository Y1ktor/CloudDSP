# This committed template documents the temporary PostgreSQL credentials used
# only by the dispatcher role bootstrap Job in clouddsp-data. The guarded
# application identity stage derives this short-lived Secret from the matching
# app-namespace runtime source, validates it with the API server, then removes
# it after the versioned Job and role audit pass.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-dispatcher-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: dispatcher
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-dispatcher-postgresql-provisioning
type: Opaque
stringData:
  DISPATCHER_DB_NAME: clouddsp_job_api
  DISPATCHER_DB_USERNAME: clouddsp-dispatcher
  DISPATCHER_DB_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_DISPATCHER_DATABASE_PASSWORD
