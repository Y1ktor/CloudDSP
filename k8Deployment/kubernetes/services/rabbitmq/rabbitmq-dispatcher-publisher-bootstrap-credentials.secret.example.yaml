# This committed template documents the temporary RabbitMQ administrator-Job
# credentials for the dispatcher's restricted publisher identity. The guarded
# identity stage derives the temporary Secret from the matching app runtime
# source, validates it with the API server, then removes it after the versioned
# Job and broker permission audit pass.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-dispatcher-rabbitmq-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: dispatcher
    app.kubernetes.io/component: message-identity-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-dispatcher-rabbitmq-provisioning
type: Opaque
stringData:
  RABBITMQ_DISPATCHER_USERNAME: clouddsp-dispatcher
  RABBITMQ_DISPATCHER_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_DISPATCHER_RABBITMQ_PASSWORD
