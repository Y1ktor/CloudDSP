# This is a committed credential *template*, never a Secret to apply as-is.
# Copy it to the ignored path
# `k8Deployment/.local/upload-intake-rabbitmq-bootstrap-credentials.secret.yaml`,
# replace the password placeholder, and apply only that local copy immediately
# before the RabbitMQ source-intake bootstrap Job. The repository ignores
# `k8Deployment/.local/`, keeping the live credential out of Git history.
#
# Kubernetes namespaces are hard boundaries for Secret references: the
# bootstrap Job runs in clouddsp-data so it can read the RabbitMQ administrator
# Secret, while the eventual upload-intake Deployment runs in clouddsp-app.
# This short-lived clouddsp-data copy is therefore necessary to create the
# consumer account, but it must hold the *same* username and password as the
# runtime Secret at ../upload-intake/upload-intake-rabbitmq-credentials.secret.example.yaml.
# It is not a second RabbitMQ identity and must be deleted after the bootstrap
# Job completes successfully.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-upload-intake-rabbitmq-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: rabbitmq-source-intake-bootstrap
    app.kubernetes.io/component: message-topology-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-upload-intake-user-provisioning
type: Opaque
# `stringData` is for a locally ignored authoring file. Kubernetes converts it
# to encoded Secret `data` while applying; base64 is not encryption, so never
# commit the populated local file or print its values in a terminal/log.
stringData:
  # This exact account is later mounted by the upload-intake Deployment from
  # its own clouddsp-app runtime Secret. Keep this username fixed so the Job
  # assigns permissions to the same broker identity the consumer will use.
  RABBITMQ_UPLOAD_INTAKE_USERNAME: clouddsp-upload-intake
  # Use the same local value as the clouddsp-app runtime Secret. This template
  # retains a placeholder to prevent a credential entering repository history.
  RABBITMQ_UPLOAD_INTAKE_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_UPLOAD_INTAKE_PASSWORD
