# This is a committed credential *template*, never a Secret to apply as-is.
# Copy it to the ignored path
# `k8Deployment/.local/rabbitmq-credentials.secret.yaml`, replace both
# placeholders with unique local values. The versioned
# `kubernetes/scripts/stages/credentials/rabbitmq-secret-stage.rb bootstrap` command validates
# and creates that one Secret on a fresh cluster. The repository ignores
# `.local/`, keeping live credentials out of Git history.
#
# Kubernetes Secrets avoid embedding broker credentials in an image or normal
# ConfigMap, but base64 storage is not encryption by itself.  Later RBAC and
# NetworkPolicy work will restrict which workloads can read this Secret and
# contact RabbitMQ.  Never print these values, commit the local copy, or use
# the administrator credentials in browser code or worker logs.
apiVersion: v1
kind: Secret
metadata:
  # The future RabbitMQ StatefulSet uses this stable name only while its empty
  # data directory is first initialized.  Future CloudDSP services receive
  # narrower application credentials instead of this broker administrator.
  name: clouddsp-rabbitmq-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
type: Opaque
# The API server converts populated `stringData` fields to encoded `data` when
# applying the ignored local file.  Encoding is not encryption, so the real
# values below must remain obvious placeholders in this versioned template.
stringData:
  # These are the exact initialization variable names accepted by RabbitMQ's
  # official image.  Do not use the reserved `guest` account for a remotely
  # reachable broker; our future ClusterIP Service remains internal regardless.
  RABBITMQ_DEFAULT_USER: REPLACE_WITH_A_UNIQUE_LOCAL_RABBITMQ_ADMIN_USER
  RABBITMQ_DEFAULT_PASS: REPLACE_WITH_A_UNIQUE_LOCAL_RABBITMQ_ADMIN_PASSWORD
