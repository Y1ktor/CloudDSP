# This committed file is a credential *template*, never a Secret to apply as-
# is. Copy it to
# `k8Deployment/.local/basic-pitch-rabbitmq-bootstrap-credentials.secret.yaml`,
# use the same username/password as the app-namespace runtime Secret, and apply
# only that ignored copy immediately before the administrator bootstrap Job.
# Kubernetes Secrets are namespace-scoped, so the data-namespace Job cannot
# read the future worker's app-namespace Secret directly.
apiVersion: v1
kind: Secret
metadata:
  # This is a temporary duplicate of the restricted consumer pair—not a second
  # RabbitMQ identity and never the broker administrator credential. Delete its
  # applied local instance after the bootstrap Job verifies permissions.
  name: clouddsp-basic-pitch-rabbitmq-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: rabbitmq-basic-pitch-consumer-bootstrap
    app.kubernetes.io/component: message-identity-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-basic-pitch-consumer-provisioning
type: Opaque
stringData:
  RABBITMQ_BASIC_PITCH_USERNAME: clouddsp-basic-pitch
  RABBITMQ_BASIC_PITCH_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_BASIC_PITCH_RABBITMQ_PASSWORD
