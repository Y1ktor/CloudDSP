# This is a committed credential *template*, never a Secret to apply as-is.
# Copy it to
# `k8Deployment/.local/demucs-rabbitmq-bootstrap-credentials.secret.yaml`,
# replace the password placeholder, and apply it only immediately before the
# Demucs RabbitMQ bootstrap Job. The repository ignores `.local/`, keeping live
# credentials out of Git history and command output.
#
# The bootstrap Job runs in `clouddsp-data` to read RabbitMQ's administrator
# Secret; the long-running worker will run in `clouddsp-app`. Namespace-scoped
# Secrets cannot cross that boundary, so this is a temporary duplicate of the
# app runtime identity—not a second RabbitMQ user. Delete it after the
# bootstrap passes.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-demucs-rabbitmq-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: rabbitmq-demucs-consumer-bootstrap
    app.kubernetes.io/component: message-identity-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-demucs-consumer-provisioning
type: Opaque
stringData:
  # Keep this name/value pair exactly aligned with the runtime Secret at
  # ../demucs/demucs-rabbitmq-credentials.secret.example.yaml. The Job uses it
  # to create or rotate the one `clouddsp-demucs` broker user.
  RABBITMQ_DEMUCS_USERNAME: clouddsp-demucs
  RABBITMQ_DEMUCS_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_DEMUCS_RABBITMQ_PASSWORD
