# This committed file is a credential *template*, never a Secret to apply as-
# is. Copy it to
# `k8Deployment/.local/adtof-rabbitmq-bootstrap-credentials.secret.yaml`, use
# the same username/password as the app-namespace runtime Secret, and apply the
# ignored copy only immediately before the administrator bootstrap Job.
#
# This is a temporary namespace-local duplicate of the restricted ADTOF worker
# identity. It is not a second RabbitMQ user and never contains the RabbitMQ
# administrator password. Delete the applied copy after the bootstrap Job has
# verified the user and vhost permission.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-adtof-rabbitmq-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: rabbitmq-adtof-consumer-bootstrap
    app.kubernetes.io/component: message-identity-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-adtof-consumer-provisioning
type: Opaque
stringData:
  # Keep this pair identical to the runtime Secret. The Job uses it only to
  # create or rotate the single restricted broker user `clouddsp-adtof`.
  RABBITMQ_ADTOF_USERNAME: clouddsp-adtof
  RABBITMQ_ADTOF_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_ADTOF_RABBITMQ_PASSWORD
