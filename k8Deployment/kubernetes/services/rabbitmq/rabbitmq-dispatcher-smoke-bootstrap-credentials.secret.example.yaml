# Copy this template to the ignored local path:
#
#   k8Deployment/.local/rabbitmq-dispatcher-smoke-bootstrap-credentials.secret.yaml
#
# Use exactly the same username/password as the app-namespace runtime Secret
# at ../dispatcher/dispatcher-smoke-rabbitmq-credentials.secret.example.yaml.
# Kubernetes Secrets cannot cross namespaces, so this duplicate exists only in
# clouddsp-data while the administrator bootstrap Job creates/rotates the
# restricted RabbitMQ user. Delete the applied temporary Secret after that Job
# passes; the later smoke Job reads only the app-namespace Secret.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-dispatcher-smoke-rabbitmq-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: dispatcher-smoke-rabbitmq-bootstrap
    app.kubernetes.io/component: temporary-message-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-restricted-demucs-queue-reader-provisioning
type: Opaque
stringData:
  RABBITMQ_DISPATCHER_SMOKE_USERNAME: clouddsp-dispatcher-smoke
  RABBITMQ_DISPATCHER_SMOKE_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_PASSWORD
