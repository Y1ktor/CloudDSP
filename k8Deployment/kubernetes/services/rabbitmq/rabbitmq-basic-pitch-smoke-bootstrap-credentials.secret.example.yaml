# Copy this template to the ignored local path:
#
#   k8Deployment/.local/rabbitmq-basic-pitch-smoke-bootstrap-credentials.secret.yaml
#
# Use exactly the same username/password as the app-namespace runtime Secret
# at ../../tests/generic-dispatcher-smoke/basic-pitch-smoke-rabbitmq-credentials.secret.example.yaml.
# Kubernetes Secrets cannot cross namespaces, so this duplicate exists only in
# clouddsp-data while the administrator Job creates or rotates the restricted
# RabbitMQ user. Delete the applied local Secret after that Job succeeds.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-basic-pitch-smoke-rabbitmq-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: basic-pitch-dispatcher-smoke-bootstrap
    app.kubernetes.io/component: temporary-message-identity-provisioning
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-restricted-basic-pitch-reader-provisioning
type: Opaque
stringData:
  RABBITMQ_BASIC_PITCH_SMOKE_USERNAME: clouddsp-basic-pitch-smoke
  RABBITMQ_BASIC_PITCH_SMOKE_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_TEST_PASSWORD
