# This committed file is a temporary credential *template*, never a live
# Secret. Copy it to
# `k8Deployment/.local/rabbitmq-keda-scaler-bootstrap-credentials.secret.yaml`,
# replace the password placeholder with the exact same value used in
# `keda-rabbitmq-scaler-credentials.secret.yaml`, and apply the ignored local
# copy only immediately before the bootstrap Job.
#
# The privileged bootstrap Job runs in clouddsp-data because RabbitMQ's
# administrator Secret is in that namespace. The future TriggerAuthentication
# is in clouddsp-app. Kubernetes Secrets are namespace-scoped, so these two
# temporary/runtime copies represent one RabbitMQ user, not two accounts.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-keda-rabbitmq-scaler-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: rabbitmq-keda-scaler-bootstrap
    app.kubernetes.io/component: message-identity-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-keda-rabbitmq-observer-provisioning
type: Opaque
stringData:
  # Keep this pair exactly aligned with the app-namespace runtime template.
  # The bootstrap Job uses it once to create/rotate the broker user, then this
  # data-namespace Secret should be explicitly deleted.
  RABBITMQ_KEDA_SCALER_USERNAME: clouddsp-keda-scaler
  RABBITMQ_KEDA_SCALER_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_KEDA_RABBITMQ_SCALER_PASSWORD
