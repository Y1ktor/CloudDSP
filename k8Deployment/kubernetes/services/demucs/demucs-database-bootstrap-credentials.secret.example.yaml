# This is a committed credential *template*, never a usable Secret. Copy it
# to `k8Deployment/.local/demucs-database-bootstrap-credentials.secret.yaml`,
# use the exact same three values as the Demucs runtime Secret, and apply the
# ignored local copy only while provisioning the PostgreSQL login.
#
# The one-shot bootstrap Job runs in `clouddsp-data`, beside PostgreSQL and its
# administrator Secret. Kubernetes does not let it read a Secret in
# `clouddsp-app`, so this short-lived duplicate makes the cross-namespace
# credential handoff explicit and auditable. Delete this data-namespace Secret
# after the bootstrap Job passes; retain the app-namespace runtime Secret for
# the future Demucs Deployment.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-demucs-database-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: demucs
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-demucs-postgresql-provisioning
type: Opaque
stringData:
  # Keep these values aligned with the app-namespace runtime Secret. The Job
  # proves it can connect as this role but never prints the password.
  DEMUCS_DB_NAME: clouddsp_job_api
  DEMUCS_DB_USERNAME: clouddsp-demucs
  DEMUCS_DB_PASSWORD: REPLACE_WITH_THE_SAME_LOCAL_DEMUCS_DATABASE_PASSWORD
