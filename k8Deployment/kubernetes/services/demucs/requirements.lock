# Hash-enforced Python dependency lock for the first local CPU Demucs image.
#
# The future Dockerfile must use this complete lock as follows:
#
#   pip install --require-hashes --no-deps --no-build-isolation \
#       --extra-index-url https://download.pytorch.org/whl/cpu \
#       --requirement requirements.lock
#
# Every runtime package is listed explicitly, including transitive packages.
# `--no-deps` therefore prevents pip from silently resolving a newer package;
# `--require-hashes` verifies that every downloaded source archive or wheel has
# exactly one of the reviewed SHA-256 values below. The future image build must
# install the pinned `setuptools` wheel first before it builds the three
# pure-Python source distributions with build isolation disabled.
#
# This lock targets CPython 3.12 on the current Linux/ARM64 k3d profile. Native
# package hashes intentionally describe those exact ARM64 wheels. A future
# Linux/AMD64 CPU or NVIDIA/CUDA image must add its separately reviewed native
# wheel hashes; it must not remove hash enforcement or reuse this ARM64 image.
#
# Torch/TorchAudio are obtained from PyTorch's official CPU wheel index. The
# ARM64 variants use the normal 2.4.0 version string, not an x86-only `+cpu`
# local-version suffix. They preserve the cloud worker's PyTorch 2.4.0 baseline
# without pulling an unusable CUDA runtime into the Mac/k3d image.

# Private MinIO S3 client closure. Explicit Botocore pinning prevents Boto3's
# compatible-version range from silently selecting a later Botocore release.
