# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/demucs-minio-credentials.secret.yaml`, replace the
# secret placeholder, and apply only that ignored local copy when the Demucs
# Deployment is introduced. The repository ignores `.local/`, so a real MinIO
# secret key cannot enter Git history.
#
# This Secret belongs to `clouddsp-app`, the namespace where the future worker
# runs. It has the worker's narrow S3 identity only; it must never contain the
# powerful `clouddsp-minio-root-credentials` Secret from `clouddsp-data`.
apiVersion: v1
kind: Secret
metadata:
  # The later Demucs Deployment refers to this stable Secret name. Endpoint,
  # bucket, region, and key-prefix constants are reviewed non-secret settings.
  name: clouddsp-demucs-minio-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: demucs
    app.kubernetes.io/component: audio-separation-worker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: private-demucs-source-and-stem-access
type: Opaque
stringData:
  # This is an S3 access key for MinIO—not a PostgreSQL role, RabbitMQ user,
  # Kubernetes ServiceAccount, or Keycloak account. It names the dedicated
  # MinIO identity attached to the reviewed policy beside this Secret.
  DEMUCS_S3_ACCESS_KEY: clouddsp-demucs
  # MinIO requires a secret key of at least eight characters. The value must
  # exactly match the temporary bootstrap Secret but must not be committed.
  DEMUCS_S3_SECRET_KEY: REPLACE_WITH_A_UNIQUE_LOCAL_DEMUCS_MINIO_SECRET_KEY
