# This is a committed credential *template*, never a usable Secret. Copy it
# to `k8Deployment/.local/demucs-database-credentials.secret.yaml`, replace
# only the password placeholder, and apply that ignored local copy when the
# Demucs Deployment is introduced. `k8Deployment/.local/` is ignored so the
# real PostgreSQL password cannot enter Git history.
#
# This runtime Secret belongs to `clouddsp-app`, which is where the long-lived
# Demucs worker will run. Secrets are namespace scoped: the worker cannot read
# PostgreSQL's administrator Secret in `clouddsp-data`, and it should not be
# able to do so even if it could.
apiVersion: v1
kind: Secret
metadata:
  # The future Deployment refers to this stable name. It contains only the
  # component-specific login—never PostgreSQL's clouddsp-admin credentials.
  name: clouddsp-demucs-database-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: demucs
    app.kubernetes.io/component: audio-separation-worker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: private-durable-demucs-task-processing
type: Opaque
# `stringData` makes an ignored local manifest readable while applying it.
# Kubernetes persists the same value in base64-encoded `data`; base64 is only
# encoding, not encryption, which is why this committed template is harmless.
stringData:
  # Demucs participates in the authoritative Job API database. A separate
  # database would split the job/task transaction and weaken duplicate safety.
  DEMUCS_DB_NAME: clouddsp_job_api
  # This role is deliberately independent from same-named RabbitMQ and MinIO
  # identities. One leaked credential should not grant access to another
  # system, even on a local learning cluster.
  DEMUCS_DB_USERNAME: clouddsp-demucs
  DEMUCS_DB_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_DEMUCS_DATABASE_PASSWORD
