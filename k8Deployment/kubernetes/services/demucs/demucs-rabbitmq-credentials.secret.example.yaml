# This is a committed credential *template*, never a Secret to apply as-is.
# Copy it to `k8Deployment/.local/demucs-rabbitmq-credentials.secret.yaml`,
# replace the password placeholder, and apply only that ignored local copy when
# the Demucs Deployment is introduced. `k8Deployment/.local/` is ignored, so a
# real RabbitMQ password cannot enter Git history.
#
# The future Demucs worker runs in `clouddsp-app`, so its runtime Secret belongs
# in the same namespace. A separate temporary copy is needed only by the
# administrator bootstrap Job in `clouddsp-data`; Kubernetes does not permit a
# Pod to mount a Secret from another namespace. That companion template lives
# beside the RabbitMQ bootstrap Job and must use the same username/password.
apiVersion: v1
kind: Secret
metadata:
  # The future worker Deployment uses this stable Secret name. It holds the
  # restricted AMQP login, never RabbitMQ's default administrator account.
  name: clouddsp-demucs-rabbitmq-credentials
  namespace: clouddsp-app
  labels:
    app.kubernetes.io/name: demucs
    app.kubernetes.io/component: audio-separation-worker
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: consume-private-demucs-requests
type: Opaque
# The worker's Python AMQP adapter receives raw username/password values and
# assembles its connection settings at runtime. The private Service DNS, vhost,
# queue, exchange, routing key, retry timing, and prefetch are non-secret,
# reviewed Deployment configuration—not Secret data.
stringData:
  # The matching RabbitMQ user has no tags, no configure authority, no write
  # authority, and read/consume/ack authority only on this exact request queue.
  # It cannot publish retries in version 1 because PostgreSQL owns retries.
  RABBITMQ_DEMUCS_USERNAME: clouddsp-demucs
  RABBITMQ_DEMUCS_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_DEMUCS_RABBITMQ_PASSWORD
