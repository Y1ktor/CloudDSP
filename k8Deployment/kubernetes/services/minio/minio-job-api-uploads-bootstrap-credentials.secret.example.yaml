# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/job-api-minio-bootstrap-credentials.secret.yaml`,
# replace the secret placeholder, and apply only that ignored local copy while
# provisioning the MinIO user.
#
# The bootstrap Job lives in `clouddsp-data` so it can read MinIO's root
# administrator Secret without giving that powerful credential to
# `clouddsp-app`. Kubernetes Secrets cannot be read across namespaces, so this
# is a short-lived duplicate of the *restricted* API credentials. Its values
# must exactly match the runtime Secret template in
# `../api/job-api-minio-credentials.secret.example.yaml`.
#
# Delete the populated bootstrap Secret after a successful bootstrap Job. The
# ongoing Job API needs only the same non-administrator credentials in its own
# namespace; it must never receive `clouddsp-minio-root-credentials`.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-job-api-minio-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: job-api
    app.kubernetes.io/component: object-storage-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-job-api-minio-provisioning
type: Opaque
# `stringData` is convenient for a locally ignored source file. Kubernetes
# encodes it to Secret `data` during apply, but base64 is not encryption—never
# commit the populated local copy or echo it in a terminal command.
stringData:
  # This is an S3 access key, not a Kubernetes ServiceAccount or a Keycloak
  # user. It names the single restricted MinIO identity used by the Job API.
  JOB_API_S3_ACCESS_KEY: clouddsp-job-api
  # MinIO requires a secret key of at least eight characters. Use a unique,
  # long local value; it must match the API runtime Secret exactly.
  JOB_API_S3_SECRET_KEY: REPLACE_WITH_A_UNIQUE_LOCAL_JOB_API_MINIO_SECRET_KEY
