# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/demucs-minio-bootstrap-credentials.secret.yaml`,
# replace the placeholder with the same secret key as the app-namespace Demucs
# runtime Secret, and apply the ignored local copy only during provisioning.
#
# The bootstrap Job runs in `clouddsp-data` to use MinIO's root administrator
# Secret. Kubernetes forbids a Pod from reading the runtime Secret in
# `clouddsp-app`, so this is a short-lived duplicate of the *restricted* worker
# key pair—not a separate identity. Delete it after the Job succeeds.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-demucs-minio-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: minio-demucs-artifacts-bootstrap
    app.kubernetes.io/component: object-storage-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-demucs-minio-provisioning
type: Opaque
stringData:
  # Keep this pair exactly aligned with
  # ../demucs/demucs-minio-credentials.secret.example.yaml. The Job creates or
  # rotates the same access key that the later worker will mount at runtime.
  DEMUCS_S3_ACCESS_KEY: clouddsp-demucs
  DEMUCS_S3_SECRET_KEY: REPLACE_WITH_THE_SAME_LOCAL_DEMUCS_MINIO_SECRET_KEY
