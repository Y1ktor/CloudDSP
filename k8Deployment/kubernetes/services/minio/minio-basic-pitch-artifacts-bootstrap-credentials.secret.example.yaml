# This committed file is a credential *template*, never a usable Secret. Copy
# it to `k8Deployment/.local/basic-pitch-minio-bootstrap-credentials.secret.yaml`
# and use the same two values as the app-namespace runtime Secret. The future
# administrator bootstrap Job runs in `clouddsp-data`, and Kubernetes does not
# allow it to read an app-namespace Secret directly.
apiVersion: v1
kind: Secret
metadata:
  # This is a short-lived duplicate of the restricted worker credential, not a
  # second identity and not the MinIO root credential. Delete its local applied
  # instance after the bootstrap Job has created/rotated the MinIO user.
  name: clouddsp-basic-pitch-minio-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: minio-basic-pitch-artifacts-bootstrap
    app.kubernetes.io/component: object-storage-bootstrap
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: temporary-basic-pitch-minio-provisioning
type: Opaque
stringData:
  BASIC_PITCH_S3_ACCESS_KEY: clouddsp-basic-pitch
  BASIC_PITCH_S3_SECRET_KEY: REPLACE_WITH_THE_SAME_LOCAL_BASIC_PITCH_MINIO_SECRET_KEY
