# This committed template is never a populated Secret. Copy it to the ignored
# `k8Deployment/.local/upload-intake-minio-bootstrap-credentials.secret.yaml`
# and replace the secret-key placeholder with the same restricted value used
# by the upload-intake runtime Secret in `clouddsp-app`.
#
# The one-shot IAM Job runs in `clouddsp-data` alongside the MinIO root Secret.
# Kubernetes cannot mount the runtime Secret across namespaces, so the IAM
# stage will create this temporary duplicate and remove it after provisioning.
# This Secret contains only the restricted upload-intake key, never the root
# administrator credential.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-upload-intake-minio-bootstrap-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: upload-intake
    app.kubernetes.io/component: source-event-consumer
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: upload-intake-private-source-head-object
type: Opaque
# Kubernetes converts ignored local `stringData` to base64-encoded `data`.
# Base64 is not encryption; do not commit a populated copy.
stringData:
  UPLOAD_INTAKE_S3_ACCESS_KEY: clouddsp-upload-intake
  UPLOAD_INTAKE_S3_SECRET_KEY: REPLACE_WITH_A_UNIQUE_LOCAL_UPLOAD_INTAKE_MINIO_SECRET_KEY
