# This committed file is a credential *template*, never a file to apply as-is.
# Copy it to the ignored path
# `k8Deployment/.local/minio-root-credentials.secret.yaml`, replace both
# placeholders with unique local values, and apply only that local copy during
# the later MinIO deployment task.  The repository ignores `.local/` so live
# credentials cannot be committed accidentally.
#
# A Kubernetes Secret keeps sensitive values out of container images and normal
# configuration files, but it is not a security boundary or encryption on its
# own.  Later RBAC and NetworkPolicy tasks restrict who can read this Secret and
# reach MinIO.  Never print, commit, or use these root credentials in browser
# code, worker logs, or a presigned URL.
apiVersion: v1
kind: Secret
metadata:
  # This stable name is the contract used later by the MinIO StatefulSet and a
  # one-time bootstrap process.  Application services will receive narrower
  # bucket-specific credentials rather than this root administrator account.
  name: clouddsp-minio-root-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
type: Opaque
# The API server converts `stringData` to base64-encoded Secret `data` when a
# populated local copy is applied.  Base64 is encoding, not encryption, so the
# real file must remain ignored and must not be viewed in shared terminal logs.
stringData:
  # These are the environment variable names MinIO reads to initialize its root
  # administrative account.  Replace both obvious placeholders only in the
  # ignored local copy; do not turn this versioned example into a real account.
  MINIO_ROOT_USER: REPLACE_WITH_A_UNIQUE_LOCAL_ROOT_USER
  MINIO_ROOT_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_ROOT_PASSWORD
