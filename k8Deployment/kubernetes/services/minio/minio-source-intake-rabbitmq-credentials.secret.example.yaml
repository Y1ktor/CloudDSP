# This is a committed credential *template*, never a Secret to apply as-is.
# Copy it to the ignored local path
# `k8Deployment/.local/minio-source-intake-rabbitmq-credentials.secret.yaml`,
# replace every password placeholder, then let the guarded
# `scripts/stages/credentials/minio-amqp-secret-stage.rb bootstrap` create that local copy on a
# fresh cluster before the MinIO StatefulSet or RabbitMQ user bootstrap. The
# repository ignores `k8Deployment/.local/`, so live AMQP credentials never
# enter Git history.
#
# This Secret is namespaced to `clouddsp-data` because the future MinIO
# StatefulSet and the temporary RabbitMQ-topology bootstrap Job both run there.
# Kubernetes does not permit a Pod to mount a Secret from another namespace.
apiVersion: v1
kind: Secret
metadata:
  name: clouddsp-minio-source-intake-rabbitmq-credentials
  namespace: clouddsp-data
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage-notification-publisher
    app.kubernetes.io/part-of: clouddsp
    app.kubernetes.io/managed-by: kubectl
    clouddsp.io/environment: local
    clouddsp.io/purpose: publish-source-created-events-to-rabbitmq
type: Opaque
# `stringData` is convenient for an ignored local copy: Kubernetes encodes it
# into Secret `data` during apply. Base64 is representation, not encryption;
# never treat the committed placeholders or a local Secret manifest as safe to
# paste into a terminal/log/chat transcript.
stringData:
  # MinIO's native AMQP client first performs an idempotent declaration of the
  # source exchange before it publishes an event. The bootstrap therefore
  # grants this account configure and write access to exactly the source
  # exchange in the /clouddsp virtual host. It still cannot read a queue,
  # configure bindings or any other resource, administer RabbitMQ, or publish
  # Demucs work.
  RABBITMQ_MINIO_EVENTS_USERNAME: clouddsp-minio-events
  RABBITMQ_MINIO_EVENTS_PASSWORD: REPLACE_WITH_A_UNIQUE_LOCAL_MINIO_EVENTS_PASSWORD

  # MinIO's native AMQP configuration consumes one URI, rather than separate
  # username/password variables. Keep its password value synchronized with the
  # field above, but percent-encode it here for URI syntax. In particular,
  # encode any literal `@`, `:`, `/`, `?`, `#`, `[`, `]`, or `%` in the password.
  # `%2Fclouddsp` is the URI-encoded RabbitMQ virtual-host name `/clouddsp`,
  # not a filesystem path. The future StatefulSet reads this exact value through
  # `secretKeyRef`; it never places an AMQP password in a ConfigMap or image.
  MINIO_NOTIFY_AMQP_URL_INTAKE: amqp://clouddsp-minio-events:REPLACE_WITH_THE_SAME_URL_ENCODED_PASSWORD@clouddsp-rabbitmq.clouddsp-data.svc:5672/%2Fclouddsp
