    builtFrom:
      # The committed worker source includes the restricted database/MinIO/AMQP
      # lifecycle, modular task leases, recovery-first supervisor, scoped
      # SIGTERM/SIGINT behavior, and PID-1 wrapper. The image does not include
      # cloud code, a Kubernetes client, workload manifests, or runtime Secrets.
      sourceRevision: 2334921785826d0fa0a644b055e95c34d4048d04
      sourceDirectory: kubernetes/services/demucs/app
      dockerfile: kubernetes/services/demucs/Dockerfile
      requirementsLock: kubernetes/services/demucs/requirements.lock
      modelArtifactsLock: kubernetes/services/demucs/model-artifacts.lock.yaml
      unitTestDirectory: kubernetes/services/demucs/tests
      runtimeImageLock: images.api-python-runtime
      sourceLock: buildSources.demucs
      workerEntrypoint:
        - python
        - -m
        - app.worker_main
      # The validation stage exercised the complete current worker source,
      # including the Dockerfile structural checks, before this digest was
      # pushed. These compact facts make the catalog evidence inspectable
      # without pretending that a Kubernetes workload was run.
      # A normal RabbitMQ turn opens a private prefetch-one session and closes
      # it before the next recovery/idle turn. A stale channel cannot make a
      # living Pod appear ready while no longer able to poll for work.
      amqpSessionPolicy: one-session-per-normal-poll
      # Unlike an import check, this fixed two-stem run proves the exact
      # local-ARM64 backend setting allows a real model forward pass.
      localArm64CpuInferenceCheck: two-stem-hybrid-model
      validatedWorkerTestCount: 321
      verifiedFFprobe: true
      runtimeImportCheck: true
      verifiedModelArtifactCount: 4
    # Docker reports uncompressed layer bytes. The larger size compared with
    # other workers is expected: it includes CPU Torch, FFmpeg, and 132.7 MiB
    # of separately checksum-verified Demucs descriptors/weight files.
    localDockerSizeBytes: 503435169
    localDockerSize: "480.11 MiB"
    pushedAt: "2026-10-03"

