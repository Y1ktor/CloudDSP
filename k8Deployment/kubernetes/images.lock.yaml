# This file is an image-lock catalog for CloudDSP's Kubernetes manifests.  It
# is deliberately *not* a Kubernetes resource, so do not run `kubectl apply`
# on it.  Workload manifests will copy an `immutableReference` from here into
# their `image:` field.
#
# A tag such as `postgres:17-bookworm` is convenient for people but mutable: an
# upstream publisher can point it at a newer patch release later.  A sha256
# digest identifies exactly one published OCI object.  Pinning it makes a
# rebuild or a new local cluster pull the reviewed image rather than whatever
# the tag happens to mean at that later time.
#
# The `buildSources` section serves the same reproducibility purpose for an
# image CloudDSP builds itself.  It locks the exact upstream source revision
# first.  Only after the local image is built and pushed can its output digest
# be added under `images`; do not deploy a locally built image by mutable tag.
lockFormatVersion: 1
images:
  api-python-runtime:
    # Cloud Job API Lambda code runs on Python 3.12. The local container keeps
    # that language version so replacing AWS integrations is an explicit code
    # change rather than an accidental simultaneous interpreter migration.
    # This official multi-platform image index is the sole API base image.
    repository: docker.io/library/python
    sourceTag: "3.12.14-slim-bookworm"
    resolvedVersion: "3.12.14"
    digest: sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    immutableReference: docker.io/library/python@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://hub.docker.com/_/python
    resolvedAt: "2026-09-04"

  basic-pitch-python-runtime:
    # Basic Pitch 0.4.0 selects TensorFlow 2.15 for Linux inference. That
    # TensorFlow release supports Python 3.11, not this repository's existing
    # Python 3.12 API/dispatcher runtime. Keeping a dedicated immutable base
    # makes the compatibility boundary visible rather than silently downgrading
    # another service or attempting an unsupported Python 3.12 build.
    repository: docker.io/library/python
    sourceTag: "3.11.16-slim-bookworm"
    resolvedVersion: "3.11.16"
    digest: sha256:528257d48c1da0dcecc2e725d1ae34498d60c965f1241e39cd6a85a8859bdf84
