    baseImageLock: images.api-python-runtime
    sourceDirectory: kubernetes/tests/dispatcher-smoke/client
    dockerfile: kubernetes/tests/dispatcher-smoke/client/Dockerfile
    requirementsLock: kubernetes/tests/dispatcher-smoke/client/requirements.lock
    intendedRepository: clouddsp-registry.localhost:5001/dispatcher-smoke-client
    publishedImageLock: images.dispatcher-smoke-client
    targetPlatform: linux/arm64
    directPythonPackages:
      - name: boto3
        version: "1.43.89"
        # Used only to remove the exact test object through private MinIO.
        upstream: https://pypi.org/project/boto3/1.43.89/
      - name: psycopg
        version: "3.2.13"
        installationExtra: binary
        binaryPackage: psycopg-binary
        # Reads the test outbox event and deletes only its owned job row.
        upstream: https://www.psycopg.org/psycopg3/docs/basic/install.html
      - name: pika
        version: "1.4.4"
