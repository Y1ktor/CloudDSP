# This file is an image-lock catalog for CloudDSP's Kubernetes manifests.  It
# is deliberately *not* a Kubernetes resource, so do not run `kubectl apply`
# on it.  Workload manifests will copy an `immutableReference` from here into
# their `image:` field.
#
# A tag such as `postgres:17-bookworm` is convenient for people but mutable: an
# upstream publisher can point it at a newer patch release later.  A sha256
# digest identifies exactly one published OCI object.  Pinning it makes a
# rebuild or a new local cluster pull the reviewed image rather than whatever
# the tag happens to mean at that later time.
#
# The `buildSources` section serves the same reproducibility purpose for an
# image CloudDSP builds itself.  It locks the exact upstream source revision
# first.  Only after the local image is built and pushed can its output digest
# be added under `images`; do not deploy a locally built image by mutable tag.
lockFormatVersion: 1
images:
  frontend:
    # This is the first locally built browser image. The readable tag records
    # the local feature milestone, but a future Deployment must use only the
    # immutable registry digest so an accidental retag cannot alter a Pod.
    repository: clouddsp-registry.localhost:5001/frontend
    sourceTag: "0.1.0-local-oidc"
    digest: sha256:00255544e4517dcb44c8136fe386c93e1c4be0fba0039dc5ba16d6cfa66427bf
    immutableReference: clouddsp-registry.localhost:5001/frontend@sha256:00255544e4517dcb44c8136fe386c93e1c4be0fba0039dc5ba16d6cfa66427bf
    supportedPlatforms:
      - linux/arm64/v8
    builtFrom:
      # The application baseline began at this recorded cloud revision, then
      # gained local-only OIDC/CSP changes in the current Kubernetes worktree.
      # It is intentionally called out as a working-tree build until this task
      # is committed; the output digest above still identifies its exact bytes.
      sourceBaselineCommit: 6393ae3eb4153b883baf993e7c1d887252f8de1f
      sourceRevision: local-kubernetes-working-tree
      sourceDirectory: kubernetes/services/frontend/app
      dockerfile: kubernetes/services/frontend/Dockerfile
      builderImageLock: images.frontend-node-builder
      runtimeImageLock: images.frontend-nginx-runtime
      publicConfigurationFile: kubernetes/services/frontend/app/.env.production
    localDockerSizeBytes: 33624066
    localDockerSize: "32.07 MiB"
    pushedAt: "2026-09-04"

  frontend-node-builder:
    # Official Node image used only while compiling the local React source.
    # This multi-platform OCI index selects arm64 for the current Mac/k3d
    # cluster and amd64 for a future native Linux profile; the final image does
    # not retain Node, npm, source, or node_modules.
    repository: docker.io/library/node
    sourceTag: "24-bookworm-slim"
    resolvedVersion: "24.20.0"
    digest: sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
    immutableReference: docker.io/library/node@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://hub.docker.com/_/node
    resolvedAt: "2026-09-04"

  frontend-nginx-runtime:
    # Official NGINX Alpine runtime for the local static site. It contains
    # only NGINX and the generated Vite assets copied by the multi-stage build,
    # not the frontend source tree or its Node build dependencies.
    repository: docker.io/library/nginx
    sourceTag: "1.28-alpine"
    resolvedVersion: "1.28-alpine"
    digest: sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    immutableReference: docker.io/library/nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://hub.docker.com/_/nginx
    resolvedAt: "2026-09-04"

  aws-cli:
    # AWS publishes this official AWS CLI v2 image in Amazon ECR Public.  The
    # later S3 smoke Job uses its `aws s3api` commands with a custom endpoint
    # URL to exercise MinIO's S3-compatible API; it is a disposable client,
    # not a CloudDSP application or a second object-storage server.
    #
    # AWS recommends a specific version rather than the mutable `latest` tag.
    # Pinning the manifest-list digest below additionally fixes the exact
    # published image while still allowing Kubernetes to select arm64 locally
    # or amd64 on a future native Linux profile.
    repository: public.ecr.aws/aws-cli/aws-cli
    sourceTag: "2.36.31"
    resolvedVersion: "2.36.31"
    digest: sha256:f0dcd994da5c36ab09becf4259bba4c45ed4ecfd03d51c701912f4d8425b2d49
    immutableReference: public.ecr.aws/aws-cli/aws-cli@sha256:f0dcd994da5c36ab09becf4259bba4c45ed4ecfd03d51c701912f4d8425b2d49
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://docs.aws.amazon.com/cli/latest/userguide/getting-started-docker.html
    resolvedAt: "2026-09-02"

  keycloak:
    # Keycloak publishes its own official server image in its Quay
    # organization.  It will provide CloudDSP's local OIDC identity service;
    # it is not the React frontend, an API gateway, or PostgreSQL itself.
    repository: quay.io/keycloak/keycloak

    # Keep the reviewed release tag so people can identify the selected
    # Keycloak version.  Tags remain mutable registry pointers, therefore a
    # future Deployment must copy only the immutableReference below.
    sourceTag: "26.7.3"
    resolvedVersion: "26.7.3"
    digest: sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    immutableReference: quay.io/keycloak/keycloak@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54

    # This OCI image index has a native arm64 child for today’s Apple Silicon
    # k3d cluster and an amd64 child for the planned native Linux/GPU profile.
    # Kubernetes selects the compatible child only after a Pod is scheduled;
    # this compatibility record does not itself force node placement.
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://www.keycloak.org/downloads
    containerDocumentation: https://www.keycloak.org/server/containers
    resolvedAt: "2026-09-02"

  mailpit:
    # Mailpit publishes this official image for local SMTP capture and a web
    # inbox.  It will receive Keycloak verification/reset email only inside the
    # local cluster; it is not a real mail relay and must never be presented as
    # a production mailbox or external email-delivery service.
    repository: docker.io/axllent/mailpit

    # Retain the reviewed stable release tag for auditability.  The Deployment
    # must use immutableReference rather than this mutable tag, so a later
    # upstream retag cannot silently change the test-mail server Kubernetes runs.
    sourceTag: "v1.30.6"
    resolvedVersion: "1.30.6"
    digest: sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    immutableReference: docker.io/axllent/mailpit@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d

    # This OCI image index selects a matching native child image for both the
    # current Apple Silicon k3d profile and the future x86_64 Linux/GPU profile.
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://mailpit.axllent.org/docs/install/docker/
    resolvedAt: "2026-09-03"

  minio-go-builder:
    # Build-only base for the self-built MinIO community binary.  The locked
    # source release declares Go 1.24.8 in its go.mod toolchain directive.
    # This multi-architecture index supports both the current arm64 profile and
    # a later amd64 Linux build profile.
    repository: docker.io/library/golang
    sourceTag: "1.24.8-bookworm"
    digest: sha256:4ed690d6649d63c312b99a6120025ec79ce3b542968a37da53d6236c7c61a848
    immutableReference: docker.io/library/golang@sha256:4ed690d6649d63c312b99a6120025ec79ce3b542968a37da53d6236c7c61a848
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://hub.docker.com/_/golang
    resolvedAt: "2026-09-02"

  minio-runtime:
    # The final image contains only MinIO's statically linked binary on a small
    # non-root distroless base.  It has no package manager or shell, reducing
    # runtime attack surface; diagnostics use a separate temporary client Pod.
    repository: gcr.io/distroless/static-debian12
    sourceTag: nonroot
    digest: sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    immutableReference: gcr.io/distroless/static-debian12@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://github.com/GoogleContainerTools/distroless
    resolvedAt: "2026-09-02"

  minio:
    # This is the locally built, registry-published result of buildSources.minio
    # below.  The tag is retained only as an audit-friendly build label; every
    # MinIO workload must use immutableReference so a retag cannot change what
    # Kubernetes runs.
    repository: clouddsp-registry.localhost:5001/minio
    sourceTag: "release-2025-10-15"
    sourceVersion: "RELEASE.2025-10-15T17-29-55Z"
    sourceCommit: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    digest: sha256:96dd150e3e8c93ebc407344078829c43240df19c74db58de17dd777d7d28ab5e
    immutableReference: clouddsp-registry.localhost:5001/minio@sha256:96dd150e3e8c93ebc407344078829c43240df19c74db58de17dd777d7d28ab5e
    supportedPlatforms:
      - linux/arm64/v8

    # Provenance names the exact source and both immutable bases used by the
    # Dockerfile.  Rebuild only after intentionally reviewing and updating all
    # three inputs, then record the new registry digest instead of overwriting
    # this existing historical image reference.
    builtFrom:
      sourceLock: buildSources.minio
      builderImageLock: images.minio-go-builder
      runtimeImageLock: images.minio-runtime
      dockerfile: kubernetes/services/minio/Dockerfile
    pushedAt: "2026-09-02"

  postgresql:
    # Docker Official Images are hosted in Docker Hub's `library` namespace.
    # Writing the registry and namespace explicitly avoids relying on Docker's
    # shorthand rules when this reference is used by Kubernetes.
    repository: docker.io/library/postgres

    # This is the human-readable upstream tag inspected on 2026-09-01.  It is
    # retained for auditability only; workloads must use `immutableReference`.
    sourceTag: "17-bookworm"
    resolvedVersion: "17.11-bookworm"

    # This is the digest of the multi-architecture OCI image index currently
    # published for the source tag.  The index lets Kubernetes select its
    # matching child image automatically: linux/arm64 for the current Apple
    # Silicon k3d nodes and linux/amd64 for the future native Linux GPU profile.
    # It must be changed only after deliberately reviewing a new upstream image.
    digest: sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    immutableReference: docker.io/library/postgres@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0

    # These platforms were present in the resolved image index.  They are a
    # compatibility record, not scheduling rules: Kubernetes still schedules
    # Pods using the actual node architecture and pulls the matching child
    # manifest from this pinned index.
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64

    # Keep enough provenance to repeat the review later without placing any
    # mutable image data or credentials in this repository.
    upstream: https://hub.docker.com/_/postgres
    resolvedAt: "2026-09-01"

  rabbitmq-amqp-client-python:
    # This official Python runtime is the base for the small local AMQP
    # smoke-client image.  It is distinct from CloudDSP's future worker
    # images: its only purpose is to prove that a Pod can use the AMQP 0-9-1
    # protocol through the RabbitMQ ClusterIP Service.
    repository: docker.io/library/python
    sourceTag: "3.13.15-slim-bookworm"
    resolvedVersion: "3.13.15"
    digest: sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e
    immutableReference: docker.io/library/python@sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://hub.docker.com/_/python
    resolvedAt: "2026-09-02"

  rabbitmq-amqp-smoke-client:
    # This is the locally built and registry-published output of
    # buildSources.rabbitmq-amqp-smoke-client below.  The descriptive tag is
    # retained for traceability, but its immutableReference is the only value
    # a Kubernetes workload may use.  It resolves to an arm64 child image for
    # the current Apple Silicon k3d nodes.
    repository: clouddsp-registry.localhost:5001/rabbitmq-amqp-smoke-client
    sourceTag: "1.0.0-pika-1.4.4"
    digest: sha256:4f4564fca1c8080688396e9b7f1457def92e720c1826083189eccff38629c4d2
    immutableReference: clouddsp-registry.localhost:5001/rabbitmq-amqp-smoke-client@sha256:4f4564fca1c8080688396e9b7f1457def92e720c1826083189eccff38629c4d2
    supportedPlatforms:
      - linux/arm64/v8
    builtFrom:
      sourceLock: buildSources.rabbitmq-amqp-smoke-client
      baseImageLock: images.rabbitmq-amqp-client-python
      dockerfile: kubernetes/services/rabbitmq/amqp-smoke-client/Dockerfile
    pushedAt: "2026-09-02"

  rabbitmq:
    # RabbitMQ's Docker Official Image provides the AMQP broker used for
    # durable, at-least-once worker handoff.  The `management` variant also
    # includes RabbitMQ's administrator UI and `rabbitmqadmin` client tool for
    # local learning and later smoke tests.  Those interfaces will remain
    # cluster-internal or use a temporary port-forward; this image lock does
    # not by itself expose any RabbitMQ port to the Mac or browser.
    repository: docker.io/library/rabbitmq

    # RabbitMQ publishes a mutable `management` convenience tag.  Retain this
    # exact reviewed release tag for people, but all future workloads must use
    # the immutable manifest-list reference below so a later retag cannot
    # silently update a running broker.
    sourceTag: "4.3.5-management"
    resolvedVersion: "4.3.5"
    digest: sha256:b1188ba346ab5748add82f46ac58c7df993ee91d762915f8ac6fcadf2e6c07df
    immutableReference: docker.io/library/rabbitmq@sha256:b1188ba346ab5748add82f46ac58c7df993ee91d762915f8ac6fcadf2e6c07df

    # This OCI image index contains the matching child images for the current
    # Apple Silicon k3d nodes and a future native Linux x86_64/GPU profile.
    # These are compatibility facts, not Kubernetes scheduling constraints.
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://hub.docker.com/_/rabbitmq
    resolvedAt: "2026-09-02"

buildSources:
  rabbitmq-amqp-smoke-client:
    # This source lock makes the test image reproducible without installing
    # packages from PyPI when the Kubernetes Job starts.  Pika is a pure-Python
    # AMQP 0-9-1 client, so its universal wheel works on both intended Linux
    # architectures and needs no compiler or native extension dependencies.
    baseImageLock: images.rabbitmq-amqp-client-python
    pythonPackage:
      name: pika
      version: "1.4.4"
      wheelSha256: 48de960c97a93b55db06b8be4c53eb977c9c8a2754c57cdae9097abcbd70ce04
      upstream: https://pypi.org/project/pika/1.4.4/
    sourceDirectory: kubernetes/services/rabbitmq/amqp-smoke-client
    dockerfile: kubernetes/services/rabbitmq/amqp-smoke-client/Dockerfile
    intendedRepository: clouddsp-registry.localhost:5001/rabbitmq-amqp-smoke-client
    targetPlatform: linux/arm64
    resolvedAt: "2026-09-02"

  minio:
    # The MinIO community edition is source-distributed.  This is the final
    # upstream security/CVE release selected for the private local-learning
    # profile.  It is a source lock, not yet a deployable image lock.
    sourceRepository: https://github.com/minio/minio.git
    sourceTag: "RELEASE.2025-10-15T17-29-55Z"
    sourceCommit: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a

    # The first arm64 build is now recorded at images.minio above.  A future
    # rebuild must use this same source commit unless an intentional source-lock
    # update is reviewed, and it must record a new immutable registry digest.
    intendedRepository: clouddsp-registry.localhost:5001/minio
    targetPlatform: linux/arm64
    upstream: https://github.com/minio/minio/releases/tag/RELEASE.2025-10-15T17-29-55Z
    resolvedAt: "2026-09-02"
