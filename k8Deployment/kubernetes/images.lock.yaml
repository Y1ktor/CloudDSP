# This file is an image-lock catalog for CloudDSP's Kubernetes manifests.  It
# is deliberately *not* a Kubernetes resource, so do not run `kubectl apply`
# on it.  Workload manifests will copy an `immutableReference` from here into
# their `image:` field.
#
# A tag such as `postgres:17-bookworm` is convenient for people but mutable: an
# upstream publisher can point it at a newer patch release later.  A sha256
# digest identifies exactly one published OCI object.  Pinning it makes a
# rebuild or a new local cluster pull the reviewed image rather than whatever
# the tag happens to mean at that later time.
#
# The `buildSources` section serves the same reproducibility purpose for an
# image CloudDSP builds itself.  It locks the exact upstream source revision
# first.  Only after the local image is built and pushed can its output digest
# be added under `images`; do not deploy a locally built image by mutable tag.
lockFormatVersion: 1
images:
  aws-cli:
    # AWS publishes this official AWS CLI v2 image in Amazon ECR Public.  The
    # later S3 smoke Job uses its `aws s3api` commands with a custom endpoint
    # URL to exercise MinIO's S3-compatible API; it is a disposable client,
    # not a CloudDSP application or a second object-storage server.
    #
    # AWS recommends a specific version rather than the mutable `latest` tag.
    # Pinning the manifest-list digest below additionally fixes the exact
    # published image while still allowing Kubernetes to select arm64 locally
    # or amd64 on a future native Linux profile.
    repository: public.ecr.aws/aws-cli/aws-cli
    sourceTag: "2.36.31"
    resolvedVersion: "2.36.31"
    digest: sha256:f0dcd994da5c36ab09becf4259bba4c45ed4ecfd03d51c701912f4d8425b2d49
    immutableReference: public.ecr.aws/aws-cli/aws-cli@sha256:f0dcd994da5c36ab09becf4259bba4c45ed4ecfd03d51c701912f4d8425b2d49
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://docs.aws.amazon.com/cli/latest/userguide/getting-started-docker.html
    resolvedAt: "2026-09-02"

  minio-go-builder:
    # Build-only base for the self-built MinIO community binary.  The locked
    # source release declares Go 1.24.8 in its go.mod toolchain directive.
    # This multi-architecture index supports both the current arm64 profile and
    # a later amd64 Linux build profile.
    repository: docker.io/library/golang
    sourceTag: "1.24.8-bookworm"
    digest: sha256:4ed690d6649d63c312b99a6120025ec79ce3b542968a37da53d6236c7c61a848
    immutableReference: docker.io/library/golang@sha256:4ed690d6649d63c312b99a6120025ec79ce3b542968a37da53d6236c7c61a848
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://hub.docker.com/_/golang
    resolvedAt: "2026-09-02"

  minio-runtime:
    # The final image contains only MinIO's statically linked binary on a small
    # non-root distroless base.  It has no package manager or shell, reducing
    # runtime attack surface; diagnostics use a separate temporary client Pod.
    repository: gcr.io/distroless/static-debian12
    sourceTag: nonroot
    digest: sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    immutableReference: gcr.io/distroless/static-debian12@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://github.com/GoogleContainerTools/distroless
    resolvedAt: "2026-09-02"

  minio:
    # This is the locally built, registry-published result of buildSources.minio
    # below.  The tag is retained only as an audit-friendly build label; every
    # MinIO workload must use immutableReference so a retag cannot change what
    # Kubernetes runs.
    repository: clouddsp-registry.localhost:5001/minio
    sourceTag: "release-2025-10-15"
    sourceVersion: "RELEASE.2025-10-15T17-29-55Z"
    sourceCommit: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    digest: sha256:96dd150e3e8c93ebc407344078829c43240df19c74db58de17dd777d7d28ab5e
    immutableReference: clouddsp-registry.localhost:5001/minio@sha256:96dd150e3e8c93ebc407344078829c43240df19c74db58de17dd777d7d28ab5e
    supportedPlatforms:
      - linux/arm64/v8

    # Provenance names the exact source and both immutable bases used by the
    # Dockerfile.  Rebuild only after intentionally reviewing and updating all
    # three inputs, then record the new registry digest instead of overwriting
    # this existing historical image reference.
    builtFrom:
      sourceLock: buildSources.minio
      builderImageLock: images.minio-go-builder
      runtimeImageLock: images.minio-runtime
      dockerfile: kubernetes/services/minio/Dockerfile
    pushedAt: "2026-09-02"

  postgresql:
    # Docker Official Images are hosted in Docker Hub's `library` namespace.
    # Writing the registry and namespace explicitly avoids relying on Docker's
    # shorthand rules when this reference is used by Kubernetes.
    repository: docker.io/library/postgres

    # This is the human-readable upstream tag inspected on 2026-09-01.  It is
    # retained for auditability only; workloads must use `immutableReference`.
    sourceTag: "17-bookworm"
    resolvedVersion: "17.11-bookworm"

    # This is the digest of the multi-architecture OCI image index currently
    # published for the source tag.  The index lets Kubernetes select its
    # matching child image automatically: linux/arm64 for the current Apple
    # Silicon k3d nodes and linux/amd64 for the future native Linux GPU profile.
    # It must be changed only after deliberately reviewing a new upstream image.
    digest: sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    immutableReference: docker.io/library/postgres@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0

    # These platforms were present in the resolved image index.  They are a
    # compatibility record, not scheduling rules: Kubernetes still schedules
    # Pods using the actual node architecture and pulls the matching child
    # manifest from this pinned index.
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64

    # Keep enough provenance to repeat the review later without placing any
    # mutable image data or credentials in this repository.
    upstream: https://hub.docker.com/_/postgres
    resolvedAt: "2026-09-01"

buildSources:
  minio:
    # The MinIO community edition is source-distributed.  This is the final
    # upstream security/CVE release selected for the private local-learning
    # profile.  It is a source lock, not yet a deployable image lock.
    sourceRepository: https://github.com/minio/minio.git
    sourceTag: "RELEASE.2025-10-15T17-29-55Z"
    sourceCommit: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a

    # The first arm64 build is now recorded at images.minio above.  A future
    # rebuild must use this same source commit unless an intentional source-lock
    # update is reviewed, and it must record a new immutable registry digest.
    intendedRepository: clouddsp-registry.localhost:5001/minio
    targetPlatform: linux/arm64
    upstream: https://github.com/minio/minio/releases/tag/RELEASE.2025-10-15T17-29-55Z
    resolvedAt: "2026-09-02"
