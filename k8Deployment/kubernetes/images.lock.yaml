  basic-pitch-keda-burst-smoke-client:
    # This one-shot client is intentionally limited to three literal Basic
    # Pitch coordinates. It has two restricted service identities: one invokes
    # three PostgreSQL SECURITY DEFINER functions and one reads/writes only the
    # six fixed MinIO objects. It has no AMQP, Keycloak, Kubernetes, GPU, ML,
    # browser, cloud, or direct application-table authority.
    baseImageLock: images.api-python-runtime
    sourceDirectory: kubernetes/tests/basic-pitch-keda-burst-smoke/client
    dockerfile: kubernetes/tests/basic-pitch-keda-burst-smoke/client/Dockerfile
    requirementsLock: kubernetes/tests/basic-pitch-keda-burst-smoke/client/requirements.lock
    intendedRepository: clouddsp-registry.localhost:5001/basic-pitch-keda-burst-smoke-client
    publishedImageLock: images.basic-pitch-keda-burst-smoke-client
    targetPlatform: linux/arm64
    directPythonPackages:
      - name: boto3
        version: "1.43.89"
        # Boto3 uses explicit credentials with the private in-cluster MinIO
        # S3 Service. It cannot discover ambient AWS credentials or list a
        # bucket because the adapter and MinIO policy both forbid that scope.
        upstream: https://pypi.org/project/boto3/1.43.89/
      - name: psycopg
        version: "3.2.13"
        installationExtra: binary
        binaryPackage: psycopg-binary
        # The ARM64 binary wheel includes libpq, so the final slim image needs
        # no compiler or mutable operating-system PostgreSQL dependency.
        upstream: https://www.psycopg.org/psycopg3/docs/basic/install.html
    clientTestDirectory: kubernetes/tests/basic-pitch-keda-burst-smoke/client
    resolvedAt: "2026-09-20"

