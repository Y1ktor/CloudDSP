  rabbitmq:
    # RabbitMQ's Docker Official Image provides the AMQP broker used for
    # durable, at-least-once worker handoff.  The `management` variant also
    # includes RabbitMQ's administrator UI and `rabbitmqadmin` client tool for
    # local learning and later smoke tests.  Those interfaces will remain
    # cluster-internal or use a temporary port-forward; this image lock does
    # not by itself expose any RabbitMQ port to the Mac or browser.
    repository: docker.io/library/rabbitmq

    # RabbitMQ publishes a mutable `management` convenience tag.  Retain this
    # exact reviewed release tag for people, but all future workloads must use
    # the immutable manifest-list reference below so a later retag cannot
    # silently update a running broker.
    sourceTag: "4.3.5-management"
    resolvedVersion: "4.3.5"
    digest: sha256:b1188ba346ab5748add82f46ac58c7df993ee91d762915f8ac6fcadf2e6c07df
    immutableReference: docker.io/library/rabbitmq@sha256:b1188ba346ab5748add82f46ac58c7df993ee91d762915f8ac6fcadf2e6c07df

    # This OCI image index contains the matching child images for the current
    # Apple Silicon k3d nodes and a future native Linux x86_64/GPU profile.
    # These are compatibility facts, not Kubernetes scheduling constraints.
    supportedPlatforms:
      - linux/arm64/v8
      - linux/amd64
    upstream: https://hub.docker.com/_/rabbitmq
    resolvedAt: "2026-09-02"

buildSources:
  api:
    # This source lock produced `images.job-api` above. Future API source changes
    # must deliberately rebuild, push, and record a new output digest; do not
    # deploy the mutable readable tag from the build script.
    baseImageLock: images.api-python-runtime
    sourceDirectory: kubernetes/services/job-api/app
    dockerfile: kubernetes/services/job-api/Dockerfile
    requirementsLock: kubernetes/services/job-api/requirements.lock
    intendedRepository: clouddsp-registry.localhost:5001/job-api
    publishedImageLock: images.job-api
    targetPlatform: linux/arm64
    directPythonPackages:
      - name: fastapi
        version: "0.141.1"
        upstream: https://pypi.org/project/fastapi/0.141.1/
      - name: uvicorn
        version: "0.52.4"
        upstream: https://pypi.org/project/uvicorn/0.52.4/
      - name: psycopg
        version: "3.2.13"
        installationExtra: binary
        binaryPackage: psycopg-binary
        # Psycopg 3.3.5 is newer but its matching binary package is not yet
        # published. This latest matching pair is locked for the current
        # Linux/ARM64 target, avoiding a source build or external libpq layer.
        upstream: https://www.psycopg.org/psycopg3/docs/basic/install.html
      - name: PyJWT
        version: "2.13.0"
        installationExtra: crypto
        # PyJWT verifies the Keycloak access-token signature. Its `crypto`
        # extra adds the reviewed Cryptography backend needed for RSA/RS256.
        cryptoBackend:
          name: cryptography
          # Version 50.0.1's ARM64 wheel faults during RSA work under this
          # Docker Desktop Linux VM. 46.0.7 passed isolated RSA generation;
          # revisit only with a reviewed Docker/Desktop compatibility upgrade.
          version: "46.0.7"
        upstream: https://pypi.org/project/PyJWT/2.13.0/
      - name: boto3
        version: "1.43.89"
        # The local API uses Boto3 only for Signature V4 presigned POST/GET
        # generation. Its configured endpoint determines the returned browser
        # URL; signing itself performs no network request to MinIO or AWS.
        # Botocore and s3transfer are transitive packages locked with hashes in
        # requirements.lock, while Boto3 is listed here as the direct source
        # dependency that a future image rebuild must review.
        upstream: https://pypi.org/project/boto3/1.43.89/
    resolvedAt: "2026-09-06"

  upload-intake:
    # This source lock produced `images.upload-intake`. It intentionally uses
    # the same pinned Python base as the Job API but contains no HTTP server,
    # cloud Lambda handler, test files, runtime Secret, or Kubernetes client.
    # Rebuild/push and record a new output digest whenever its source or lock
    # changes; never deploy its descriptive tag by itself.
    baseImageLock: images.api-python-runtime
    sourceDirectory: kubernetes/services/upload-intake/app
    dockerfile: kubernetes/services/upload-intake/Dockerfile
    requirementsLock: kubernetes/services/upload-intake/requirements.lock
    intendedRepository: clouddsp-registry.localhost:5001/upload-intake
    publishedImageLock: images.upload-intake
    targetPlatform: linux/arm64
    directPythonPackages:
      - name: boto3
        version: "1.43.89"
        # The worker uses Boto3 only for private MinIO HeadObject verification;
        # it does not issue browser presigned URLs or download audio bytes.
        upstream: https://pypi.org/project/boto3/1.43.89/
      - name: psycopg
        version: "3.2.13"
        installationExtra: binary
        binaryPackage: psycopg-binary
        # The reviewed ARM64 wheel includes libpq, avoiding a compiler/system
        # package in the slim runtime image.
        upstream: https://www.psycopg.org/psycopg3/docs/basic/install.html
      - name: pika
        version: "1.4.4"
        # Pika is a pure-Python AMQP 0-9-1 client used for manual acknowledgements.
        upstream: https://pypi.org/project/pika/1.4.4/
    resolvedAt: "2026-09-07"

  dispatcher:
    # The internal dispatcher has no HTTP listener, cloud Lambda handler,
    # MinIO permission, GPU runtime, Kubernetes client, or browser credential.
    # It uses the same pinned Python base to lease PostgreSQL outbox rows and
    # publisher-confirm their restricted processing messages to RabbitMQ. The
    # image deliberately defaults to the established Demucs-only entrypoint;
    # a future generic Deployment chooses the generic entrypoint explicitly.
    baseImageLock: images.api-python-runtime
    sourceDirectory: kubernetes/services/dispatcher/app
    dockerfile: kubernetes/services/dispatcher/Dockerfile
    requirementsLock: kubernetes/services/dispatcher/requirements.lock
    intendedRepository: clouddsp-registry.localhost:5001/dispatcher
    publishedImageLock: images.dispatcher
    targetPlatform: linux/arm64
    directPythonPackages:
      - name: psycopg
        version: "3.2.13"
        installationExtra: binary
        binaryPackage: psycopg-binary
        # The reviewed ARM64 binary wheel supplies libpq; the slim runtime does
        # not need a compiler or system PostgreSQL development package.
        upstream: https://www.psycopg.org/psycopg3/docs/basic/install.html
      - name: pika
        version: "1.4.4"
        # Pika is a pure-Python AMQP 0-9-1 publisher client. It cannot declare
        # topology because the runtime RabbitMQ identity lacks configure rights.
        upstream: https://pypi.org/project/pika/1.4.4/
    resolvedAt: "2026-09-09"

  basic-pitch:
    # This immutable source provenance produced `images.basic-pitch`. The
    # readable intended repository is still never a workload reference: a
    # future Deployment must copy that image record's immutable digest.
    baseImageLock: images.basic-pitch-python-runtime
    sourceDirectory: kubernetes/services/basic-pitch/app
    dockerfile: kubernetes/services/basic-pitch/Dockerfile
    requirementsLock: kubernetes/services/basic-pitch/requirements.lock
    intendedRepository: clouddsp-registry.localhost:5001/basic-pitch
    publishedImageLock: images.basic-pitch
    targetPlatform: linux/arm64
    devicePolicy: cpu
    pythonVersion: "3.11"
    # This exec-form command is part of the immutable image contract. Python
    # becomes PID 1 rather than a shell, so Kubernetes SIGTERM reaches the
    # reviewed cooperative-shutdown wrapper directly.
    entrypoint:
      - python
      - -m
      - app.worker_main
    directPythonPackages:
      - name: basic-pitch
        version: "0.4.0"
        # Basic Pitch's Linux inference dependency resolves to TensorFlow 2.15
        # and the Linux/ARM64 CPU binary named `tensorflow-cpu-aws`. That name
        # describes upstream wheel distribution, not an AWS integration.
        inferenceRuntime:
          name: tensorflow
          version: "2.15.0"
          linuxArm64BinaryPackage: tensorflow-cpu-aws
          linuxArm64BinaryVersion: "2.15.0"
        upstream: https://pypi.org/project/basic-pitch/0.4.0/
      - name: boto3
        version: "1.43.89"
        # Boto3 speaks the S3 protocol to the fixed private MinIO Service. It
        # receives explicit MinIO keys and must not consult ambient AWS config.
        upstream: https://pypi.org/project/boto3/1.43.89/
      - name: pika
        version: "1.4.4"
        # This private RabbitMQ consumer reads/acknowledges only the Basic
        # Pitch request queue; it has no topology-management permission.
        upstream: https://pypi.org/project/pika/1.4.4/
      - name: psycopg
        version: "3.2.13"
        installationExtra: binary
        binaryPackage: psycopg-binary
        # The bundled ARM64 libpq wheel avoids a compiler or system PostgreSQL
        # development package in the later slim worker image.
        upstream: https://www.psycopg.org/psycopg3/docs/basic/install.html
    resolvedAt: "2026-09-12"

  adtof:
    # This immutable source provenance produced `images.adtof`. The readable
    # intended repository is still never a workload reference: a future
    # Deployment must copy only that image record's immutable digest.
    #
    # The source recipe has no CUDA/NVIDIA/Apple-MPS bridge, Kubernetes client,
    # browser listener, cloud credential, or baked Secret. It is ordinary
    # Linux/ARM64 CPU PyTorch processing for the local Apple-Silicon k3d nodes.
    baseImageLock: images.basic-pitch-python-runtime
    sourceDirectory: kubernetes/services/adtof/app
    dockerfile: kubernetes/services/adtof/Dockerfile
    requirementsLock: kubernetes/services/adtof/requirements.lock
    unitTestDirectory: kubernetes/services/adtof/tests
    intendedRepository: clouddsp-registry.localhost:5001/adtof
    publishedImageLock: images.adtof
    targetPlatform: linux/arm64
    devicePolicy: cpu
    pythonVersion: "3.11"
    # This exec-form module is the image's exact PID 1 contract. Kubernetes
    # SIGTERM therefore reaches its scoped cooperative shutdown wrapper rather
    # than an intermediary shell process.
    entrypoint:
      - python
      - -m
      - app.worker_main
    directPythonPackages:
      - name: adtof-pytorch
        # The source archive, revision, and hash live together in the complete
        # requirements lock. It bundles reviewed model `.pth` weights, avoiding
        # model download at Pod runtime.
        sourceRevision: "85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9"
        sourceArchive: https://codeload.github.com/xavriley/ADTOF-pytorch/tar.gz/85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9
        bundledModelWeights: true
        upstream: https://github.com/xavriley/ADTOF-pytorch
      - name: torch
        version: "2.5.1"
        # Linux/ARM64 CPU PyTorch has no NVIDIA/CUDA requirement and no `+cpu`
        # version suffix. The extra index is declared by the Dockerfile.
        device: cpu
        upstream: https://download.pytorch.org/whl/cpu/
      - name: librosa
        version: "0.10.2.post1"
        upstream: https://pypi.org/project/librosa/0.10.2.post1/
      - name: pretty-midi
        version: "0.2.10"
        # This SHA-pinned source distribution preserves the cloud MIDI behavior
        # while build isolation stays disabled under locked build tools.
        upstream: https://pypi.org/project/pretty-midi/0.2.10/
      - name: numpy
        version: "1.26.4"
        upstream: https://pypi.org/project/numpy/1.26.4/
      - name: scipy
        version: "1.13.1"
        upstream: https://pypi.org/project/scipy/1.13.1/
      - name: numba
        version: "0.60.0"
        upstream: https://pypi.org/project/numba/0.60.0/
      - name: scikit-learn
        version: "1.5.1"
        upstream: https://pypi.org/project/scikit-learn/1.5.1/
      - name: soundfile
        version: "0.12.1"
        upstream: https://pypi.org/project/soundfile/0.12.1/
      - name: soxr
        version: "0.3.7"
        upstream: https://pypi.org/project/soxr/0.3.7/
      - name: boto3
        version: "1.43.89"
        # Boto3 uses explicit credentials only for private in-cluster MinIO S3
        # operations. It does not use ambient AWS configuration or AWS APIs.
        upstream: https://pypi.org/project/boto3/1.43.89/
      - name: pika
        version: "1.4.4"
        # The runtime identity consumes and acknowledges only its pre-created
        # private ADTOF request queue; it cannot manage broker topology.
        upstream: https://pypi.org/project/pika/1.4.4/
      - name: psycopg
        version: "3.2.13"
        installationExtra: binary
        binaryPackage: psycopg-binary
        # The reviewed ARM64 binary package supplies libpq without a compiler
        # or an unpinned system PostgreSQL dependency in the final image.
        upstream: https://www.psycopg.org/psycopg3/docs/basic/install.html
    resolvedAt: "2026-09-14"

  demucs:
    # This source lock defines the reviewed local CPU worker image. It has no
    # CUDA, Apple-MPS assumption, Kubernetes client, browser listener, or
    # runtime secrets baked in. Its private credentials arrive only from
    # Kubernetes Secrets when a separate future Deployment starts it.
    baseImageLock: images.api-python-runtime
    sourceDirectory: kubernetes/services/demucs/app
    dockerfile: kubernetes/services/demucs/Dockerfile
    requirementsLock: kubernetes/services/demucs/requirements.lock
    modelArtifactsLock: kubernetes/services/demucs/model-artifacts.lock.yaml
    intendedRepository: clouddsp-registry.localhost:5001/demucs
    publishedImageLock: images.demucs
    targetPlatform: linux/arm64
    devicePolicy: cpu
    localArm64CpuInferencePolicy:
      # The Demucs build uses this child-only policy because Docker Desktop/k3d
      # reproduced SIGILL in the default MKLDNN model path. This source recipe
      # describes the grouped launcher for a future build; existing image
      # digests continue to identify their original bytes.
      # The subprocess runs in an isolated output directory. Its absolute
      # launcher avoids exporting a broad PYTHONPATH into the worker Pod.
      launcherScript: /app/app/processing/demucs_cpu_cli.py
      mkldnnEnabled: false
    workerEntrypoint:
      # Exec-form Docker ENTRYPOINT runs this wrapper as PID 1, so Kubernetes
      # SIGTERM reaches the scoped graceful-shutdown bridge directly.
      - python
      - -m
      - app.worker_main
    directPythonPackages:
      - name: demucs
        version: "4.0.1"
        # This is the four-stem v4 model package; `htdemucs_ft` and a later
        # CUDA artifact are deliberately separate performance decisions.
        upstream: https://pypi.org/project/demucs/4.0.1/
      - name: torch
        version: "2.4.0"
        # ARM64 CPU wheel: no CUDA runtime is present in this local image.
        upstream: https://download.pytorch.org/whl/cpu/
      - name: torchaudio
        version: "2.4.0"
        upstream: https://download.pytorch.org/whl/cpu/
      - name: boto3
        version: "1.43.89"
        # Used only for restricted private MinIO reads/writes in the later
        # worker; it is configured explicitly, never through ambient AWS SDK
        # credentials.
        upstream: https://pypi.org/project/boto3/1.43.89/
      - name: psycopg
        version: "3.2.13"
        installationExtra: binary
        binaryPackage: psycopg-binary
        upstream: https://www.psycopg.org/psycopg3/docs/basic/install.html
      - name: pika
        version: "1.4.4"
        # The future manual-ack consumer can only consume its fixed Demucs
        # request queue; topology configuration remains a bootstrap concern.
        upstream: https://pypi.org/project/pika/1.4.4/
    unitTestDirectory: kubernetes/services/demucs/tests
    resolvedAt: "2026-09-21"

  dispatcher-smoke-client:
    # This source lock describes one disposable integration-test image. It
    # creates its test event through Keycloak, Job API, MinIO, and upload-intake
