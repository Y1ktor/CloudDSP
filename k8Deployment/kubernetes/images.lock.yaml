  demucs:
    # This is the reviewed local Linux/ARM64 CPU worker image. It runs the
    # complete private Demucs worker wrapper. The deployed workload must copy
    # this digest—not the readable provenance tag—into `image:`.
    repository: clouddsp-registry.localhost:5001/demucs
