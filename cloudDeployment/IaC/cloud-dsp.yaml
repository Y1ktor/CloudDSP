AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudDSP root stack. Composes the component stacks and passes their outputs
  as parameters so resource names and ARNs are never hardcoded.

Parameters:
  ProjectName:
    Type: String
    Default: clouddsp
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,31}$'

  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]{0,15}$'

  TemplateBucketName:
    Type: String
    Default: clouddsp-dev-cfn-templates-512383926199-us-east-1
    Description: S3 bucket containing the uploaded nested CloudFormation templates.

  TemplatePrefix:
    Type: String
    Default: templates/
    Description: >-
      Optional path prefix, including its trailing slash, for nested templates.
      Leave empty when the templates are at the bucket root; use templates/
      when they are under that prefix.

  ArtifactBucketName:
    Type: String
    Default: clouddsp-dev-cfn-artifacts-512383926199-us-east-1
    Description: S3 bucket containing packaged Lambda zip artifacts.

  JobApiCodeS3Key:
    Type: String
    Default: lambda/job_api-quota-status-20260824.zip
    Description: S3 key for the packaged job_api Lambda zip artifact.

  MaxDailyDirectUploadJobs:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100
    Description: Maximum direct browser-upload job contracts per Cognito user per UTC day.

  MaxDailyYtDlpJobs:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 100
    Description: Maximum linked-media yt-dlp jobs per Cognito user per UTC day.

  WebSocketHandlerCodeS3Key:
    Type: String
    Default: lambda/websocket_handler-08-18.zip
    Description: S3 key for the packaged websocket_handler Lambda zip artifact.

  WebSocketAuthorizerCodeS3Key:
    Type: String
    Default: lambda/websocket_authorizer-08-18.zip
    Description: S3 key for the packaged websocket_authorizer Lambda zip artifact.

  AllowedFrontendOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: Comma-separated browser origins allowed by S3 and the job API.

  DeployWebsiteHosting:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: >-
      Set true to create the optional private-S3, CloudFront, ACM, and Route 53
      static-site hosting component. It is independent of the CloudDSP API.

  WebsiteDomainName:
    Type: String
    Default: ''
    Description: Canonical apex domain for the optional website hosting stack, for example y1ktor.com.

  WebsiteHostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 public hosted-zone ID for WebsiteDomainName, without /hostedzone/.

  WebsiteCloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: Edge-location coverage for the optional website CloudFront distribution.

  WebsiteContentSecurityPolicy:
    Type: String
    Default: ''
    Description: >-
      Optional full Content-Security-Policy for the website. Use the exact
      policy generated by repository-root frontend/csp.js when publishing CloudDSP.

  WebsiteWebAclArn:
    Type: String
    Default: ''
    Description: Optional us-east-1 AWS WAFv2 Web ACL ARN for the website distribution.

  ExistingWebsiteBucketName:
    Type: String
    Default: ''
    Description: >-
      Existing retained website bucket for disaster recovery. Leave empty on
      a clean deployment.

  ExistingDemoAssetsBucketName:
    Type: String
    Default: ''
    Description: >-
      Existing retained demo-assets bucket for disaster recovery. Leave empty
      on a clean deployment.

  AllowedMediaHosts:
    Type: CommaDelimitedList
    Default: youtube.com,youtu.be,bilibili.com,b23.tv,soundcloud.com,on.soundcloud.com
    Description: >-
      Reviewed linked-media page hosts accepted by the Job API and yt-dlp.
      Add a provider only after validating its terms, yt-dlp support, and
      operational behavior.

  BasicPitchImageTag:
    Type: String
    Default: latest
    Description: ECR tag or digest suffix for the Basic Pitch image.

  ADTOFImageTag:
    Type: String
    Default: latest
    Description: ECR tag or digest suffix for the ADTOF image.

  DemucsImageTag:
    Type: String
    Default: latest
    Description: ECR tag or digest suffix for the Demucs image.

  YtDlpImageTag:
    Type: String
    Default: latest
    Description: ECR tag or digest suffix for the durable yt-dlp ingestion image.

  YtDlpProxyUrl:
    Type: String
    Default: ''
    NoEcho: true
    Description: >-
      Optional residential proxy URL for yt-dlp, including credentials when
      required by the provider. The ingestion stack stores it only as an
      encrypted SSM SecureString; leave empty to use direct egress. On an
      existing stack update, retain the prior NoEcho parameter value unless
      intentionally changing or removing the proxy.

  DeployProcessingWorkers:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: >-
      Set false for the bootstrap deployment that creates ECR repositories.
      Push the Basic Pitch, ADTOF, Demucs, and yt-dlp images, then update the
      stack with true to create the Lambda and Batch processing workers.

  GpuInstanceTypes:
    Type: CommaDelimitedList
    Default: g4dn.xlarge
    Description: GPU instance types allowed in the Demucs compute environment.

  BatchMaxvCpus:
    Type: Number
    Default: 8
    MinValue: 4
    Description: Maximum vCPUs allocated by the managed Demucs compute environment.

  BatchScaleDownDelayMinutes:
    Type: Number
    Default: 20
    AllowedValues:
      - 0
      - 20
    Description: >-
      Keep an idle Demucs GPU host for 20 minutes after its final job. Set 0
      to disable warm-host retention and scale down as soon as Batch permits.

  MaxSourceDurationSeconds:
    Type: Number
    Default: 500
    MinValue: 1
    MaxValue: 3600
    Description: Maximum source audio duration accepted by both yt-dlp and Demucs.

  MaxSourceBytes:
    Type: Number
    Default: 268435456
    MinValue: 1
    MaxValue: 1073741824
    Description: Maximum original/linked encoded audio size in bytes (256 MiB by default).

  MaxConvertedWavBytes:
    Type: Number
    Default: 134217728
    MinValue: 1
    MaxValue: 1073741824
    Description: Maximum normalized WAV generated by yt-dlp in bytes (128 MiB by default).

  JobRetentionDays:
    Type: Number
    Default: 14
    MinValue: 1
    MaxValue: 365
    Description: Days after creation before job records and audio artifacts expire.

  CognitoUserPoolTier:
    Type: String
    Default: LITE
    AllowedValues:
      - LITE
      - ESSENTIALS
      - PLUS
    Description: Cognito User Pool feature plan for CloudDSP browser authentication.

  CognitoPasswordMinimumLength:
    Type: Number
    Default: 8
    MinValue: 8
    MaxValue: 99
    Description: >-
      Minimum Cognito password length. The user pool also requires one special
      symbol, but does not require uppercase, lowercase, or numeric characters.

Conditions:
  CreateProcessingWorkers: !Equals [!Ref DeployProcessingWorkers, 'true']
  CreateWebsiteHosting: !Equals [!Ref DeployWebsiteHosting, 'true']

Rules:
  WebsiteHostingRegion:
    RuleCondition: !Equals [!Ref DeployWebsiteHosting, 'true']
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: >-
          Website hosting must be deployed in us-east-1 because CloudFront
          requires its ACM certificate in that region.
  WebsiteHostingDomain:
    RuleCondition: !Equals [!Ref DeployWebsiteHosting, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref WebsiteDomainName, '']]
        AssertDescription: WebsiteDomainName is required when DeployWebsiteHosting is true.
      - Assert: !Not [!Equals [!Ref WebsiteHostedZoneId, '']]
        AssertDescription: WebsiteHostedZoneId is required when DeployWebsiteHosting is true.

Resources:
  WebsiteHostingStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateWebsiteHosting
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}hosting.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        WebsiteDomainName: !Ref WebsiteDomainName
        HostedZoneId: !Ref WebsiteHostedZoneId
        CloudFrontPriceClass: !Ref WebsiteCloudFrontPriceClass
        ContentSecurityPolicy: !Ref WebsiteContentSecurityPolicy
        WebAclArn: !Ref WebsiteWebAclArn
        ExistingWebsiteBucketName: !Ref ExistingWebsiteBucketName
        ExistingDemoAssetsBucketName: !Ref ExistingDemoAssetsBucketName

  FoundationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}foundation.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        AllowedFrontendOrigins: !Join [',', !Ref AllowedFrontendOrigins]
        JobRetentionDays: !Ref JobRetentionDays

  JobsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}jobs.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName

  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}auth.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        UserPoolTier: !Ref CognitoUserPoolTier
        PasswordMinimumLength: !Ref CognitoPasswordMinimumLength

  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}network.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName

  RealtimeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}realtime.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        JobsTableName: !GetAtt JobsStack.Outputs.JobsTableName
        JobsTableArn: !GetAtt JobsStack.Outputs.JobsTableArn
        WebSocketHandlerCodeS3Bucket: !Ref ArtifactBucketName
        WebSocketHandlerCodeS3Key: !Ref WebSocketHandlerCodeS3Key
        WebSocketAuthorizerCodeS3Bucket: !Ref ArtifactBucketName
        WebSocketAuthorizerCodeS3Key: !Ref WebSocketAuthorizerCodeS3Key
        CognitoUserPoolIssuer: !GetAtt AuthStack.Outputs.UserPoolIssuer
        CognitoBrowserClientId: !GetAtt AuthStack.Outputs.BrowserClientId

  MidiLambdasStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateProcessingWorkers
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}midi-lambdas.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        BasicPitchImageUri: !Sub
          - '${RepositoryUri}:${ImageTag}'
          - RepositoryUri: !GetAtt FoundationStack.Outputs.BasicPitchRepositoryUri
            ImageTag: !Ref BasicPitchImageTag
        ADTOFImageUri: !Sub
          - '${RepositoryUri}:${ImageTag}'
          - RepositoryUri: !GetAtt FoundationStack.Outputs.ADTOFRepositoryUri
            ImageTag: !Ref ADTOFImageTag
        ProcessedAudioBucketName: !GetAtt FoundationStack.Outputs.ProcessedAudioBucketName
        ProcessedAudioBucketArn: !GetAtt FoundationStack.Outputs.ProcessedAudioBucketArn
        JobsTableName: !GetAtt JobsStack.Outputs.JobsTableName
        JobsTableArn: !GetAtt JobsStack.Outputs.JobsTableArn
        ConnectionsTableName: !GetAtt RealtimeStack.Outputs.ConnectionsTableName
        ConnectionsTableArn: !GetAtt RealtimeStack.Outputs.ConnectionsTableArn
        UserConnectionsIndexName: !GetAtt RealtimeStack.Outputs.UserConnectionsIndexName
        WebSocketApiId: !GetAtt RealtimeStack.Outputs.WebSocketApiId

  YtDlpIngestionStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateProcessingWorkers
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}ingestion.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        YtDlpImageUri: !Sub
          - '${RepositoryUri}:${ImageTag}'
          - RepositoryUri: !GetAtt FoundationStack.Outputs.YtDlpRepositoryUri
            ImageTag: !Ref YtDlpImageTag
        UploadsBucketName: !GetAtt FoundationStack.Outputs.UploadsBucketName
        UploadsBucketArn: !GetAtt FoundationStack.Outputs.UploadsBucketArn
        JobsTableName: !GetAtt JobsStack.Outputs.JobsTableName
        JobsTableArn: !GetAtt JobsStack.Outputs.JobsTableArn
        ConnectionsTableName: !GetAtt RealtimeStack.Outputs.ConnectionsTableName
        ConnectionsTableArn: !GetAtt RealtimeStack.Outputs.ConnectionsTableArn
        UserConnectionsIndexName: !GetAtt RealtimeStack.Outputs.UserConnectionsIndexName
        WebSocketApiId: !GetAtt RealtimeStack.Outputs.WebSocketApiId
        YtDlpProxyUrl: !Ref YtDlpProxyUrl
        AllowedMediaHosts: !Join [',', !Ref AllowedMediaHosts]
        MaxSourceDurationSeconds: !Ref MaxSourceDurationSeconds
        MaxSourceDownloadBytes: !Ref MaxSourceBytes
        MaxConvertedWavBytes: !Ref MaxConvertedWavBytes

  ProcessingStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateProcessingWorkers
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}processing.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        UploadsBucketName: !GetAtt FoundationStack.Outputs.UploadsBucketName
        UploadsBucketArn: !GetAtt FoundationStack.Outputs.UploadsBucketArn
        ProcessedAudioBucketName: !GetAtt FoundationStack.Outputs.ProcessedAudioBucketName
        ProcessedAudioBucketArn: !GetAtt FoundationStack.Outputs.ProcessedAudioBucketArn
        JobsTableName: !GetAtt JobsStack.Outputs.JobsTableName
        JobsTableArn: !GetAtt JobsStack.Outputs.JobsTableArn
        ConnectionsTableName: !GetAtt RealtimeStack.Outputs.ConnectionsTableName
        ConnectionsTableArn: !GetAtt RealtimeStack.Outputs.ConnectionsTableArn
        WebSocketApiId: !GetAtt RealtimeStack.Outputs.WebSocketApiId
        DemucsImageUri: !Sub
          - '${RepositoryUri}:${ImageTag}'
          - RepositoryUri: !GetAtt FoundationStack.Outputs.DemucsRepositoryUri
            ImageTag: !Ref DemucsImageTag
        BasicPitchLambdaArn: !GetAtt MidiLambdasStack.Outputs.BasicPitchLambdaArn
        ADTOFLambdaArn: !GetAtt MidiLambdasStack.Outputs.ADTOFLambdaArn
        BatchSubnetIds: !GetAtt NetworkStack.Outputs.BatchPublicSubnetIds
        BatchSecurityGroupIds: !GetAtt NetworkStack.Outputs.BatchSecurityGroupId
        GpuInstanceTypes: !Join [',', !Ref GpuInstanceTypes]
        BatchMaxvCpus: !Ref BatchMaxvCpus
        BatchScaleDownDelayMinutes: !Ref BatchScaleDownDelayMinutes
        MaxSourceDurationSeconds: !Ref MaxSourceDurationSeconds
        MaxSourceBytes: !Ref MaxSourceBytes

  ApiStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}api.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        EnvironmentName: !Ref EnvironmentName
        JobsTableName: !GetAtt JobsStack.Outputs.JobsTableName
        JobsTableArn: !GetAtt JobsStack.Outputs.JobsTableArn
        DailySubmissionQuotaTableName: !GetAtt JobsStack.Outputs.DailySubmissionQuotaTableName
        DailySubmissionQuotaTableArn: !GetAtt JobsStack.Outputs.DailySubmissionQuotaTableArn
        UploadsBucketName: !GetAtt FoundationStack.Outputs.UploadsBucketName
        UploadsBucketArn: !GetAtt FoundationStack.Outputs.UploadsBucketArn
        ProcessedAudioBucketName: !GetAtt FoundationStack.Outputs.ProcessedAudioBucketName
        ProcessedAudioBucketArn: !GetAtt FoundationStack.Outputs.ProcessedAudioBucketArn
        JobApiCodeS3Bucket: !Ref ArtifactBucketName
        JobApiCodeS3Key: !Ref JobApiCodeS3Key
        AllowedFrontendOrigins: !Join [',', !Ref AllowedFrontendOrigins]
        AllowedMediaHosts: !Join [',', !Ref AllowedMediaHosts]
        CognitoUserPoolIssuer: !GetAtt AuthStack.Outputs.UserPoolIssuer
        CognitoBrowserClientId: !GetAtt AuthStack.Outputs.BrowserClientId
        MaxSourceBytes: !Ref MaxSourceBytes
        JobRetentionDays: !Ref JobRetentionDays
        MaxDailyDirectUploadJobs: !Ref MaxDailyDirectUploadJobs
        MaxDailyYtDlpJobs: !Ref MaxDailyYtDlpJobs
        YtDlpFunctionArn: !If
          - CreateProcessingWorkers
          - !GetAtt YtDlpIngestionStack.Outputs.YtDlpFunctionArn
          - ''

Outputs:
  WebsiteUrl:
    Condition: CreateWebsiteHosting
    Description: Canonical HTTPS URL for the optional static-site hosting component.
    Value: !GetAtt WebsiteHostingStack.Outputs.WebsiteUrl

  WebsiteBucketName:
    Condition: CreateWebsiteHosting
    Description: Private S3 bucket to receive built static-site files.
    Value: !GetAtt WebsiteHostingStack.Outputs.WebsiteBucketName

  DemoAssetsBucketName:
    Condition: CreateWebsiteHosting
    Description: Private S3 bucket containing curated anonymous demo-job assets.
    Value: !GetAtt WebsiteHostingStack.Outputs.DemoAssetsBucketName

  DemoAssetsBucketArn:
    Condition: CreateWebsiteHosting
    Description: ARN of the private curated demo-assets bucket.
    Value: !GetAtt WebsiteHostingStack.Outputs.DemoAssetsBucketArn

  WebsiteCloudFrontDistributionId:
    Condition: CreateWebsiteHosting
    Description: CloudFront distribution ID for website cache invalidations.
    Value: !GetAtt WebsiteHostingStack.Outputs.CloudFrontDistributionId

  UploadsBucketName:
    Description: Private bucket for original user audio uploads.
    Value: !GetAtt FoundationStack.Outputs.UploadsBucketName

  ProcessedAudioBucketName:
    Description: Private bucket for stems and MIDI artifacts.
    Value: !GetAtt FoundationStack.Outputs.ProcessedAudioBucketName

  JobsTableName:
    Description: Durable DynamoDB jobs table name.
    Value: !GetAtt JobsStack.Outputs.JobsTableName

  CognitoUserPoolId:
    Description: Cognito User Pool ID for CloudDSP user authentication.
    Value: !GetAtt AuthStack.Outputs.UserPoolId

  CognitoBrowserClientId:
    Description: Public Cognito app client ID used by the React application.
    Value: !GetAtt AuthStack.Outputs.BrowserClientId

  CognitoUserPoolIssuer:
    Description: Cognito JWT issuer URL for API Gateway authorizers.
    Value: !GetAtt AuthStack.Outputs.UserPoolIssuer

  JobApiEndpoint:
    Description: HTTP endpoint for job creation and snapshot reads.
    Value: !GetAtt ApiStack.Outputs.JobApiEndpoint

  WebSocketEndpoint:
    Description: Browser WebSocket endpoint for subscribing to jobs.
    Value: !GetAtt RealtimeStack.Outputs.WebSocketEndpoint

  DemucsJobQueueArn:
    Condition: CreateProcessingWorkers
    Description: GPU Demucs Batch job queue ARN.
    Value: !GetAtt ProcessingStack.Outputs.DemucsJobQueueArn

  BasicPitchLambdaArn:
    Condition: CreateProcessingWorkers
    Description: Basic Pitch extraction Lambda ARN.
    Value: !GetAtt MidiLambdasStack.Outputs.BasicPitchLambdaArn

  ADTOFLambdaArn:
    Condition: CreateProcessingWorkers
    Description: ADTOF extraction Lambda ARN.
    Value: !GetAtt MidiLambdasStack.Outputs.ADTOFLambdaArn

  YtDlpIngestionLambdaArn:
    Condition: CreateProcessingWorkers
    Description: Durable yt-dlp source-ingestion Lambda ARN.
    Value: !GetAtt YtDlpIngestionStack.Outputs.YtDlpFunctionArn
