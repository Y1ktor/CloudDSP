<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDSP - Web Audio EQ</title>
</head>
<body>
    <h1>CloudDSP Interactive EQ</h1>
    
    <div>
        <!-- Removed crossorigin="anonymous" to fix local file:// playback -->
        <audio id="audio-source" src="../assets/PYT-sample.wav" controls></audio>
    </div>
    
    <div style="margin-top: 20px;">
        <canvas id="visualizer" width="800" height="300" style="background-color: #222; border-radius: 4px; width: 100%; max-width: 1000px; display: block;"></canvas>
    </div>
    
    <div style="margin-top: 20px;">
        <h3>3-Band EQ</h3>
        
        <div>
            <label for="low-eq">Low (100Hz): <span id="low-val">0</span> dB</label><br>
            <input type="range" id="low-eq" min="-15" max="15" value="0" step="0.1">
        </div>
        
        <div style="margin-top: 10px;">
            <label for="mid-eq">Mid (1000Hz): <span id="mid-val">0</span> dB</label><br>
            <input type="range" id="mid-eq" min="-15" max="15" value="0" step="0.1">
        </div>
        
        <div style="margin-top: 10px;">
            <label for="high-eq">High (5000Hz): <span id="high-val">0</span> dB</label><br>
            <input type="range" id="high-eq" min="-15" max="15" value="0" step="0.1">
        </div>
    </div>

    <!-- Link to external JavaScript module -->
    <script type="module" src="../js/main.js"></script>
</body>
</html>
