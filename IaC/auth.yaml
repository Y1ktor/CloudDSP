AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudDSP user authentication. Creates only a Cognito User Pool and a public
  browser app client; it does not create an identity pool or AWS credentials.

Parameters:
  ProjectName:
    Type: String
    Default: clouddsp
    Description: Prefix used when naming CloudDSP resources.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,31}$'

  EnvironmentName:
    Type: String
    Default: dev
    Description: Deployment environment, such as dev, staging, or prod.
    AllowedPattern: '^[a-z][a-z0-9-]{0,15}$'

  UserPoolTier:
    Type: String
    Default: LITE
    AllowedValues:
      - LITE
      - ESSENTIALS
      - PLUS
    Description: >-
      Cognito feature plan. Lite provides email/password authentication without
      paid advanced security or passwordless features.

  PasswordMinimumLength:
    Type: Number
    Default: 12
    MinValue: 8
    MaxValue: 99
    Description: Minimum password length for locally registered users.

Resources:
  CloudDSPUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${EnvironmentName}-Users'
      UserPoolTier: !Ref UserPoolTier
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: !Ref PasswordMinimumLength
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: !Ref EnvironmentName
        Component: auth

  CloudDSPBrowserClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${EnvironmentName}-Browser'
      UserPoolId: !Ref CloudDSPUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
      RefreshTokenValidity: 7
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID for CloudDSP browser authentication.
    Value: !Ref CloudDSPUserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolArn:
    Description: Cognito User Pool ARN for API Gateway JWT authorizers.
    Value: !GetAtt CloudDSPUserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolArn'

  UserPoolIssuer:
    Description: OpenID Connect issuer URL used by API Gateway JWT validation.
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CloudDSPUserPool}'
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolIssuer'

  BrowserClientId:
    Description: Public Cognito app client ID used by the React browser.
    Value: !Ref CloudDSPBrowserClient
    Export:
      Name: !Sub '${AWS::StackName}-BrowserClientId'
