AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudDSP durable processing-job state. This stack owns the DynamoDB table
  used to recover stem and MIDI results after a WebSocket disconnect.

Parameters:
  ProjectName:
    Type: String
    Default: clouddsp
    Description: Prefix used when naming CloudDSP resources.
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,31}$'

  EnvironmentName:
    Type: String
    Default: dev
    Description: Deployment environment, such as dev, staging, or prod.
    AllowedPattern: '^[a-z][a-z0-9-]{0,15}$'

Resources:
  CloudDSPJobs:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-Jobs'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: updated_at
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_id-updated_at-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: updated_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: jobs

Outputs:
  JobsTableName:
    Description: Name of the DynamoDB table that stores durable job state.
    Value: !Ref CloudDSPJobs
    Export:
      Name: !Sub '${AWS::StackName}-JobsTableName'

  JobsTableArn:
    Description: ARN of the DynamoDB table that stores durable job state.
    Value: !GetAtt CloudDSPJobs.Arn
    Export:
      Name: !Sub '${AWS::StackName}-JobsTableArn'

  UserJobsIndexName:
    Description: Index used to list a user's jobs by most recently updated.
    Value: user_id-updated_at-index
    Export:
      Name: !Sub '${AWS::StackName}-UserJobsIndexName'
