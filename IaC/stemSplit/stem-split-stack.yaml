AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudDSP: Complete Stem Splitter Pipeline (S3, API Gateway, Lambda, WebSocket)'

Parameters:
  BatchJobQueue:
    Type: String
    Description: "The ARN or Name of the AWS Batch Job Queue"
  BatchJobDefinition:
    Type: String
    Description: "The ARN or Name of the AWS Batch Job Definition"

Resources:
  # ==========================================
  # 1. S3 BUCKETS
  # ==========================================
  IncomingBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3toBatchInvokePermission
    Properties:
      BucketName: !Sub "clouddsp-incoming-audio-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:Put"
            Function: !GetAtt S3toBatchLambda.Arn
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - OPTIONS
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "clouddsp-processed-audio-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - OPTIONS
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  # ==========================================
  # 1.5 S3-TO-BATCH ORCHESTRATION LAMBDA
  # ==========================================
  S3toBatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BatchAndS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::clouddsp-incoming-audio-${AWS::AccountId}-${AWS::Region}/*"

  S3toBatchLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CloudDSP-S3toBatch
      Handler: index.lambda_handler
      Role: !GetAtt S3toBatchRole.Arn
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import urllib.parse
          import uuid
          
          def lambda_handler(event, context):
              batch_client = boto3.client('batch')
              s3_client = boto3.client('s3')
              
              job_queue = os.environ.get('BATCH_JOB_QUEUE')
              job_definition = os.environ.get('BATCH_JOB_DEFINITION')
              output_bucket = os.environ.get('OUTPUT_BUCKET')
              websocket_url = os.environ.get('WEBSOCKET_API_URL')
              
              if not job_queue or not job_definition:
                  print("Error: Missing BATCH_JOB_QUEUE or BATCH_JOB_DEFINITION environment variables.")
                  return {'statusCode': 500, 'body': 'Configuration error.'}
          
              try:
                  for record in event.get('Records', []):
                      if 's3' in record:
                          bucket = record['s3']['bucket']['name']
                          key = urllib.parse.unquote_plus(record['s3']['object']['key'])
                          
                          if not output_bucket:
                              output_bucket = bucket
                              
                          stem_mode = "6-stems" 
                          connection_id = ""
                          try:
                              head_response = s3_client.head_object(Bucket=bucket, Key=key)
                              if 'Metadata' in head_response:
                                  if 'stem-mode' in head_response['Metadata']:
                                      stem_mode = head_response['Metadata']['stem-mode']
                                  if 'connection-id' in head_response['Metadata']:
                                      connection_id = head_response['Metadata']['connection-id']
                          except Exception as meta_e:
                              print(f"Could not retrieve metadata for {key}. Error: {meta_e}")
          
                          safe_key = key.split('/')[-1].replace('.', '_').replace('-', '_')[:30]
                          job_name = f"demucs_{safe_key}_{uuid.uuid4().hex[:6]}"
                          
                          response = batch_client.submit_job(
                              jobName=job_name,
                              jobQueue=job_queue,
                              jobDefinition=job_definition,
                              containerOverrides={
                                  'environment': [
                                      {'name': 'INPUT_BUCKET', 'value': bucket},
                                      {'name': 'OUTPUT_BUCKET', 'value': output_bucket},
                                      {'name': 'FILE_KEY', 'value': key},
                                      {'name': 'STEM_MODE', 'value': stem_mode},
                                      {'name': 'CONNECTION_ID', 'value': connection_id},
                                      {'name': 'WEBSOCKET_API_URL', 'value': str(websocket_url)} 
                                  ]
                              }
                          )
                          print(f"Successfully submitted job {response['jobId']}")
                          
                  return {'statusCode': 200, 'body': json.dumps('Successfully submitted AWS Batch job(s).')}
              except Exception as e:
                  print(f"Error submitting batch job: {e}")
                  return {'statusCode': 500, 'body': json.dumps(f"Error: {str(e)}")}
      Environment:
        Variables:
          BATCH_JOB_QUEUE: !Ref BatchJobQueue
          BATCH_JOB_DEFINITION: !Ref BatchJobDefinition
          OUTPUT_BUCKET: !Ref ProcessedBucket
          WEBSOCKET_API_URL: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/dev"

  S3toBatchInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt S3toBatchLambda.Arn
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::clouddsp-incoming-audio-${AWS::AccountId}-${AWS::Region}"

  # ==========================================
  # 2. HTTP UPLOAD API & LAMBDA
  # ==========================================
  IngestionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3PutObjectPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::clouddsp-incoming-audio-${AWS::AccountId}-${AWS::Region}/*"

  IngestionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CloudDSP-GenerateIngestion
      Handler: index.lambda_handler
      Role: !GetAtt IngestionLambdaRole.Arn
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import uuid
          
          s3_client = boto3.client('s3')
          BUCKET_NAME = os.environ.get('INCOMING_BUCKET_NAME')
          
          def lambda_handler(event, context):
              query_params = event.get('queryStringParameters', {}) or {}
              file_name = query_params.get('filename')
              file_type = query_params.get('filetype') 
              connection_id = query_params.get('connectionId', 'unknown')
              stem_mode = query_params.get('stemMode', '6-stems')
          
              try:
                  safe_file_name = file_name if file_name else "unnamed_file"
                  file_key = f"uploads/{uuid.uuid4()}-{safe_file_name}"
                  content_type = file_type if file_type else 'application/octet-stream'
          
                  presigned_url = s3_client.generate_presigned_url(
                      ClientMethod='put_object',
                      Params={
                          'Bucket': BUCKET_NAME, 
                          'Key': file_key,
                          'ContentType': content_type,
                          'Metadata': {
                              'connection-id': connection_id,
                              'stem-mode': stem_mode
                          }
                      },
                      ExpiresIn=300 
                  )
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          "Access-Control-Allow-Methods": "GET,OPTIONS",
                          "Access-Control-Allow-Headers": "Content-Type",
                          'Content-Type': 'application/json'
                      },
                      'body': json.dumps({
                          'uploadUrl': presigned_url,
                          'key': file_key
                      })
                  }
              except Exception as e:
                  print(f"Error generating pre-signed URL: {e}")
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          "Access-Control-Allow-Methods": "GET,OPTIONS",
                          "Access-Control-Allow-Headers": "Content-Type",
                          'Content-Type': 'application/json'
                      },
                      'body': json.dumps({'error': 'Failed to generate upload URL'})
                  }
      Environment:
        Variables:
          INCOMING_BUCKET_NAME: !Ref IncomingBucket

  IngestionHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CloudDSP-IngestionApi
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type

  LambdaApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IngestionHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt IngestionFunction.Arn
      PayloadFormatVersion: '2.0'

  IngestionApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IngestionHttpApi
      RouteKey: 'GET /upload-url'
      Target: !Join [ "/", [ "integrations", !Ref LambdaApiIntegration ] ]

  IngestionApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref IngestionHttpApi
      StageName: '$default'
      AutoDeploy: true

  IngestionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt IngestionFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IngestionHttpApi}/*/*"


  # ==========================================
  # 3. WEBSOCKET API & LAMBDA
  # ==========================================
  WebSocketLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiGatewayManageConnections
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*"

  EchoConnectionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CloudDSP-WebSocketEcho
      Handler: index.lambda_handler
      Role: !GetAtt WebSocketLambdaRole.Arn
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import boto3

          def lambda_handler(event, context):
              request_context = event.get('requestContext', {})
              connection_id = request_context.get('connectionId')
              domain_name = request_context.get('domainName')
              stage = request_context.get('stage')
              
              if not connection_id or not domain_name:
                  return {'statusCode': 400, 'body': 'Missing connection context.'}
                  
              endpoint_url = f"https://{domain_name}/{stage}"
              apigw_client = boto3.client('apigatewaymanagementapi', endpoint_url=endpoint_url)
              
              payload = json.dumps({
                  "type": "connected",
                  "connectionId": connection_id
              })
              
              try:
                  apigw_client.post_to_connection(
                      ConnectionId=connection_id,
                      Data=payload
                  )
              except Exception as e:
                  print(f"Expected failure if $connect phase: {e}")
                  
              return {'statusCode': 200, 'body': 'Successfully processed'}

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CloudDSP-WebSocketApi
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EchoConnectionLambda.Arn}/invocations"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$default"
      Target: !Join [ "/", [ "integrations", !Ref DefaultIntegration ] ]
      
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$connect"
      Target: !Join [ "/", [ "integrations", !Ref DefaultIntegration ] ]

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$disconnect"
      Target: !Join [ "/", [ "integrations", !Ref DefaultIntegration ] ]

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: dev
      AutoDeploy: true

  WebSocketLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt EchoConnectionLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*"

Outputs:
  IncomingBucketName:
    Description: Name of the incoming audio S3 bucket
    Value: !Ref IncomingBucket
  ProcessedBucketName:
    Description: Name of the processed audio S3 bucket
    Value: !Ref ProcessedBucket
  UploadApiEndpoint:
    Description: "HTTP API endpoint URL for getting pre-signed URLs"
    Value: !Sub "https://${IngestionHttpApi}.execute-api.${AWS::Region}.amazonaws.com/upload-url"
  UploadLambdaFunctionName:
    Value: !Ref IngestionFunction
  WebSocketEndpoint:
    Description: "The wss:// URL for the WebSocket API to paste into App.jsx"
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
  WebSocketLambdaFunctionName:
    Value: !Ref EchoConnectionLambda
