AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Private S3-backed static-site and demo-asset hosting with CloudFront OAC,
  ACM DNS validation, Route 53 aliases, HTTPS-only delivery, and a
  www-to-apex redirect.

Parameters:
  ProjectName:
    Type: String
    Default: clouddsp
    Description: Lowercase project name used in globally unique S3 bucket names.
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'

  EnvironmentName:
    Type: String
    Default: dev
    Description: Deployment environment, such as dev, staging, or prod.
    AllowedPattern: '^[a-z][a-z0-9-]{0,15}$'

  WebsiteDomainName:
    Type: String
    Description: Apex domain served by the distribution, for example y1ktor.com.
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'

  HostedZoneId:
    Type: String
    Description: Route 53 public hosted-zone ID for WebsiteDomainName (without /hostedzone/).
    AllowedPattern: '^Z[A-Z0-9]+$'

  CloudFrontPriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront edge-location coverage. PriceClass_100 is the lowest-cost option.

  ContentSecurityPolicy:
    Type: String
    Default: ''
    Description: >-
      Optional full Content-Security-Policy header. When publishing CloudDSP,
      pass the exact policy generated by frontend-react/csp.js.

  WebAclArn:
    Type: String
    Default: ''
    Description: >-
      Optional AWS WAFv2 Web ACL ARN in us-east-1. Leave empty to use only
      CloudFront and AWS Shield Standard's included protections.

  ExistingWebsiteBucketName:
    Type: String
    Default: ''
    Description: >-
      Existing private website bucket to reuse after a retained-stack
      recovery. Leave empty during a clean deployment so this stack creates
      and manages the bucket.

  ExistingDemoAssetsBucketName:
    Type: String
    Default: ''
    Description: >-
      Existing private demo-assets bucket to reuse after a retained-stack
      recovery. Leave empty during a clean deployment so this stack creates
      and manages the bucket.

  CloudFrontAliasHostedZoneId:
    Type: String
    Default: Z2FDTNDATAQYW2
    Description: AWS-owned Route 53 hosted-zone ID for CloudFront alias records.

Conditions:
  HasContentSecurityPolicy: !Not [!Equals [!Ref ContentSecurityPolicy, '']]
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, '']]
  UseExistingWebsiteBucket: !Not [!Equals [!Ref ExistingWebsiteBucketName, '']]
  UseExistingDemoAssetsBucket: !Not [!Equals [!Ref ExistingDemoAssetsBucketName, '']]
  CreateWebsiteBucket: !Equals [!Ref ExistingWebsiteBucketName, '']
  CreateDemoAssetsBucket: !Equals [!Ref ExistingDemoAssetsBucketName, '']

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Condition: CreateWebsiteBucket
    # Retain successful site content if a stack is deliberately deleted, while
    # allowing an initial create rollback to clean up the newly named bucket.
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-website-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: RemoveExpiredDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: hosting

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !If [UseExistingWebsiteBucket, !Ref ExistingWebsiteBucketName, !Ref WebsiteBucket]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !If
                - UseExistingWebsiteBucket
                - !Sub 'arn:${AWS::Partition}:s3:::${ExistingWebsiteBucketName}'
                - !GetAtt WebsiteBucket.Arn
              - !If
                - UseExistingWebsiteBucket
                - !Sub 'arn:${AWS::Partition}:s3:::${ExistingWebsiteBucketName}/*'
                - !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !If
              - UseExistingWebsiteBucket
              - !Sub 'arn:${AWS::Partition}:s3:::${ExistingWebsiteBucketName}/*'
              - !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

  DemoAssetsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateDemoAssetsBucket
    # Curated demo jobs outlive the short retention window used for user jobs.
    # Retain successfully published examples when the hosting stack is removed.
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${EnvironmentName}-demo-assets-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: RemoveExpiredDeleteMarkers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: demo-assets

  DemoAssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !If [UseExistingDemoAssetsBucket, !Ref ExistingDemoAssetsBucketName, !Ref DemoAssetsBucket]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !If
                - UseExistingDemoAssetsBucket
                - !Sub 'arn:${AWS::Partition}:s3:::${ExistingDemoAssetsBucketName}'
                - !GetAtt DemoAssetsBucket.Arn
              - !If
                - UseExistingDemoAssetsBucket
                - !Sub 'arn:${AWS::Partition}:s3:::${ExistingDemoAssetsBucketName}/*'
                - !Sub '${DemoAssetsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !If
              - UseExistingDemoAssetsBucket
              - !Sub 'arn:${AWS::Partition}:s3:::${ExistingDemoAssetsBucketName}/*'
              - !Sub '${DemoAssetsBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

  WebsiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref WebsiteDomainName
      SubjectAlternativeNames:
        - !Sub 'www.${WebsiteDomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref WebsiteDomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${WebsiteDomainName}'
          HostedZoneId: !Ref HostedZoneId
      CertificateTransparencyLoggingPreference: ENABLED
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: hosting

  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${EnvironmentName}-website-s3-oac'
        Description: !Sub
          - 'CloudFront access to ${BucketName} only.'
          - BucketName: !If [UseExistingWebsiteBucket, !Ref ExistingWebsiteBucketName, !Ref WebsiteBucket]
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DemoAssetsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${EnvironmentName}-demo-assets-s3-oac'
        Description: !Sub
          - 'CloudFront access to ${BucketName} only.'
          - BucketName: !If [UseExistingDemoAssetsBucket, !Ref ExistingDemoAssetsBucketName, !Ref DemoAssetsBucket]
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-${EnvironmentName}-website-security-headers'
        Comment: Security headers for the private S3 static-site distribution.
        SecurityHeadersConfig:
          ContentSecurityPolicy: !If
            - HasContentSecurityPolicy
            - ContentSecurityPolicy: !Ref ContentSecurityPolicy
              Override: true
            - !Ref AWS::NoValue
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true

  WebsiteCanonicalRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-website-router'
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub 'Canonicalize www.${WebsiteDomainName} and route known React pages.'
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        async function handler(event) {
          const request = event.request;
          const host = request.headers.host.value;

          if (host === 'www.${WebsiteDomainName}') {
            const query = request.rawQueryString();
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: {
                  value: 'https://${WebsiteDomainName}' + request.uri + (query ? '?' + query : '')
                },
                'cache-control': { value: 'max-age=3600' }
              }
            };
          }

          const reactRoutes = {
            '/architecture': true,
            '/architecture/': true,
            '/stems': true,
            '/stems/': true
          };
          if (reactRoutes[request.uri]) {
            request.uri = '/index.html';
          }

          return request;
        }

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref WebsiteDomainName
          - !Sub 'www.${WebsiteDomainName}'
        Comment: !Sub 'Static site for ${WebsiteDomainName}.'
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebsiteCanonicalRedirectFunction.FunctionARN
          ResponseHeadersPolicyId: !Ref WebsiteResponseHeadersPolicy
          TargetOriginId: WebsiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
        CacheBehaviors:
          - PathPattern: demo/*
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt WebsiteCanonicalRedirectFunction.FunctionARN
            ResponseHeadersPolicyId: !Ref WebsiteResponseHeadersPolicy
            TargetOriginId: DemoAssetsS3Origin
            ViewerProtocolPolicy: redirect-to-https
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !If
              - UseExistingWebsiteBucket
              - !Sub '${ExistingWebsiteBucketName}.s3.${AWS::Region}.amazonaws.com'
              - !GetAtt WebsiteBucket.RegionalDomainName
            Id: WebsiteS3Origin
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - DomainName: !If
              - UseExistingDemoAssetsBucket
              - !Sub '${ExistingDemoAssetsBucketName}.s3.${AWS::Region}.amazonaws.com'
              - !GetAtt DemoAssetsBucket.RegionalDomainName
            Id: DemoAssetsS3Origin
            OriginAccessControlId: !GetAtt DemoAssetsOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: !Ref CloudFrontPriceClass
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          AcmCertificateArn: !Ref WebsiteCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref 'AWS::NoValue']

  ApexARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WebsiteDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: !Ref CloudFrontAliasHostedZoneId
        EvaluateTargetHealth: false

  ApexAAAARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WebsiteDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: !Ref CloudFrontAliasHostedZoneId
        EvaluateTargetHealth: false

  WwwARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${WebsiteDomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: !Ref CloudFrontAliasHostedZoneId
        EvaluateTargetHealth: false

  WwwAAAARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${WebsiteDomainName}'
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt WebsiteDistribution.DomainName
        HostedZoneId: !Ref CloudFrontAliasHostedZoneId
        EvaluateTargetHealth: false

Outputs:
  WebsiteBucketName:
    Description: Private S3 bucket to receive the built static-site files.
    Value: !If [UseExistingWebsiteBucket, !Ref ExistingWebsiteBucketName, !Ref WebsiteBucket]

  WebsiteBucketArn:
    Description: ARN of the private static-site bucket.
    Value: !If
      - UseExistingWebsiteBucket
      - !Sub 'arn:${AWS::Partition}:s3:::${ExistingWebsiteBucketName}'
      - !GetAtt WebsiteBucket.Arn

  DemoAssetsBucketName:
    Description: Private S3 bucket containing curated anonymous demo-job assets.
    Value: !If [UseExistingDemoAssetsBucket, !Ref ExistingDemoAssetsBucketName, !Ref DemoAssetsBucket]

  DemoAssetsBucketArn:
    Description: ARN of the private curated demo-assets bucket.
    Value: !If
      - UseExistingDemoAssetsBucket
      - !Sub 'arn:${AWS::Partition}:s3:::${ExistingDemoAssetsBucketName}'
      - !GetAtt DemoAssetsBucket.Arn

  CloudFrontDistributionId:
    Description: CloudFront distribution ID for cache invalidations.
    Value: !Ref WebsiteDistribution

  CloudFrontDomainName:
    Description: CloudFront distribution domain name.
    Value: !GetAtt WebsiteDistribution.DomainName

  WebsiteUrl:
    Description: Canonical HTTPS website URL.
    Value: !Sub 'https://${WebsiteDomainName}'

  WebsiteCertificateArn:
    Description: ACM certificate covering the apex and www names.
    Value: !Ref WebsiteCertificate
