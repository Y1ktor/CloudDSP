Outputs:
  UploadsBucketName:
    Description: Private bucket for original user uploads.
    Value: !Ref UploadsBucket
    Export:
      Name: !Sub '${AWS::StackName}-UploadsBucketName'

  UploadsBucketArn:
    Description: ARN of the original-upload bucket.
    Value: !GetAtt UploadsBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UploadsBucketArn'

  ProcessedAudioBucketName:
    Description: Private bucket for stems, MIDI, and other processed artifacts.
    Value: !Ref ProcessedAudioBucket
    Export:
      Name: !Sub '${AWS::StackName}-ProcessedAudioBucketName'

  ProcessedAudioBucketArn:
    Description: ARN of the processed-audio bucket.
    Value: !GetAtt ProcessedAudioBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ProcessedAudioBucketArn'

  BasicPitchRepositoryUri:
    Description: ECR image URI for the Basic Pitch Lambda image.
    Value: !GetAtt BasicPitchRepository.RepositoryUri

  ADTOFRepositoryUri:
    Description: ECR image URI for the ADTOF Lambda image.
    Value: !GetAtt ADTOFRepository.RepositoryUri

  DemucsRepositoryUri:
    Description: ECR image URI for the Demucs Batch image.
    Value: !GetAtt DemucsRepository.RepositoryUri

  MadmomRepositoryUri:
    Description: ECR image URI for the Madmom Lambda image.
    Value: !GetAtt MadmomRepository.RepositoryUri

  YtDlpRepositoryUri:
    Description: ECR image URI for the yt-dlp Lambda image.
    Value: !GetAtt YtDlpRepository.RepositoryUri
