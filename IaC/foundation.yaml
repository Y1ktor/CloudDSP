          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Remove untagged image layers after seven days.",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep the ten most recent images.",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
