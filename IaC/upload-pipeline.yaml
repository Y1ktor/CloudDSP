AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudDSP: User Upload Pipeline (S3 Buckets, API Gateway, and Pre-signed URL Lambda)'

Parameters:
  PedalboardLayerArn:
    Type: String
    Description: 'The ARN of the Lambda Layer containing Pedalboard, Numpy, etc.'
    Default: 'arn:aws:lambda:us-east-1:512383926199:layer:AudioProcessingPedalboard'

Resources:
  # ==========================================
  # 1. STORAGE LAYER (S3 Buckets)
  # ==========================================
  IncomingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "clouddsp-incoming-audio-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "clouddsp-processed-audio-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ==========================================
  # 2. IAM EXECUTION ROLE
  # ==========================================
  IngestionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3PutObjectPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::clouddsp-incoming-audio-${AWS::AccountId}-${AWS::Region}/*"

  # ==========================================
  # 3. COMPUTE LAYER (Pre-signed URL Lambda)
  # ==========================================
  IngestionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CloudDSP-GenerateIngestion
      Handler: index.lambda_handler
      Role: !GetAtt IngestionLambdaRole.Arn
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import uuid
          
          # Initialize the S3 client outside the handler
          s3_client = boto3.client('s3')
          
          # Pull the bucket name from the environment variable (set by CloudFormation)
          BUCKET_NAME = os.environ.get('INCOMING_BUCKET_NAME')
          
          def lambda_handler(event, context):
          
              # Parse query parameters from frontend request
              query_params = event.get('queryStringParameters', {}) or {}
              file_name = query_params.get('filename')
              file_type = query_params.get('filetype') # e.g., audio/wav, audio/mpeg
          
              try:
          
                  # Ensure we have a valid filename and construct the key
                  safe_file_name = file_name if file_name else "unnamed_file"
                  file_key = f"uploads/{uuid.uuid4()}-{safe_file_name}"
                  
                  # Use provided file type or fallback to a generic binary stream
                  content_type = file_type if file_type else 'application/octet-stream'
          
                  # Generate the pre-signed URL for a PUT request
                  presigned_url = s3_client.generate_presigned_url(
                      ClientMethod='put_object',
                      Params={
                          'Bucket': BUCKET_NAME, # Using the Environment Variable
                          'Key': file_key,
                          'ContentType': content_type
                      },
                      ExpiresIn=300 # URL expires in 5 minutes
                  )
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          "Access-Control-Allow-Methods": "GET,OPTIONS",
                          "Access-Control-Allow-Headers": "Content-Type",
                          'Content-Type': 'application/json'
                      },
                      'body': json.dumps({
                          'uploadUrl': presigned_url,
                          'key': file_key
                      })
                  }
              except Exception as e:
                  print(f"Error generating pre-signed URL: {e}")
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          "Access-Control-Allow-Methods": "GET,OPTIONS",
                          "Access-Control-Allow-Headers": "Content-Type",
                          'Content-Type': 'application/json'
                      },
                      'body': json.dumps({'error': 'Failed to generate upload URL'})
                  }
      Environment:
        Variables:
          INCOMING_BUCKET_NAME: !Ref IncomingBucket

  # ==========================================
  # 4. INGESTION API (API Gateway V2)
  # ==========================================
  IngestionHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CloudDSP-IngestionApi
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # 5. API Gateway Integration with Lambda
  LambdaApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IngestionHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt IngestionFunction.Arn
      PayloadFormatVersion: '2.0'

  # 6. API Gateway Route (GET /upload-url)
  IngestionApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IngestionHttpApi
      RouteKey: 'GET /upload-url'
      Target: !Join [ "/", [ "integrations", !Ref LambdaApiIntegration ] ]

  # 7. API Gateway Stage (Auto-deploy)
  IngestionApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref IngestionHttpApi
      StageName: '$default'
      AutoDeploy: true

  # 8. Lambda Permission to allow API Gateway to invoke it
  IngestionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt IngestionFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IngestionHttpApi}/*/*"

  # ==========================================
  # 5. SQS PROCESSING QUEUE
  # ==========================================
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 960
      MessageRetentionPeriod: 86400

  # ==========================================
  # 6. SQS API GATEWAY INTEGRATION
  # ==========================================
  ApiGatewaySqsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SqsPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ProcessingQueue.Arn

  SqsApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IngestionHttpApi
      IntegrationType: AWS_PROXY
      IntegrationSubtype: SQS-SendMessage
      CredentialsArn: !GetAtt ApiGatewaySqsRole.Arn
      PayloadFormatVersion: '1.0'
      RequestParameters:
        QueueUrl: !Ref ProcessingQueue
        MessageBody: "$request.body"

  ApplyEffectApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IngestionHttpApi
      RouteKey: 'POST /apply-effect'
      Target: !Join [ "/", [ "integrations", !Ref SqsApiIntegration ] ]

  # ==========================================
  # 7. DSP COMPUTE LAYER (Worker Lambda)
  # ==========================================
  DspWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
      Policies:
        - PolicyName: S3AudioAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::clouddsp-incoming-audio-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::clouddsp-processed-audio-${AWS::AccountId}-${AWS::Region}/*"

  DspWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CloudDSP-AudioProcessor
      Handler: dsp.lambda_handler
      Role: !GetAtt DspWorkerRole.Arn
      Runtime: python3.11
      Timeout: 900 # 15 minutes max
      MemorySize: 2048 # High memory for faster DSP processing
      EphemeralStorage:
        Size: 2048 # 2GB of /tmp storage for handling large audio files
      Layers:
        - !Ref PedalboardLayerArn
      Code:
        # Placeholder: This code will be packaged and uploaded via AWS CLI/SAM
        # Pointing to the directory where dsp.py lives
        S3Bucket: placeholder
        S3Key: placeholder
      Environment:
        Variables:
          INCOMING_BUCKET_NAME: !Ref IncomingBucket
          PROCESSED_BUCKET_NAME: !Ref ProcessedBucket

  DspSqsEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ProcessingQueue.Arn
      FunctionName: !GetAtt DspWorkerFunction.Arn
      BatchSize: 10 
      Enabled: true

# ==========================================
# OUTPUTS
# ==========================================
Outputs:
  ApiEndpoint:
    Description: "HTTP API endpoint URL"
    Value: !Sub "https://${IngestionHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  IncomingBucketName:
    Description: Name of the incoming audio S3 bucket
    Value: !Ref IncomingBucket
  ProcessedBucketName:
    Description: Name of the processed audio S3 bucket
    Value: !Ref ProcessedBucket
  LambdaFunctionName:
    Value: !Ref IngestionFunction
  LambdaRoleArn:
    Value: !GetAtt IngestionLambdaRole.Arn
  ProcessingQueueUrl:
    Description: URL of the SQS queue for processing
    Value: !Ref ProcessingQueue
  ProcessingQueueArn:
    Description: ARN of the SQS queue for processing
    Value: !GetAtt ProcessingQueue.Arn
