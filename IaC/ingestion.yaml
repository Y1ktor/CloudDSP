AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CloudDSP linked-source ingestion. Runs yt-dlp in a Lambda container, writes
  the durable job input key in the uploads bucket, then lets the existing S3
  EventBridge rule submit the Demucs Batch workload.

Parameters:
  ProjectName:
    Type: String
    Default: clouddsp
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,31}$'

  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]{0,15}$'

  YtDlpImageUri:
    Type: String
    Description: ECR image URI for the yt-dlp Lambda image.

  YtDlpProxyUrl:
    Type: String
    NoEcho: true
    Description: >-
      Optional residential proxy URL supplied only at deployment time. When
      set, CloudFormation writes it as an encrypted Parameter Store
      SecureString; the yt-dlp Lambda receives only the parameter name. Leave
      empty to allow direct egress.

  AllowedMediaHosts:
    Type: CommaDelimitedList
    Default: youtube.com,youtu.be,bilibili.com,b23.tv,soundcloud.com,on.soundcloud.com
    Description: Reviewed linked-media page hosts accepted by the worker.

  UploadsBucketName:
    Type: String
    Description: Source-upload bucket name from the foundation component.

  UploadsBucketArn:
    Type: String
    Description: Source-upload bucket ARN from the foundation component.

  JobsTableName:
    Type: String
    Description: Durable jobs table name from the jobs component.

  JobsTableArn:
    Type: String
    Description: Durable jobs table ARN from the jobs component.

  ConnectionsTableName:
    Type: String
    Description: WebSocket connection registry table name from the realtime component.

  ConnectionsTableArn:
    Type: String
    Description: WebSocket connection registry table ARN from the realtime component.

  UserConnectionsIndexName:
    Type: String
    Default: user_id-last_seen_at-index
    Description: Connection-table index used for job-update notifications.

  WebSocketApiId:
    Type: String
    Description: API Gateway WebSocket API ID from the realtime component.

  YtDlpMemoryMiB:
    Type: Number
    Default: 3008
    MinValue: 1024
    MaxValue: 3008
    Description: Memory allocated to the yt-dlp Lambda.

  YtDlpTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 1
    MaxValue: 900
    Description: Maximum source-download and conversion duration.

  YtDlpEphemeralStorageMiB:
    Type: Number
    Default: 4096
    MinValue: 512
    MaxValue: 10240
    Description: Storage for the downloaded source plus its converted WAV output.

  MaxSourceDurationSeconds:
    Type: Number
    Default: 500
    MinValue: 1
    MaxValue: 3600
    Description: Maximum media duration accepted by yt-dlp.

  MaxSourceDownloadBytes:
    Type: Number
    Default: 268435456
    MinValue: 1
    MaxValue: 1073741824
    Description: Maximum encoded linked-media download size in bytes.

  MaxConvertedWavBytes:
    Type: Number
    Default: 134217728
    MinValue: 1
    MaxValue: 1073741824
    Description: Maximum normalized WAV size in bytes before yt-dlp uploads to S3.

Conditions:
  HasYtDlpProxyUrl: !Not
    - !Equals
      - !Ref YtDlpProxyUrl
      - ''

Resources:
  # AWS::SSM::Parameter does not support the SecureString parameter type. This
  # narrowly scoped custom resource stores the NoEcho deployment value under a
  # customer-managed KMS key without placing it in the worker configuration.
  YtDlpProxyParameterKey:
    Type: AWS::KMS::Key
    Condition: HasYtDlpProxyUrl
    Properties:
      Description: !Sub 'Encrypts the ${ProjectName}-${EnvironmentName} yt-dlp proxy credential.'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: ingestion

  YtDlpProxyParameterKeyAlias:
    Type: AWS::KMS::Alias
    Condition: HasYtDlpProxyUrl
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${EnvironmentName}-yt-dlp-proxy-parameter'
      TargetKeyId: !Ref YtDlpProxyParameterKey

  YtDlpProxyParameterWriterLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasYtDlpProxyUrl
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-YtDlpProxyParameterWriter'
      RetentionInDays: 7

  YtDlpProxyParameterWriterRole:
    Type: AWS::IAM::Role
    Condition: HasYtDlpProxyUrl
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-YtDlpProxyParameterWriterRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${EnvironmentName}-YtDlpProxyParameterWrite'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${EnvironmentName}/yt-dlp/proxy-url'
              - Effect: Allow
                Action: kms:Encrypt
                Resource: !GetAtt YtDlpProxyParameterKey.Arn

  YtDlpProxyParameterWriterFunction:
    Type: AWS::Lambda::Function
    Condition: HasYtDlpProxyUrl
    DependsOn: YtDlpProxyParameterWriterLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-YtDlpProxyParameterWriter'
      Description: Writes the deployment proxy credential to an encrypted SSM SecureString.
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: index.handler
      Role: !GetAtt YtDlpProxyParameterWriterRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import urllib.request

          import boto3


          def respond(event, context, status, physical_id, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or "See CloudWatch Logs for details.",
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": True,
              }).encode("utf-8")
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=body,
                  method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))},
              )
              with urllib.request.urlopen(request) as response:
                  response.read()


          def handler(event, context):
              properties = event["ResourceProperties"]
              parameter_name = properties["ParameterName"]
              physical_id = event.get("PhysicalResourceId", parameter_name)
              client = boto3.client("ssm")
              try:
                  if event["RequestType"] in {"Create", "Update"}:
                      client.put_parameter(
                          Name=parameter_name,
                          Value=properties["ProxyUrl"],
                          Type="SecureString",
                          KeyId=properties["KeyId"],
                          Tier="Standard",
                          Overwrite=True,
                      )
                  elif event["RequestType"] == "Delete":
                      try:
                          client.delete_parameter(Name=parameter_name)
                      except client.exceptions.ParameterNotFound:
                          pass
                  respond(event, context, "SUCCESS", physical_id)
              except Exception as error:
                  # Never log the custom-resource properties: ProxyUrl is one.
                  print(f"SecureString custom resource failed: {type(error).__name__}")
                  respond(
                      event,
                      context,
                      "FAILED",
                      physical_id,
                      "Unable to manage the encrypted yt-dlp proxy parameter.",
                  )
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: ingestion

  YtDlpProxySecureString:
    Type: Custom::CloudDSPYtDlpProxySecureString
    Condition: HasYtDlpProxyUrl
    Properties:
      ServiceToken: !GetAtt YtDlpProxyParameterWriterFunction.Arn
      ParameterName: !Sub '/${ProjectName}/${EnvironmentName}/yt-dlp/proxy-url'
      KeyId: !GetAtt YtDlpProxyParameterKey.Arn
      ProxyUrl: !Ref YtDlpProxyUrl

  YtDlpIngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${EnvironmentName}-YtDlpIngestion'
      RetentionInDays: 30

  YtDlpIngestionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-YtDlpIngestionRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${EnvironmentName}-YtDlpWriteDurableInput'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # HeadObject returns a useful 404 for an absent retry target
              # only when the caller can list the relevant key prefix.
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Ref UploadsBucketArn
                Condition:
                  StringLike:
                    s3:prefix:
                      - uploads/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${UploadsBucketArn}/uploads/*'
        - PolicyName: !Sub '${ProjectName}-${EnvironmentName}-YtDlpUpdateJobs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !Ref JobsTableArn
        - PolicyName: !Sub '${ProjectName}-${EnvironmentName}-YtDlpNotifySubscribers'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub '${ConnectionsTableArn}/index/*'
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApiId}/${EnvironmentName}/POST/@connections/*'
        - !If
          - HasYtDlpProxyUrl
          - PolicyName: !Sub '${ProjectName}-${EnvironmentName}-YtDlpReadProxySecureString'
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: ssm:GetParameter
                  Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${EnvironmentName}/yt-dlp/proxy-url'
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource: !GetAtt YtDlpProxyParameterKey.Arn
          - !Ref AWS::NoValue

  YtDlpIngestionFunction:
    Type: AWS::Lambda::Function
    DependsOn: YtDlpIngestionLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-YtDlpIngestion'
      Description: Downloads a linked source into a durable CloudDSP uploads key.
      PackageType: Image
      Architectures:
        - x86_64
      Role: !GetAtt YtDlpIngestionRole.Arn
      Code:
        ImageUri: !Ref YtDlpImageUri
      MemorySize: !Ref YtDlpMemoryMiB
      Timeout: !Ref YtDlpTimeoutSeconds
      EphemeralStorage:
        Size: !Ref YtDlpEphemeralStorageMiB
      Environment:
        Variables:
          UPLOADS_BUCKET_NAME: !Ref UploadsBucketName
          JOBS_TABLE_NAME: !Ref JobsTableName
          CONNECTIONS_TABLE_NAME: !Ref ConnectionsTableName
          USER_CONNECTIONS_INDEX_NAME: !Ref UserConnectionsIndexName
          WEBSOCKET_API_URL: !Sub 'https://${WebSocketApiId}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}'
          MAX_SOURCE_DURATION_SECONDS: !Sub '${MaxSourceDurationSeconds}'
          MAX_SOURCE_DOWNLOAD_BYTES: !Sub '${MaxSourceDownloadBytes}'
          MAX_CONVERTED_WAV_BYTES: !Sub '${MaxConvertedWavBytes}'
          PROXY_SSM_PARAMETER_NAME: !If
            - HasYtDlpProxyUrl
            - !Sub '/${ProjectName}/${EnvironmentName}/yt-dlp/proxy-url'
            - ''
          ALLOWED_MEDIA_HOSTS: !Join [',', !Ref AllowedMediaHosts]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Component
          Value: ingestion
        - Key: Worker
          Value: yt-dlp

Outputs:
  YtDlpFunctionArn:
    Description: ARN invoked by the Job API for linked-source ingestion.
    Value: !GetAtt YtDlpIngestionFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-YtDlpFunctionArn'

  YtDlpFunctionName:
    Description: Name of the durable yt-dlp ingestion Lambda.
    Value: !Ref YtDlpIngestionFunction
    Export:
      Name: !Sub '${AWS::StackName}-YtDlpFunctionName'
