AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudDSP Infrastructure: S3 Buckets for Audio Processing'

Resources:
  IncomingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "clouddsp-incoming-audio-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - OPTIONS
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "clouddsp-processed-audio-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - OPTIONS
            AllowedOrigins:
              - "*"
            MaxAge: 3000

Outputs:
  IncomingBucketName:
    Description: Name of the incoming audio S3 bucket
    Value: !Ref IncomingBucket
  ProcessedBucketName:
    Description: Name of the processed audio S3 bucket
    Value: !Ref ProcessedBucket
