AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudDSP: Pre-signed URL Generator Lambda and Execution Role'

Parameters:
  IncomingS3BucketName:
    Type: String
    Description: "The exact name of the S3 bucket where incoming audio will be uploaded (e.g., clouddsp-incoming-audio-...)"

Resources:
  # 1. The IAM Execution Role
  IngestionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Standard policy to allow Lambda to write logs to CloudWatch
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3PutObjectPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                # Restrict to the specific incoming bucket (Needs /* at the end for PutObject)
                Resource: !Sub "arn:aws:s3:::${IncomingS3BucketName}/*"

  # ==========================================
  # 2. COMPUTE LAYER (The Pre-signed URL Lambda)
  # ==========================================
  IngestionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CloudDSP-GenerateIngestion
      Handler: index.lambda_handler
      Role: !GetAtt IngestionLambdaRole.Arn
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import uuid
          
          # Initialize the S3 client outside the handler
          s3_client = boto3.client('s3')
          
          # Pull the bucket name from the environment variable (set by CloudFormation)
          BUCKET_NAME = os.environ.get('INCOMING_BUCKET_NAME')
          
          def lambda_handler(event, context):
          
              # Parse query parameters from frontend request
              query_params = event.get('queryStringParameters', {}) or {}
              file_name = query_params.get('filename')
              file_type = query_params.get('filetype') # e.g., audio/wav, audio/mpeg
              connection_id = query_params.get('connectionId', 'unknown')
              stem_mode = query_params.get('stemMode', '6-stems')
          
              try:
          
                  # Ensure we have a valid filename and construct the key
                  safe_file_name = file_name if file_name else "unnamed_file"
                  file_key = f"uploads/{uuid.uuid4()}-{safe_file_name}"
                  
                  # Use provided file type or fallback to a generic binary stream
                  content_type = file_type if file_type else 'application/octet-stream'
          
                  # Generate the pre-signed URL for a PUT request
                  presigned_url = s3_client.generate_presigned_url(
                      ClientMethod='put_object',
                      Params={
                          'Bucket': BUCKET_NAME, # Using the Environment Variable
                          'Key': file_key,
                          'ContentType': content_type,
                          'Metadata': {
                              'connection-id': connection_id,
                              'stem-mode': stem_mode
                          }
                      },
                      ExpiresIn=300 # URL expires in 5 minutes
                  )
                  
                  return {
                      'statusCode': 200,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          "Access-Control-Allow-Methods": "GET,OPTIONS",
                          "Access-Control-Allow-Headers": "Content-Type",
                          'Content-Type': 'application/json'
                      },
                      'body': json.dumps({
                          'uploadUrl': presigned_url,
                          'key': file_key
                      })
                  }
              except Exception as e:
                  print(f"Error generating pre-signed URL: {e}")
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Access-Control-Allow-Origin': '*',
                          "Access-Control-Allow-Methods": "GET,OPTIONS",
                          "Access-Control-Allow-Headers": "Content-Type",
                          'Content-Type': 'application/json'
                      },
                      'body': json.dumps({'error': 'Failed to generate upload URL'})
                  }
      Environment:
        Variables:
          # Passing the exact bucket name to the Lambda environment
          INCOMING_BUCKET_NAME: !Ref IncomingS3BucketName

  # ==========================================
  # 3. INGESTION API (API Gateway V2)
  # ==========================================
  IngestionHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CloudDSP-IngestionApi
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # 4. API Gateway Integration with Lambda
  LambdaApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref IngestionHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt IngestionFunction.Arn
      PayloadFormatVersion: '2.0'

  # 5. API Gateway Route (GET /upload-url)
  IngestionApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref IngestionHttpApi
      RouteKey: 'GET /upload-url'
      Target: !Join [ "/", [ "integrations", !Ref LambdaApiIntegration ] ]

  # 6. API Gateway Stage (Auto-deploy)
  IngestionApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref IngestionHttpApi
      StageName: '$default'
      AutoDeploy: true

  # 7. Lambda Permission to allow API Gateway to invoke it
  IngestionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt IngestionFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IngestionHttpApi}/*/*"

# ==========================================
# OUTPUTS
# ==========================================
Outputs:
  ApiEndpoint:
    Description: "HTTP API endpoint URL for getting pre-signed URLs"
    Value: !Sub "https://${IngestionHttpApi}.execute-api.${AWS::Region}.amazonaws.com/upload-url"
  LambdaFunctionName:
    Value: !Ref IngestionFunction
  LambdaRoleArn:
    Value: !GetAtt IngestionLambdaRole.Arn
