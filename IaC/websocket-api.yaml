AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudDSP: WebSocket API Gateway and EchoConnectionId Lambda'

Resources:
  # ==========================================
  # 1. IAM ROLE FOR LAMBDA
  # ==========================================
  WebSocketLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiGatewayManageConnections
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                # In production, restrict this to specific API ARN, but this works universally for testing
                Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/*"

  # ==========================================
  # 2. THE LAMBDA FUNCTION ($default route)
  # ==========================================
  EchoConnectionLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CloudDSP-WebSocketEcho
      Handler: index.lambda_handler
      Role: !GetAtt WebSocketLambdaRole.Arn
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          import boto3

          def lambda_handler(event, context):
              request_context = event.get('requestContext', {})
              connection_id = request_context.get('connectionId')
              domain_name = request_context.get('domainName')
              stage = request_context.get('stage')
              
              if not connection_id or not domain_name:
                  return {'statusCode': 400, 'body': 'Missing connection context.'}
                  
              endpoint_url = f"https://{domain_name}/{stage}"
              apigw_client = boto3.client('apigatewaymanagementapi', endpoint_url=endpoint_url)
              
              payload = json.dumps({
                  "type": "connected",
                  "connectionId": connection_id
              })
              
              try:
                  # Note: If this is invoked by the $connect route, this will throw a 410 error
                  # because the socket isn't fully established. The except block catches it,
                  # returns 200, and the socket opens anyway.
                  # When React immediately sends {"action": "echo"}, it hits the $default route
                  # and this command works perfectly!
                  apigw_client.post_to_connection(
                      ConnectionId=connection_id,
                      Data=payload
                  )
              except Exception as e:
                  print(f"Expected failure if $connect phase: {e}")
                  
              return {'statusCode': 200, 'body': 'Successfully processed'}

  # ==========================================
  # 3. WEBSOCKET API GATEWAY
  # ==========================================
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CloudDSP-WebSocketApi
      ProtocolType: WEBSOCKET
      # This tells AWS how to route incoming messages. React sends {"action": "echo"}
      RouteSelectionExpression: "$request.body.action"

  # ==========================================
  # 4. LAMBDA INTEGRATION
  # ==========================================
  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EchoConnectionLambda.Arn}/invocations"

  # ==========================================
  # 5. API ROUTES
  # ==========================================
  # 5a. The $default route catches our {"action": "echo"} message
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$default"
      Target: !Join [ "/", [ "integrations", !Ref DefaultIntegration ] ]
      
  # 5b. Required $connect route
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$connect"
      Target: !Join [ "/", [ "integrations", !Ref DefaultIntegration ] ]

  # 5c. Required $disconnect route
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$disconnect"
      Target: !Join [ "/", [ "integrations", !Ref DefaultIntegration ] ]

  # ==========================================
  # 6. STAGE & DEPLOYMENT
  # ==========================================
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: dev
      AutoDeploy: true

  # ==========================================
  # 7. LAMBDA INVOKE PERMISSION
  # ==========================================
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt EchoConnectionLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/*"

# ==========================================
# OUTPUTS
# ==========================================
Outputs:
  WebSocketEndpoint:
    Description: "The wss:// URL for the WebSocket API to paste into App.jsx"
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
