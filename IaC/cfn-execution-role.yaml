AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation Execution Role for CloudDSP Infrastructure Deployment'

Resources:
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudDSP-CloudFormationDeployRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudDSP-InfrastructureDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketNotification
                  - s3:GetBucketNotification
                Resource: '*'
              - Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: '*'

Outputs:
  RoleArn:
    Description: 'ARN of the CloudFormation Execution Role'
    Value: !GetAtt CloudFormationExecutionRole.Arn
